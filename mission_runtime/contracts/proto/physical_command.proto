// 물리 명령 통신 규약 — 와이어 정본 (Interface Specification §3, §8)
//
// implements: AI-C-20, AI-C-07, AI-C-04
//
// 이 파일은 HW 파트의 `hardware/schema/physical_command.proto`(package
// `physical`)와 **필드번호·enum 값·oneof 슬롯·메시지 모양이 같다.**
//
// 2026-11-02: 통합 저장소(choBottle/Physical-Project-mk2)가 그 파일을 저장소의
// **유일한 정본**으로 정하고 다른 파트의 사본을 모두 지웠다. 통합 시 이 파일도
// 지우고 정본에서 생성한 코드만 둔다 — 지금 남겨 두는 이유는 이 저장소가 단독으로
// 생성·검증을 돌려야 하기 때문이고, 그래서 내용은 정본과 필드 단위로 같게 유지한다.
// 생성 명령(저장소 루트에서, grpcio-tools==1.83.1 → gencode 7.35.1):
//   python -m grpc_tools.protoc -I mission_runtime/contracts/proto \
//     --python_out=mission_runtime/contracts/proto \
//     mission_runtime/contracts/proto/physical_command.proto
// 가시화 파트의 `viz-debugger/src/physical/protocol.js` 가 이미 그 번호로
// 인코딩하고 있으므로(2026-09-18 확인) 실제 배포된 인코딩은 HW 쪽이다.
// 2026-09-19 결정: **우리가 HW 쪽에 맞춘다.** 이전 정본(package
// physical_project.ai.v1)은 같은 이름의 다른 규약이어서 enum 값 1이 우리
// 쪽에서는 ACCEPTED, HW 쪽에서는 SUCCEEDED 로 조용히 뒤바뀌었다 — AI-C-20 이
// 수락과 완료를 구분하라고 못 박은 바로 그 지점이었다.
//
// 상위 인지·판단 코드는 이 파일에서 생성된 클래스를 업무 모델로 쓰지 않는다
// (AI-C-07). 의미 계약은 `mission_runtime/contracts/physical_command.py`
// 가 소유하고, 이 와이어 형식과의 대응은
// `mission_runtime/providers/physical_command_protobuf.py` 한 곳에서만
// 명시적으로 이뤄진다.
//
// ── 아직 HW 와 협의가 필요한 자리(여기에 임의로 필드를 추가하지 않는다) ──
// 우리 의미 계약에는 있으나 이 와이어가 실을 자리가 없는 정보다. 번호를
// 우리 마음대로 쓰면 HW 가 나중에 같은 번호를 다른 뜻으로 쓸 때 지금 고치는
// 사고가 그대로 재발하므로, 제안만 적고 사용하지 않는다(spec §8-3).
//   P1 [해소] Command.correlation_id — HW 가 번호 6 을 `traceparent` 로 정했고
//      (정본 proto, 2026-11-02) 우리도 그 번호를 쓴다. 상관 ID 를 그대로 싣는
//      것이 아니라 **유효한 W3C traceparent 일 때만** 싣는다. 업무 책임 추적은
//      여전히 command_id 가 하고 이 칸은 기술 추적 전용이다(AI-B-03).
//   P2 Command.parameters      — map<string,double> 이라 문자열·불리언·중첩
//      파라미터를 못 싣는다. 제안: `map<string,string> parameters_text = 7`
//      또는 공용 Value 타입. HW README §7 도 같은 항목을 협의 대상으로 올려 둠.
//   P3 CommandAcceptance.accepted_at (double) — 제안 번호 4. 장치가 수락한 시각.
//   P4 CommandStatus.observed_at     (double) — 제안 번호 4.
//   P5 CommandResult.completed_at    (double) — 제안 번호 5.
//   P6 CancelCommandResponse.reason  (string) — 제안 번호 3(현재 미사용 번호).
//   P7 Capability — device_id/actions 뿐이라 AI-C-18 선언 항목(입출력 schema,
//      단위·좌표·시간 기준, 취소 가능 여부, 멱등성, 동기/비동기, 버전,
//      품질·지연·자원)을 하나도 못 싣는다. 제안: 별도 CapabilityDetail 메시지.
syntax = "proto3";
package physical;

// 모든 payload 의 최상위 봉투. 어떤 메시지인지는 oneof body 가 결정한다(§2).
// 토픽 이름에는 방향만 담고 종류는 담지 않는다.
message PhysicalCommandEnvelope {
  oneof body {
    Command                 command          = 1;  // 엣지→장치
    CancelCommandRequest    cancel_request   = 2;  // 엣지→장치
    CommandAcceptance       acceptance       = 3;  // 장치→엣지
    CommandStatus           status           = 4;  // 장치→엣지
    CommandResult           result           = 5;  // 장치→엣지
    CancelCommandResponse   cancel_response  = 6;  // 장치→엣지
    Capability              capability       = 7;  // 장치→엣지
  }
}

// 종료 상태 — CommandResult.status 는 반드시 이 셋 중 하나(§4).
// 진행 중 상태(ACCEPTED/EXECUTING/CANCELING)는 이 enum 에 없다. 그 셋은
// CommandStatus.state 의 **문자열 어휘**로 전달한다 — 종료와 비종료를 서로
// 다른 타입으로 갈라 둔 것이 AI-C-20 의 "완료와 진행을 섞지 않는다"에 해당한다.
enum TerminalStatus {
  TERMINAL_STATUS_UNSPECIFIED = 0;
  SUCCEEDED = 1;
  ABORTED   = 2;
  CANCELED  = 3;
}

message Command {
  string command_id = 1;                 // 재전송 식별용 고유값
  string target     = 2;
  string action     = 3;
  map<string, double> parameters = 4;    // 예: {distance: 1.0}
  int64  deadline_unix_ms = 5;           // 선택. 0 이면 없음. 이 시각 넘으면 시작 금지(§5-2)
  // W3C Trace Context. 비어 있으면 받는 쪽이 새 trace 를 시작한다. 번호는 HW 가
  // 정했고(정본 `hardware/schema/physical_command.proto`) 우리는 그 번호를 쓴다.
  // 우리 의미 계약의 `correlation_id` 가 유효한 traceparent 일 때만 이 칸에 싣는다
  // — 아무 문자열이나 넣으면 받는 쪽의 trace 조립이 조용히 깨진다.
  string traceparent = 6;
}

message CancelCommandRequest {
  string command_id = 1;
}

// code 는 자유 문자열이나 gRPC 상태 코드 관례를 따른다(§3):
// INVALID_ARGUMENT, FAILED_PRECONDITION, UNIMPLEMENTED, PERMISSION_DENIED,
// RESOURCE_EXHAUSTED, ALREADY_EXISTS
message Rejection { string code = 1; string message = 2; }
message Failure   { string code = 1; string message = 2; }

// 거부는 실행 상태가 아니라 **수락 결과**다(AI-C-20). accepted=false 로만
// 표현하고 뒤따르는 CommandResult 는 없다.
message CommandAcceptance {
  string    command_id = 1;
  bool      accepted   = 2;
  Rejection rejection  = 3;              // accepted=false 일 때만 의미
}

// 실행 중 중간 상태(선택). state = ACCEPTED | EXECUTING | CANCELING
message CommandStatus {
  string command_id = 1;
  string state      = 2;
  string detail     = 3;
}

message CommandResult {
  string         command_id = 1;
  TerminalStatus status     = 2;         // 반드시 종료 상태(§4)
  map<string, double> result = 3;        // 예: {distance_moved: 1.0}
  Failure        failure    = 4;         // status=ABORTED 일 때 사유
}

// 취소 절차 진입 수락(§4). 아직 멈췄다는 뜻 아님 — 실제 CANCELED 도달은
// CommandResult.status=CANCELED 로 따로 온다(AI-C-20).
message CancelCommandResponse {
  string command_id = 1;
  bool   accepted   = 2;
}

// 장치가 지원하는 action 목록(최초 연결/변경 시). 미선언 action 은 거부(§5-4).
message Capability {
  string device_id = 1;
  repeated string actions = 2;
}
