# 개발·시험 스택의 계측 질의 서버. **구역 엣지 Prometheus 를 흉내낸 것이 아니라 같게
# 적은 것이다** — 통합 저장소 `deploy/edge/config/prometheus.yml` 과 같은 수집 간격·
# 같은 `external_labels`·같은 타깃(Collector 의 prometheus exporter)을 쓴다. 여기서만
# 통하는 값으로 맞춰 두면 시험이 통과하고 사이트에서 실패한다.
#
# 다른 점 하나 — `otel_collector` 잡의 간격만 5초다. 중앙 Prometheus 가 같은 선택을
# 하고 그 이유를 적어 두었다("백엔드 export 15초 × 표본 3 이 되도록 5s",
# `deploy/server/config/prometheus.yml:37-40`). 한 기계가 엣지와 중앙을 겸하는 이
# 스택에서는 중앙 쪽 간격을 따르는 편이 창 안에 표본이 여러 점 들어와
# `MetricQueryEndpoint.step_s`(기본 5초)와 어긋나지 않는다.
#
# 페더레이션은 여기 없다. 중앙이 `/federate` 로 **요약만** 당겨 가는 일은 중앙 쪽
# 설정이고, 그 `match[]` 가 우리 계측을 고르지 않는다는 사실은
# `integration/deployment_topology.py` 의 `FEDERATED_METRIC_NAME_PATTERNS` 가 적는다.
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  external_labels:
    agg_layer: edge

scrape_configs:
  # 우리가 OTLP 로 내보낸 계측이 여기로 나온다(Collector 의 prometheus exporter, :8889).
  # 이것이 `HttpMetricQueryProvider` 가 되짚는 시계열의 유일한 출처다.
  - job_name: otel_collector
    scrape_interval: 5s
    static_configs:
      - targets: ["otel-collector:8889"]

  # Collector 자신의 상태(수신·거부·전송 실패) — 중앙 쪽 `otel_collector_self` 와 같다.
  # 계측이 안 보일 때 "안 보낸 것"과 "Collector 가 거부한 것"을 가르는 자리다.
  - job_name: otel_collector_self
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
