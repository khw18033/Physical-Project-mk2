# 컨테이너 안의 게이트웨이가 **호스트의 docker 와 k3s 를 몰도록** 얹는 덧판.
#
#   AIF_HOST_CONTROL=1 bash tools/backend.sh start
#
# implements: AI-B-03(실행 제어), AI-B-11(여러 실행영역), AI-C-04(provider 경계)
#
# ## 왜 기본이 아닌가 — 이것은 **권한을 주는 일**이다
#
# `/var/run/docker.sock` 을 얹으면 그 컨테이너는 호스트에서 **아무 컨테이너나** 띄울
# 수 있다. 사실상 호스트 root 다. 그래서 기본 구성에는 없고, 쓰는 쪽이 한 번 더
# 말해야 붙는다. 선언된 단위만 띄울 수 있다는 우리 경계(`process_control.py` 는
# 망에서 명령줄을 받지 않는다)는 그대로지만, **그 경계는 우리 코드의 것**이고 소켓을
# 얹는 순간 컨테이너 자체가 가진 힘은 그보다 크다. 둘을 같은 것으로 보지 않는다.
#
# ## 대신 bare 모드도 있다
#
# `AIF_MODE=bare bash tools/backend.sh start` 는 호스트에서 프로세스로 띄운다 —
# 그때는 docker·kubectl 이 원래 그 기계의 것이므로 소켓을 얹을 일이 없다.
# 개발 기계에서는 그쪽이 더 단순하고, 이 덧판은 "컨테이너로만 운영하는 기계" 를 위한
# 것이다.

name: mission-runtime-backend

services:
  gateway:
    volumes:
      # 호스트 docker — `/api/stack` 의 compose 단위가 이걸로 뜬다.
      - /var/run/docker.sock:/var/run/docker.sock
      # k3s 접속 정보와 kubectl. 모델 워크로드 배치(`providers/k3s.py`)가 쓴다.
      - ${KUBECONFIG:-$HOME/.kube/config}:/root/.kube/config:ro
      - /usr/local/bin/kubectl:/usr/local/bin/kubectl:ro
      # compose 단위가 가리키는 파일은 **호스트 경로**로 열린다. 컨테이너 안의
      # 경로를 주면 호스트 docker 가 그 자리를 찾지 못한다 — 같은 트리를 같은
      # 자리에 얹어 두 경로를 일치시킨다.
      - ${PWD}:${PWD}:ro
    working_dir: ${PWD}
    environment:
      KUBECONFIG: /root/.kube/config
