<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>기능 상태 패널 · Function Status Panel</title>
<style>
  /* 외부 자원 없음 — 폐쇄망에서도 그대로 렌더링된다 (AI-C-16). 모든 색은 :root 토큰.
     모든 문자열은 /api/labels(ko/en)에서 온다; API 응답은 id만 싣는다. */
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9;
    --surface: #ffffff;
    --surface-2: #eef0f3;
    --border: #d5d9e0;
    --text: #1b1f27;
    --muted: #5f6673;
    --accent: #2456c9;
    --accent-bg: #e4ebfb;
    --focus: #2456c9;
    --ok-bg: #d9f2e2;     --ok-fg: #14532d;   --ok-line: #57b37c;
    --warn-bg: #fdecc8;   --warn-fg: #6b4400; --warn-line: #d9a23b;
    --bad-bg: #fbdada;    --bad-fg: #7a1616;  --bad-line: #d95b5b;
    --info-bg: #e2e6ee;   --info-fg: #2d3442;
    --changed: #b45309;
    --shadow: 0 8px 28px rgba(0,0,0,.18);
    --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
    --sans: system-ui, -apple-system, "Segoe UI", "Noto Sans KR", "Malgun Gothic", Roboto, sans-serif;
    --radius: 6px;
    --gutter: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b;
      --surface: #1a1e26;
      --surface-2: #232833;
      --border: #333a47;
      --text: #e6e8ec;
      --muted: #9aa3b2;
      --accent: #7ea2ff;
      --accent-bg: #1f2a45;
      --focus: #9db8ff;
      --ok-bg: #143323;   --ok-fg: #9fe1b8;   --ok-line: #3f9c63;
      --warn-bg: #3a2c0d; --warn-fg: #f3cf7a; --warn-line: #b8862b;
      --bad-bg: #3d1717;  --bad-fg: #f3a3a3;  --bad-line: #c24a4a;
      --info-bg: #262c38; --info-fg: #c8cfdb;
      --changed: #f59e0b;
      --shadow: 0 8px 28px rgba(0,0,0,.5);
    }
  }
  * { box-sizing: border-box; }
  html { font-size: 14px; }
  body {
    margin: 0;
    font-family: var(--sans);
    color: var(--text);
    background: var(--bg);
    line-height: 1.45;
    padding-inline: var(--gutter);
    padding-block: 0 24px;
  }
  a { color: var(--accent); }
  button, input { font: inherit; color: inherit; }
  button {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 6px 12px;
    cursor: pointer;
  }
  button:hover { background: var(--surface-2); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.primary:hover { filter: brightness(1.08); }
  button[aria-pressed="true"], button[aria-selected="true"] {
    background: var(--accent-bg); border-color: var(--accent); color: var(--accent); font-weight: 600;
  }
  button:disabled { opacity: .55; cursor: not-allowed; }
  :is(button, input, summary, [tabindex]):focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }
  input[type="number"] {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 5px 8px;
    font-variant-numeric: tabular-nums;
  }
  code, .mono { font-family: var(--mono); font-size: .93em; }
  .num { font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }
  .small { font-size: .82rem; }
  [hidden] { display: none !important; }

  /* --- header ------------------------------------------------------------ */
  header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
    padding-block: 12px 10px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 14px;
    position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 5;
  }
  header h1 { font-size: 1.2rem; margin: 0; font-weight: 650; }
  header h1 small { font-weight: 400; color: var(--muted); font-size: .8rem; margin-left: 6px; }
  .spacer { flex: 1 1 auto; }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; }
  .tabs button { border-radius: 999px; }
  #lang-toggle { font-family: var(--mono); letter-spacing: .04em; padding: 5px 10px; }
  #lang-toggle .on { color: var(--accent); font-weight: 700; }
  #lang-toggle .off { color: var(--muted); }
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 999px;
    font-size: .8rem; font-weight: 600; letter-spacing: .01em; border: 1px solid transparent;
    white-space: nowrap;
  }
  .badge.info { background: var(--info-bg); color: var(--info-fg); }
  .badge.ok { background: var(--ok-bg); color: var(--ok-fg); border-color: var(--ok-line); }
  .badge.warn { background: var(--warn-bg); color: var(--warn-fg); border-color: var(--warn-line); }
  .badge.bad { background: var(--bad-bg); color: var(--bad-fg); border-color: var(--bad-line); }
  .badge.core { background: var(--accent-bg); color: var(--accent); font-size: .72rem; vertical-align: middle; }
  .badge.big { font-size: .9rem; padding: 3px 10px; }

  /* --- layout ------------------------------------------------------------ */
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    min-width: 0;
  }
  .panel h2 { font-size: 1rem; margin: 0 0 10px; font-weight: 650; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .panel h3 { font-size: .82rem; margin: 12px 0 6px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
  .panel p.note { margin: 6px 0 0; color: var(--muted); font-size: .85rem; }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-items: start; }
  @media (max-width: 860px) { .grid2 { grid-template-columns: 1fr; } }
  .empty { color: var(--muted); font-size: .9rem; padding: 6px 0; }
  #error { margin-bottom: 12px; white-space: normal; }
  .whatif-bar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-bottom: 12px; font-size: .9rem; }
  .whatif-bar.active { color: var(--changed); font-weight: 600; }

  /* --- functions --------------------------------------------------------- */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-left: 5px solid var(--border);
    border-radius: var(--radius); padding: 12px 14px; cursor: pointer; min-width: 0;
    display: flex; flex-direction: column; gap: 6px;
  }
  .card:hover { background: var(--surface-2); }
  .card.ok { border-left-color: var(--ok-line); }
  .card.warn { border-left-color: var(--warn-line); }
  .card.bad { border-left-color: var(--bad-line); }
  .card.changed { box-shadow: inset 0 0 0 1px var(--changed); }
  .card .head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .card .name { font-weight: 650; font-size: 1.02rem; }
  .card .desc { color: var(--muted); font-size: .86rem; }
  .card .why { font-size: .86rem; }
  .card .why b { font-weight: 600; }
  .card .id { font-size: .75rem; }
  .arrow { color: var(--muted); }

  /* --- drawer ------------------------------------------------------------ */
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100vw);
    background: var(--surface); border-left: 1px solid var(--border); box-shadow: var(--shadow);
    overflow: auto; z-index: 20; padding: 14px var(--gutter) calc(20px + env(safe-area-inset-bottom, 0px));
    padding-top: calc(14px + env(safe-area-inset-top, 0px));
  }
  .drawer h2 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 1.1rem; margin: 0 0 8px; }
  .drawer .close { margin-left: auto; }
  .drawer h3 { font-size: .82rem; margin: 14px 0 6px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
  .krow { border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 10px; margin-bottom: 6px; }
  .krow.missing { border-color: var(--bad-line); }
  .krow .khead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .krow .kname { font-weight: 600; }
  .krow ul { margin: 4px 0 0; padding-left: 18px; font-size: .88rem; }
  .krow li { margin: 2px 0; }
  .krow .charged { font-weight: 600; }
  .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.25); z-index: 19; }

  /* --- tiers ------------------------------------------------------------- */
  .role-section .role-name { font-size: 1.05rem; }
  .nodes { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .node { border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; min-width: 0; }
  .node h4 { margin: 0 0 6px; font-size: .95rem; font-weight: 600; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .node h4 code { font-weight: 400; }
  .pins { display: flex; flex-wrap: wrap; gap: 6px; }
  .pin {
    display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--surface-2); font-size: .8rem; cursor: pointer;
    font-family: var(--mono);
  }
  .pin.on { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); }
  .pin.static { cursor: default; }
  .pin input { margin: 0; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .fields label { display: flex; flex-direction: column; gap: 3px; font-size: .82rem; color: var(--muted); }
  .checks { display: flex; flex-direction: column; gap: 4px; }
  .checks label { display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 2px 0; }
  .served-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .served-item { display: inline-flex; gap: 6px; align-items: center; padding: 2px 8px; border-radius: 999px; background: var(--ok-bg); color: var(--ok-fg); border: 1px solid var(--ok-line); font-size: .8rem; }
  .served-item.warn { background: var(--warn-bg); color: var(--warn-fg); border-color: var(--warn-line); }
  details { margin-top: 6px; }
  summary { cursor: pointer; font-size: .85rem; color: var(--accent); width: fit-content; padding: 2px 4px; border-radius: 4px; }
  table { border-collapse: collapse; width: 100%; font-size: .87rem; margin-top: 6px; }
  th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: .8rem; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .tablewrap { overflow-x: auto; }

  /* --- events ------------------------------------------------------------ */
  .events { max-height: 320px; overflow: auto; font-size: .85rem; }
  .ev { display: grid; grid-template-columns: 78px 76px 1fr; gap: 8px; padding: 4px 0; border-bottom: 1px dashed var(--border); align-items: start; }
  .ev .t { color: var(--muted); font-variant-numeric: tabular-nums; font-family: var(--mono); font-size: .8rem; }
  .ev .p { font-family: var(--mono); font-size: .8rem; word-break: break-all; color: var(--muted); }
  .ev .n { font-weight: 600; }
  .ev.warning .n { color: var(--warn-fg); }
  .ev.critical .n, .ev.fatal .n, .ev.error .n { color: var(--bad-fg); }

  /* --- developer rows ---------------------------------------------------- */
  #dev-nodes { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .rows { display: flex; flex-direction: column; gap: 8px; }
  .row {
    border: 1px solid var(--border); border-left: 4px solid transparent;
    border-radius: var(--radius); padding: 8px 12px; background: var(--surface);
  }
  .row.changed { border-left-color: var(--changed); }
  .row-head {
    display: grid;
    grid-template-columns: minmax(180px, 1.3fr) auto auto minmax(140px, 1fr) minmax(200px, 2fr);
    gap: 6px 14px; align-items: center;
  }
  @media (max-width: 1100px) { .row-head { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 560px) { .row-head { grid-template-columns: 1fr; } }
  .row .kind { font-family: var(--mono); font-weight: 600; word-break: break-all; }
  .row .chip-label { display: block; font-size: .7rem; color: var(--muted); margin-bottom: 2px; }
  .row .reason .tok { font-weight: 700; }
  .row .reason .data { color: var(--muted); }
  .row-meta { display: flex; flex-wrap: wrap; gap: 4px 18px; margin-top: 6px; font-size: .85rem; color: var(--muted); }
  .row-meta b { color: var(--text); font-weight: 600; }

  /* --- 2nd-round: alias, freshness, trace, executions ---------------------- */
  .alias { font-family: var(--mono); font-size: .72rem; color: var(--muted); margin-left: 4px; vertical-align: middle; }
  .fresh { display: inline-flex; align-items: center; gap: 4px; font-size: .78rem; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface-2); color: var(--muted); white-space: nowrap; }
  .fresh.ok { background: var(--ok-bg); color: var(--ok-fg); border-color: var(--ok-line); }
  .fresh.warn { background: var(--warn-bg); color: var(--warn-fg); border-color: var(--warn-line); }
  .fresh.bad { background: var(--bad-bg); color: var(--bad-fg); border-color: var(--bad-line); }
  .card .tiers { font-size: .84rem; display: flex; flex-direction: column; gap: 2px; }
  .card .tiers b { font-weight: 600; }
  .tree { list-style: none; margin: 0; padding: 0; }
  .tree > li { border-left: 2px solid var(--border); padding: 4px 0 4px 12px; margin: 4px 0; }
  .tree > li.bad { border-left-color: var(--bad-line); }
  .tree > li.warn { border-left-color: var(--warn-line); }
  .tree > li.ok { border-left-color: var(--ok-line); }
  .tree .step { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 2px 0; }
  .tree .step .arrow { color: var(--muted); }
  .tree .sub { margin: 2px 0 0 14px; padding-left: 10px; border-left: 1px dashed var(--border); }
  .tree .fix { font-family: var(--mono); font-size: .85rem; background: var(--accent-bg); color: var(--accent); padding: 1px 8px; border-radius: 999px; }
  .exec-grid { display: grid; grid-template-columns: minmax(280px, 1fr) minmax(0, 1.6fr); gap: 14px; align-items: start; }
  @media (max-width: 960px) { .exec-grid { grid-template-columns: 1fr; } }
  .plan-list { display: flex; flex-direction: column; gap: 6px; max-height: 60vh; overflow: auto; }
  .plan { border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 10px; cursor: pointer; background: var(--surface); }
  .plan:hover { background: var(--surface-2); }
  .plan[aria-selected="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .plan .line { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: .86rem; }
  .plan .line .muted { font-size: .8rem; }
  .transitions .kind-group { margin: 8px 0; }
  .transitions .kind-group h4 { margin: 0 0 4px; font-size: .9rem; font-weight: 600; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .transitions .tr { display: grid; grid-template-columns: 78px 1fr; gap: 8px; font-size: .85rem; padding: 2px 0; border-bottom: 1px dashed var(--border); }
  .transitions .tr .t { color: var(--muted); font-family: var(--mono); font-size: .8rem; font-variant-numeric: tabular-nums; }

  /* --- footer ------------------------------------------------------------ */
  footer { margin-top: 24px; padding-top: 12px; border-top: 1px solid var(--border); color: var(--muted); font-size: .82rem; }
  footer p { margin: 4px 0; }

  @media (prefers-reduced-motion: no-preference) {
    .row, .card { transition: border-color .2s ease, background .12s ease; }
    button { transition: background .12s ease; }
  }
</style>
</head>
<body>

<header>
  <h1><span data-t="title">기능 상태 패널</span> <small data-t="subtitle">검토용</small></h1>
  <nav class="tabs" role="tablist" aria-label="tabs">
    <button type="button" role="tab" data-tab="functions" aria-selected="true" data-t="tab_functions">기능</button>
    <button type="button" role="tab" data-tab="tiers" aria-selected="false" data-t="tab_tiers">계층·자원</button>
    <button type="button" role="tab" data-tab="executions" aria-selected="false" data-t="tab_executions">실행</button>
    <button type="button" role="tab" data-tab="developer" aria-selected="false" data-t="tab_developer">개발자</button>
  </nav>
  <span class="spacer"></span>
  <span id="control-badge" class="badge info">control: …</span>
  <button id="lang-toggle" type="button" aria-label="언어 / Language" title="KO | EN"><span class="on">KO</span> | <span class="off">EN</span></button>
  <button id="reset-btn" type="button" data-t="reset">초기화</button>
</header>

<div id="error" class="badge bad" role="alert" hidden></div>

<!-- ===== Functions tab ===== -->
<section id="tab-functions" role="tabpanel">
  <div id="fn-whatif" class="whatif-bar"></div>
  <div id="cards" class="cards"></div>
</section>

<!-- ===== Tiers tab ===== -->
<section id="tab-tiers" role="tabpanel" hidden>
  <div id="tiers-whatif" class="whatif-bar"></div>
  <div id="roles" class="stack"></div>
  <section class="panel" style="margin-top:14px" aria-labelledby="events-title">
    <h2 id="events-title"><span data-t="events">이벤트</span> <span class="muted small" style="font-weight:400">/api/events · <span data-t="events_hint">2초마다 갱신</span></span></h2>
    <div id="events" class="events"><div class="empty">—</div></div>
  </section>
</section>

<!-- ===== Executions tab (§3: Execution Plan view + 재선택 트레이스) ===== -->
<section id="tab-executions" role="tabpanel" hidden>
  <div class="exec-grid">
    <section class="panel" aria-labelledby="plans-title">
      <h2 id="plans-title"><span data-t="plans">실행 계획</span> <span class="muted small" style="font-weight:400">/api/plans · <span id="plans-count"></span></span>
        <button type="button" id="plans-refresh" class="small" style="margin-left:auto" data-t="refresh">새로 고침</button></h2>
      <p class="note small" data-t="plans_hint" style="margin:0 0 8px"></p>
      <div id="plan-list" class="plan-list"><div class="empty">—</div></div>
    </section>
    <section class="panel" aria-labelledby="plan-detail-title">
      <h2 id="plan-detail-title"><span data-t="plan_detail">계획 상세</span> <code id="plan-detail-id" class="muted small"></code></h2>
      <div id="plan-detail"><div class="empty" data-t="select_plan"></div></div>
    </section>
  </div>
  <section class="panel transitions" style="margin-top:14px" aria-labelledby="reselection-title">
    <h2 id="reselection-title"><span data-t="reselection_trace">재선택 트레이스</span> <span class="muted small" style="font-weight:400">/api/events · <span data-t="reselection_hint"></span></span></h2>
    <div id="transitions"><div class="empty">—</div></div>
  </section>
</section>

<!-- ===== Developer tab ===== -->
<section id="tab-developer" role="tabpanel" hidden>
  <div id="dev-whatif" class="whatif-bar"></div>
  <div id="dev-nodes" aria-label="node select"></div>
  <main class="panel">
    <h2><span id="dev-node-title">—</span> <span id="dev-node-meta" class="muted small" style="font-weight:400"></span></h2>
    <div id="dev-rows" class="rows"></div>
    <p class="note" data-t="rows_note"></p>
  </main>
  <section class="panel" style="margin-top:14px" aria-labelledby="residency-title">
    <h2 id="residency-title"><span data-t="residency">온디바이스 상주</span> <span class="muted small" style="font-weight:400">/api/residency · <span data-t="residency_hint">등록된 이 장치가 어떤 기능을 자기 안에 두는가, 그리고 왜</span></span></h2>
    <div id="dev-residency"></div>
  </section>

  <section class="panel" style="margin-top:14px" aria-labelledby="devices-title">
    <h2 id="devices-title"><span data-t="devices">장치 등록·배포</span> <span class="muted small" style="font-weight:400">/api/devices · <span data-t="devices_hint"></span></span></h2>
    <div id="dev-devices"></div>
  </section>

  <section class="panel" style="margin-top:14px">
    <h2>vocabulary</h2>
    <div id="dev-vocab" class="tablewrap"></div>
    <div id="dev-labels-missing" class="small muted" style="margin-top:8px"></div>
  </section>
</section>

<!-- ===== drawer (function detail) ===== -->
<div id="backdrop" class="backdrop" hidden></div>
<aside id="drawer" class="drawer" hidden aria-modal="true" role="dialog" aria-labelledby="drawer-title">
  <h2><span id="drawer-title"></span><button type="button" class="close" id="drawer-close" data-t="close">닫기</button></h2>
  <div id="drawer-body"></div>
</aside>

<footer>
  <p><strong data-t="footer_1"></strong></p>
  <p data-t="footer_2"></p>
  <p data-t="footer_3"></p>
</footer>

<script>
(function () {
  'use strict';

  const $ = (id) => document.getElementById(id);
  const S = {
    labels: null,
    lang: 'ko',
    config: null,
    vocab: null,
    base: null,        // /api/functions with no overrides
    whatif: null,      // /api/functions/whatif result when overrides are active

  // --- labels ------------------------------------------------------------------
  function pick(entry) {

  const tk = (kind) => pick(S.labels && S.labels.capability_kinds && S.labels.capability_kinds[kind]) || kind;

  function loadLang() {

  function saveLang(lang) { try { localStorage.setItem('status_ui.lang', lang); } catch (e) { /* ignore */ } }

  // --- helpers -----------------------------------------------------------------
  function el(tag, attrs, ...children) {

  async function api(path, body) {
    const opts = body === undefined ? { method: 'GET' }

  // --- current data ------------------------------------------------------------

  // --- what-if overrides -------------------------------------------------------

  // --- header ------------------------------------------------------------------

  // --- functions tab -----------------------------------------------------------

      }
    } else if (fn.state === 'DEGRADED') {

        el('td', null, tk(k.kind), el('span', { class: 'muted small', text: k.required ? '' : ' (' + t('optional') + ')' })),
        el('td', { text: trole(k.role) }), el('td', null, el('code', { text: k.provider_id }), el('span', { class: 'muted small', text: ' ' + k.node_id })),

        el('span', { class: 'badge ' + (required ? 'bad' : 'warn'), text: required ? t('required') : t('optional') })));

        line.appendChild(el('span', { class: 'arrow', text: '→' }));

  // --- residency (device axis) --------------------------------------------------
  // "이 등록된 장치가 어떤 기능을 자기 안에 두는가, 그리고 왜". 판정은 전부
  // 서버(runtime/residency.py)가 하고 여기서는 표시만 한다 — 이 페이지는 아무것도
  // 다시 판정하지 않는다는 원칙이 이 축에도 그대로 적용된다.
  const DEGRADED_LINK = { source: 'whatif:link_degrades', quality: 0.2, stability: 0.4, samples: 10 };

  async function loadResidency(nodeId, degraded) {
    try {
      showError(null);
      const ov = overrideFor(nodeId);
      const body = { node_id: nodeId, tags: ov.tags, budget: ov.budget, exclude_providers: ov.exclude_providers };
      if (degraded) body.link = DEGRADED_LINK;
      S.residency[nodeId] = await api('/api/residency', body);
      S.residencyDegraded[nodeId] = !!degraded;
      renderResidency();
    } catch (e) { showError(t('residency') + ': ' + e.message); }
  }

  function renderResidency() {
    const box = $('dev-residency');
    if (!box) return;
    clear(box);
    const nodeId = S.devNode;
    const cfg = nodeCfg(nodeId);
    if (!cfg) return;
    if (!cfg.purpose) {
      box.appendChild(el('div', { class: 'empty', text: t('residency_no_purpose') }));
      return;
    }
    const data = S.residency[nodeId];
    if (!data) { box.appendChild(el('div', { class: 'empty', text: '…' })); loadResidency(nodeId, false); return; }
    const degraded = !!S.residencyDegraded[nodeId];

    // purpose + link header
    const head = el('div', { class: 'row-meta', style: 'margin-bottom:10px' });
    head.appendChild(el('span', null, t('residency_purpose') + ' ',
      el('b', { text: tpurp(data.purpose.purpose_id) }), el('code', { class: 'muted small', text: ' ' + data.purpose.purpose_id })));
    const link = data.link || {};
    head.appendChild(el('span', null, t('residency_link') + ' ',
      el('span', { class: 'badge ' + (link.permits_remote ? 'ok' : 'warn'), text: tpost(link.posture), title: link.posture })));
    head.appendChild(el('span', null, t('link_quality') + ' ', el('b', { class: 'num', text: fmtNum(link.quality) })));
    head.appendChild(el('span', null, t('link_stability') + ' ', el('b', { class: 'num', text: fmtNum(link.stability) })));
    head.appendChild(el('span', null, t('link_samples') + ' ', el('b', { class: 'num', text: String(link.samples ?? 0) })));
    head.appendChild(el('span', null, t('residency_link_origin') + ' ', el('code', { text: (data.link_origin || '') + ' / ' + (link.source || '') })));
    head.appendChild(el('span', { class: 'reason' },
      el('span', { class: 'tok mono', text: link.reason_token || '—' }),
      link.reason_data ? el('span', { class: 'data mono', text: ':' + link.reason_data }) : null,
      el('div', { class: 'muted small', text: trr(link.reason_token) })));
    box.appendChild(head);

    // what-if buttons
    const bar = el('div', { style: 'display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:0 0 10px' });

    // purpose data contradictions (not decision failures)
    if (data.violations && data.violations.length) {
      const ul = el('ul', { style: 'margin:0 0 10px; padding-left:18px' });
      for (const v of data.violations) ul.appendChild(el('li', null,
        el('span', { class: 'badge bad', text: trr(v.violation_token) }), ' ', el('code', { text: v.kind || '' })));
      box.appendChild(el('div', null, el('h3', { text: t('residency_violations') }), ul));
    }
    const missing = data.node_tags || {};
    if ((missing.missing_required || []).length || (missing.missing_preferred || []).length) {
      const m = el('div', { class: 'row-meta', style: 'margin-bottom:10px' });
      if ((missing.missing_required || []).length) m.appendChild(el('span', null,
        el('span', { class: 'badge bad', text: 'required' }), ' ', el('code', { text: missing.missing_required.join(', ') })));
      if ((missing.missing_preferred || []).length) m.appendChild(el('span', null,
        el('span', { class: 'badge info', text: 'preferred' }), ' ', el('code', { text: missing.missing_preferred.join(', ') })));
      box.appendChild(m);
    }

    // the decision table
    const table = el('table', null, el('thead', null, el('tr', null,
      el('th', { text: t('kind') }),
      el('th', { text: t('residency_placement') }),
      el('th', { text: t('residency_policy') }),
      el('th', { text: t('reason') + ' (residency_decision_reason)' }),
      el('th', { text: t('state') + ' / ' + t('residency_edge_side') }),
      el('th', { text: t('residency_outage') }))));
    const tb = el('tbody');
    for (const row of data.rows) {
      const onDevice = row.placement === 'ondevice';
      const res = row.resolution;
      const kindCell = el('td', null, el('span', { class: 'kind', text: row.kind }), el('div', { class: 'muted small' }, kEl(row.kind)));
      if (row.is_core) kindCell.appendChild(el('span', { class: 'badge core', text: t('core') }));
      if (row.survives_outage) kindCell.appendChild(el('span', { class: 'badge ok', title: t('residency_survives'), text: t('residency_survives') }));
      if (row.quality_is_safety_affecting) kindCell.appendChild(el('span', { class: 'badge warn', title: t('residency_safety_q'), text: t('residency_safety_q') }));
      const reasonCell = el('td', null,
        el('span', { class: 'tok mono', text: row.reason_token || '—' }),

        el('div', { class: 'muted small', text: trr(row.reason_token) }));
      const stateCell = onDevice
        ? el('td', null, res ? stateChip(res.state) : el('span', { class: 'muted', text: '—' }),

        : el('td', null, el('code', { text: row.edge_service || '—' }),

      tb.appendChild(el('tr', null,

  // --- devices (register -> purpose -> deploy -> manage) --------------------------
  // 화면은 아무것도 판정하지 않는다. 어떤 기능이 이 장치에 가는지는 서버의
  // runtime/residency.py가 정하고, 그것을 실제로 올리는 것은
  // runtime/device_deployment.py가 기존 PlacementReconciler로 한다. 여기서는
  // 입력을 보내고 돌아온 것을 그린다 — ssh라는 단어가 이 파일에 없는 이유다.
  const LIVE_CLASS = { ALIVE: 'ok', STARTING: 'warn', DEAD: 'bad', UNKNOWN: 'info' };
  const READY_CLASS = { READY: 'ok', NOT_READY: 'warn', UNKNOWN: 'info' };
  const BOARD_CLASS = { NOMINAL: 'ok', THROTTLED: 'warn', UNREACHABLE: 'bad', UNKNOWN: 'info' };

  async function loadDevices() {
    try { S.devices = await api('/api/devices'); renderDevices(); }
    catch (e) { showError(t('devices') + ': ' + e.message); }
  }

  async function deviceCommand(deviceId, command, extra) {
    if (S.deviceBusy[deviceId]) return;
    S.deviceBusy[deviceId] = true;
    renderDevices();
    try {
      showError(null);
      await api('/api/devices/command', Object.assign({ device_id: deviceId, command }, extra || {}));
      await loadDevices();
      await refreshEvents();
    } catch (e) { showError(command + ': ' + e.message); }
    finally { S.deviceBusy[deviceId] = false; renderDevices(); }
  }

  async function registerDevice(form) {
    const body = {
      device_id: form.device_id.value.trim(),
      address: form.address.value.trim(),
      username: form.username.value.trim(),
      purpose: form.purpose.value || null,
      node_tags: form.node_tags.value.split(',').map((x) => x.trim()).filter(Boolean),
    };
    const password = form.password.value;
    if (password) body.password = password;
    for (const k of Object.keys(body)) if (body[k] === null) delete body[k];
    try {
      showError(null);
      await api('/api/devices', body);
      form.password.value = '';   // 비밀번호는 화면에도 남기지 않는다
      await loadDevices();
      await refreshEvents();
    } catch (e) { showError(t('device_register') + ': ' + e.message); }
  }

  function deviceForm() {
    const purposes = (S.devices && S.devices.purposes) || [];
    const form = el('form', { class: 'row-meta', style: 'gap:10px; align-items:flex-end; flex-wrap:wrap; margin-bottom:12px' });
    const field = (name, labelKey, type, value) => {
      const input = el('input', { name, type: type || 'text', value: value || '', style: 'width:100%' });
      return [el('label', { style: 'display:flex; flex-direction:column; gap:3px; min-width:150px' },
        el('span', { class: 'small muted', text: t(labelKey) }), input), input];
    };
    for (const [name, key, type] of [['device_id', 'device_id'], ['address', 'device_address'],
      ['username', 'device_username'], ['password', 'device_password', 'password'],
      ['node_tags', 'device_tags']]) {
      form.appendChild(field(name, key, type)[0]);
    }
    const select = el('select', { name: 'purpose', style: 'width:100%' }, el('option', { value: '', text: '—' }));
    for (const pid of purposes) select.appendChild(el('option', { value: pid, text: tpurp(pid) + ' (' + pid + ')' }));
    form.appendChild(el('label', { style: 'display:flex; flex-direction:column; gap:3px; min-width:200px' },
      el('span', { class: 'small muted', text: t('device_purpose') }), select));
    form.appendChild(el('button', { type: 'submit', class: 'primary', text: t('device_register') }));
    form.addEventListener('submit', (ev) => { ev.preventDefault(); registerDevice(form); });
    return form;
  }

  function healthCells(health) {
    if (!health) return [el('td', { class: 'muted', colspan: '3', text: '—' })];
    const chip = (table, value) => el('span', { class: 'badge ' + (table[value] || 'info'), text: value || 'UNKNOWN', title: value });
    const board = el('td', null, chip(BOARD_CLASS, health.device_state));
    if (health.temperature_c !== null && health.temperature_c !== undefined) {
      board.appendChild(el('div', { class: 'muted small num', text: fmtNum(health.temperature_c, 1) + ' °C' }));
    }
    if (health.throttle_flags && health.throttle_flags.length) {
      board.appendChild(el('div', { class: 'muted small mono', text: (health.throttle_raw || '') + ' ' + health.throttle_flags.join(', ') }));
    }
    return [el('td', null, chip(LIVE_CLASS, health.liveness)), el('td', null, chip(READY_CLASS, health.readiness)), board];
  }

  function renderDevices() {
    const box = $('dev-devices');
    if (!box) return;
    clear(box);
    const data = S.devices;
    if (!data) { box.appendChild(el('div', { class: 'empty', text: '…' })); loadDevices(); return; }
    if (!data.configured) {
      box.appendChild(el('div', { class: 'empty', text: (data.info && data.info.reason) || t('device_no_devices') }));
      return;
    }
    box.appendChild(el('div', { class: 'note small muted', text: t('device_bootstrap_note') }));
    box.appendChild(deviceForm());

    if (!data.devices.length) { box.appendChild(el('div', { class: 'empty', text: t('device_no_devices') })); return; }

    for (const d of data.devices) {
      const card = el('div', { class: 'panel', style: 'margin-top:10px' });
      const head = el('div', { class: 'row-meta' });
      head.appendChild(el('span', null, el('b', { text: d.device_id }), el('code', { class: 'muted small', text: ' ' + d.address + ':' + d.port })));
      head.appendChild(el('span', null, t('device_purpose') + ' ',
        d.purpose ? el('b', { text: tpurp(d.purpose) }) : el('span', { class: 'badge warn', text: '—' }),
        d.purpose ? el('code', { class: 'muted small', text: ' ' + d.purpose }) : null));
      head.appendChild(el('span', null, t('device_auth') + ' ',
        el('code', { text: (d.credential && d.credential.auth_method) || '—' }),
        el('span', { class: 'muted small', text: d.credential && d.credential.has_secret ? ' (secret held)' : '' })));
      if (d.link) head.appendChild(el('span', null, t('link_quality') + ' ', el('b', { class: 'num', text: fmtNum(d.link.quality) }),
        ' · ' + t('link_stability') + ' ', el('b', { class: 'num', text: fmtNum(d.link.stability) }),

  // Reselection trace: capability_state_changed + placement_applied events, grouped
  // by kind, time order — "before → after (reason)". Data is /api/events as-is.
  function renderTransitions() {
    const box = $('transitions');
    if (!box) return;
    clear(box);
    const groups = new Map();
    for (const ev of S.events) {
      if (ev.name !== 'capability_state_changed' && ev.name !== 'placement_applied') continue;
      const kind = ev.payload.capability_kind || '?';
      if (!groups.has(kind)) groups.set(kind, []);
      groups.get(kind).push(ev);
    }
    if (!groups.size) { box.appendChild(el('div', { class: 'empty', text: t('no_transitions') })); return; }
    for (const [kind, evs] of groups) {
      const g = el('div', { class: 'kind-group' });
      g.appendChild(el('h4', null, kEl(kind), el('code', { class: 'muted small', text: kind })));
      for (const ev of evs) {
        const p = ev.payload;
        const body = ev.name === 'capability_state_changed'
          ? el('span', null, stateChip(p.before), el('span', { class: 'arrow', text: ' → ' }), stateChip(p.after),
              el('span', { class: 'muted small', text: ' (' + reasonText(p.reason ? p.reason.split(':')[0] : null, p.reason && p.reason.includes(':') ? p.reason.split(':').slice(1).join(':') : null) + ')' }))
          : el('span', null, el('span', { class: 'badge ' + (p.command === 'stop' ? 'warn' : 'info'), text: tcmd(p.command), title: p.command }), ' ',
              el('code', { class: 'small', text: p.provider_id }), ' ',
              el('span', { class: 'badge ' + (p.accepted ? 'ok' : 'bad'), text: p.accepted ? t('accepted') : t('rejected') }),
              p.rejection_reason ? el('span', { class: 'mono muted small', text: ' ' + p.rejection_reason }) : null);
        g.appendChild(el('div', { class: 'tr' }, el('span', { class: 't', text: fmtTime(ev.ts) }), body));
      }
      box.appendChild(g);
    }
  }

  // --- boot --------------------------------------------------------------------
  async function boot() {
    S.lang = loadLang();
    try {
      const [labels, config, vocab, base] = await Promise.all([api('/api/labels'), api('/api/config'), api('/api/vocabulary'), api('/api/functions')]);
      S.labels = labels; S.config = config; S.vocab = vocab; S.base = base;
      S.devNode = config.nodes[0] && config.nodes[0].node_id;
      $('lang-toggle').addEventListener('click', toggleLang);
      $('reset-btn').addEventListener('click', reset);
      $('drawer-close').addEventListener('click', closeDrawer);
      $('backdrop').addEventListener('click', closeDrawer);
      $('plans-refresh').addEventListener('click', loadPlans);
      document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape' && S.drawerFn) closeDrawer(); });
      for (const b of document.querySelectorAll('.tabs [role="tab"]')) b.addEventListener('click', () => selectTab(b.dataset.tab));
      renderAll();
      await loadDevices();
      await refreshEvents();
      S.eventsTimer = setInterval(refreshEvents, 2000);
    } catch (e) { showError(e.message); }
  }
  boot();
})();
</script>
</body>
</html>
