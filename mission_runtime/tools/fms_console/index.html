function paintDomains(){
  const byId = {};
  for (const d of S.domains) byId[d.domain_id] = d;
  Map3D.drawDomains(el("domainsStage"), S.scene, {
    onHover(d, event){
      const site = d.site || {};
      showPop(`<h4>${esc(label(d.label))}</h4>
        <div>${chip(ZONE_GRADE[d.state], T("map.state." + d.state))}
             ${d.example ? chip("", T("dom.example")) : ""}</div>
        <dl class="kv" style="margin-top:8px">
          ${site.name ? `<dt>${esc(T("dom.site"))}</dt><dd>${esc(label(site.name))}</dd>` : ""}
          ${site.address ? `<dt>${esc(T("dom.address"))}</dt><dd>${esc(site.address)}</dd>` : ""}
          <dt>${esc(T("dom.zones"))}</dt><dd>${d.zone_count}</dd>
          <dt>${esc(T("dom.levels"))}</dt><dd>${d.level_count}</dd>
          <dt>${esc(T("dom.reachableZones"))}</dt>
          <dd>${d.reachable_zone_count} / ${d.zone_count}</dd>
          <dt>${esc(T("zone.discovered"))}</dt>
          <dd>${d.discovered_count} / ${d.declared_count}</dd>
        </dl>`, event);
    },
    onLeave: hidePop,
    onClick(domainId){
      hidePop();
      /* 한 번 누르면 **고르고 동시에 편다**. 고르기만 하고 멈추면 들어가는 데
         두 번 눌러야 하고, 이 화면의 첫 동작이 곧 들어가는 것이다. */
      S.domainPick = domainId;
      openDomain(domainId);
    },
  });
  /* 현장 그림을 메인 맵 아래에 깐다 — 도메인을 적지 않고 묻는다. 그림이 없는
     배치에서는 아무 일도 일어나지 않고 지도는 격자로 남는다(AI-C-05). */
  MapBackground.apply(el("domainsStage"), {}).catch(() => null);

  el("domainsLegend").innerHTML = ["operable","limited","idle","no_robot"]
    .map(x => chip(ZONE_GRADE[x], T("map.state." + x))).join(" ")
    + ` <span class="chip"><span class="dot"></span>${esc(T("dom.exampleLegend"))}</span>`;

  /* 옆 칸은 **고른 도메인 하나**의 상세다. 고른 것이 없으면 첫째를 고른다 —
     빈 칸을 보여 주고 "하나 고르세요" 라고 적는 것보다, 하나를 펴 두고 바꿀
     수 있게 하는 편이 한 번 덜 누른다. */
  if (!S.domainPick || !S.domains.some(d => d.domain_id === S.domainPick))
    S.domainPick = (S.domains[0] || {}).domain_id;
  paintDomainCard(S.domainPick, el("domainsSide")).catch(reportBoot);
}

/* ===========================================================================
   도메인 — 그 안의 구역
   =========================================================================== */
async function openDomain(domainId){
  S.domainId = domainId;
  const d = await api("/api/domain", {id:domainId});
  S.domainScene = d;
  const levels = d.levels || [];
  if (!levels.some(l => l.level_id === S.levelId)) S.levelId = null;
  /* 층이 하나뿐이면 그 층을 고른 것으로 연다. 층 도면은 **층에** 걸리므로
     고르지 않은 채로는 도면이 깔리지 않고, 고를 것이 하나뿐인데 한 번 더
     누르게 하는 것은 그냥 한 번 더 누르는 일이다. */
  if (!S.levelId && levels.length === 1) S.levelId = levels[0].level_id;
  el("h-map").textContent = label(d.label);
  paintDomain();
  selectTab("map");
}

function paintDomain(){
  const d = S.domainScene;
  if (!d) return;
  const levels = d.levels || [];
  /* 층이 여러 개면 한 층씩 보는 것이 기본이다 — 모든 층을 한 그림에 겹쳐 두면
     같은 자리의 다른 층이 서로를 가린다. */
  el("levelBar").innerHTML = levels.length > 1
    ? [{level_id:null, label:{ko:T("dom.allLevels"), en:T("dom.allLevels")}}].concat(levels)
        .map(l => `<button class="ghost" data-level="${esc(l.level_id || "")}"
          ${(l.level_id || null) === S.levelId ? 'style="border-color:var(--accent)"' : ""}>
          ${esc(label(l.label))}${l.verified === false ? " · " + esc(T("dom.unverified")) : ""}

       아무것도 긋지 않는다 — 빈 임무에 가짜 경로를 그리지 않는다. */

          <dt>${esc(T("zone.discovered"))}</dt><dd>${z.discovered_count}</dd>

     않고 뒤에서 한 겹 얹는 이유는 `map_background.js` 머리에 적었다 — 도면 없는
     배치가 기본값이라 길을 둘로 가르지 않는다(AI-C-05). */
  MapBackground.apply(el("mapStage"), {domain: d.domain_id, level: S.levelId})
    .catch(() => null);

  el("mapLegend").innerHTML = ["operable","limited","idle","no_robot"]
    .map(x => chip(ZONE_GRADE[x], T("map.state." + x))).join(" ");

  const site = d.site || {};
  const rf = d.rf || {};
  el("mapSide").innerHTML = `
    ${site.name ? `<dl class="kv">
      <dt>${esc(T("dom.site"))}</dt><dd>${esc(label(site.name))}</dd>
      ${site.address ? `<dt>${esc(T("dom.address"))}</dt><dd>${esc(site.address)}</dd>` : ""}
      ${site.source ? `<dt>${esc(T("dom.source"))}</dt>
        <dd class="note">${esc(site.source)}</dd>` : ""}
    </dl>` : ""}
    ${(site.unverified_fields||[]).length ? `<p class="note">${esc(T("dom.unverified"))}:
      <span class="tags">${site.unverified_fields.map(f =>
        `<span class="tag">${esc(f)}</span>`).join("")}</span></p>` : ""}
    <h3 style="font-size:16px;margin:16px 0 4px">${esc(T("dom.rf"))}</h3>
    ${Object.entries(rf).map(([kind, model]) => `
      <div class="note" style="margin-bottom:8px"><code>${esc(kind)}</code>
        · n=${esc(model.path_loss_exponent)} · EIRP ${esc(model.tx_eirp_dbm)} dBm
      <dl class="kv" style="margin-top:4px">
        <dt>${esc(T("dom.rf.excellent"))}</dt><dd>${esc(model.radius_m.excellent)} m
          (${esc(model.thresholds_dbm.excellent)} dBm)</dd>
        <dt>${esc(T("dom.rf.handover"))}</dt><dd>${esc(model.radius_m.handover)} m
          (${esc(model.thresholds_dbm.handover)} dBm)</dd>
        <dt>${esc(T("dom.rf.floor"))}</dt><dd>${esc(model.radius_m.floor)} m

    <ul class="plain">${d.zones
      .filter(z => !S.levelId || z.level_id === S.levelId)
      .map(z => `<li><div class="fnrow">
        <span class="name">${esc(label(z.label))}</span>
        ${chip(ZONE_GRADE[z.state], T("map.state." + z.state))}
        <button class="link" data-zone="${esc(z.zone_id)}">${esc(T("nav.zone"))}</button>
      </div></li>`).join("")}</ul>`;

    b.addEventListener("click", () => openZone(b.dataset.zone)));
}

async function openZone(zoneId){
  S.zoneId = zoneId;
  await repaintZone();
  selectTab("zone");
}

async function repaintZone(){
  const zone = await api("/api/zone", {id:S.zoneId});
  S.zone = zone;
  el("h-zone").textContent = label(zone.label);
  const mayMove = !!S.caps.may_edit_placement;
  /* 도면 위에 올릴 **탐지된 객체**. 융합 결과가 없는 구역도 정상이다. */
  const twin = await api("/api/twin", {zone: S.zoneId}).catch(() => null);
  const objects = ((twin || {}).records || []).map(r => ({
    object_id: r.object_id,
    at: r.fused_position
      ? {x: r.fused_position[0], y: r.fused_position[1]} : null,
    semantic_class: r.semantic_class,
    extent_m: (r.cues || {}).extent_m,
    confidence: r.confidence,
    lifecycle: r.lifecycle,
    human_corrected: (r.corrections || []).length > 0,
  }));
  S.zoneObjects = objects;

  Map3D.drawZone(el("zoneStage"), zone, {
    selected: S.missionRobot || S.robotId || null,
    objects,
    onObjectHover(o, event){
      showPop(`<h4>${esc(o.semantic_class || T("obj.unknownClass"))}</h4>
        <div class="note"><code>${esc(o.object_id)}</code></div>
        <dl class="kv" style="margin-top:8px">
          <dt>${esc(T("obj.at"))}</dt>
          <dd>${o.at ? `<code>X ${o.at.x.toFixed(2)} · Z ${o.at.y.toFixed(2)}</code>`
                     : esc(T("app.unmeasured"))}</dd>
          <dt>${esc(T("obj.extent"))}</dt>
          <dd>${o.extent_m ? `<code>${o.extent_m} m</code>`
                           : esc(T("app.unmeasured"))}</dd>
          <dt>${esc(T("obj.lifecycle"))}</dt><dd>${esc(o.lifecycle || "")}</dd>
        </dl>`, event);
    },
    onRobotHover(r, event){
      /* 로봇에 커서를 올리면 그 로봇의 자원과 기능을 바로 띄운다. */
      const usable = r.functions.filter(f => f.state !== "DISABLED");
      showPop(`<h4>${esc(r.node_id)} <span class="note">${esc(r.role || "")}</span></h4>
        <div>${chip(r.presence === "discovered" ? "good" : "",
                    T("robot.presence." + r.presence))}</div>
        <dl class="kv" style="margin-top:8px">
          <dt>${esc(T("robot.compute"))}</dt>
          <dd>${esc(r.resources.compute_units ?? T("app.unmeasured"))}</dd>
          <dt>${esc(T("robot.memory"))}</dt>
          <dd>${esc(r.resources.memory_mb ?? T("app.unmeasured"))}</dd>
          <dt>${esc(T("robot.functions"))}</dt><dd>${usable.length} / ${r.functions.length}</dd>
          <dt>${esc(T("robot.whereFrom"))}</dt>
          <dd>${esc(T("robot.at." + (r.at_origin || "declared"))
                    || r.at_origin || "")}</dd>
        </dl>
        <div class="tags" style="margin-top:8px">${
          (r.resources.tags || []).slice(0,6)
            .map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>`, event);
    },
    onDeviceHover(i, event){
      const isAp = i.kind === "access_point";
      showPop(`<h4>${esc(i.id)} <span class="note">${esc(i.kind)}</span></h4>
        <dl class="kv">
          ${isAp
            ? `<dt>${esc(T("zone.apRf"))}</dt><dd><code>${esc(i.rf || "-")}</code></dd>
               <dt>${esc(T("zone.apPlacement"))}</dt>
               <dd>${chip(i.placement_verified ? "good" : "warn",
                          T(i.placement_verified ? "zone.apSurveyed"
                                                 : "zone.apDeclaredOnly"))}</dd>`
            : `<dt>${esc(T("zone.ap"))}</dt><dd>${esc((zone.wifi||{}).ap_id || "-")}</dd>`}
          ${i.pose ? `<dt>yaw</dt><dd>${esc(i.pose.yaw_deg)}°</dd>
            <dt>height</dt><dd>${esc(i.pose.height_m)} m</dd>` : ""}
          ${i.calibration ? `<dt>calibration</dt>
            <dd>${esc(i.calibration.profile_version)}</dd>` : ""}
        </dl>
        ${isAp && !i.joins_as_node
          ? `` : ""}
        ${i.at_origin === "operator_edit" ? `<p class="note">${esc(T("zone.moved"))}</p>` : ""}
        ${(zone.movable_devices||[]).includes(i.id) && mayMove
          ? `` : ""}`, event);
    },
    onLeave: hidePop,
    onRobotClick(id){ hidePop(); openRobot(id); },
    onDeviceMoved: mayMove ? async (i, at) => {
      try{
        await post("/api/placement",
          {device_id:i.id, zone_id:S.zoneId, at, reason:"operator drag"});
      }catch(err){ reportBoot(err); }
      await repaintZone();
    } : null,
    onUnplaced(rows){
      el("zoneSide").insertAdjacentHTML("beforeend",
        `<p class="note">${esc(T("zone.unexpected"))}: ` +
        rows.map(r => esc(r.node_id)).join(", ") + `</p>`);
    },
  });
  /* 그 층의 도면. 구역이 어느 도메인·층에 속하는지는 이미 아는 값이다. */
  MapBackground.apply(el("zoneStage"),
    {domain: zone.domain_id || S.domainId, level: zone.level_id})
    .catch(() => null);

  /* 라우터도 이 목록에 넣는다. 맵에서는 끌 수 있는데 목록에 없으면 **되돌릴
     길이 없다** — 되돌리기 버튼이 이 목록에만 있기 때문이다. */
  const infra = [...(zone.infrastructure || []),
                 ...(zone.access_point ? [zone.access_point] : [])].map(i => `
    <li><div class="fnrow"><span class="name">${esc(i.id)}</span>
      <span class="tag">${esc(i.kind)}</span>
      ${i.kind === "access_point" && !i.placement_verified
        ? chip("warn", T("zone.apDeclaredOnly")) : ""}
      ${i.at_origin === "operator_edit" ? chip("warn", T("zone.moved")) : ""}</div>
      ${i.at ? `<div class="note">X ${esc(i.at.x)} · Z ${esc(i.at.y)}
        ${esc(zone.space.unit)}</div>` : ""}
      ${i.calibration ? `<div class="note">calibration ${esc(i.calibration.profile_version)}</div>` : ""}
      ${i.at_origin === "operator_edit" && mayMove
        ? `<button class="link" data-reset="${esc(i.id)}">${esc(T("zone.resetPlacement"))}</button>`
        : ""}
    </li>`).join("");

  const neighbours = (zone.neighbours || []).map(n => `
    <li><div class="fnrow"><span class="name">${esc(n.zone_id)}</span>
      ${n.radio_handover_required
        ? chip("warn", T("zone.radioHandover")) : chip("good", T("zone.sameAp"))}</div></li>`).join("");

  el("zoneSide").innerHTML = `
    <div>${chip(ZONE_GRADE[zone.state], T("map.state." + zone.state))}
      ${zone.verified === false ? chip("", T("dom.unverified")) : ""}</div>
    <dl class="kv" style="margin-top:12px">
      ${(zone.rooms||[]).length ? `<dt>${esc(T("zone.rooms"))}</dt>
        <dd>${zone.rooms.map(esc).join(", ")}</dd>` : ""}
      <dt>${esc(T("zone.ap"))}</dt><dd><code>${esc((zone.wifi||{}).ap_id || "-")}</code></dd>
      <dt>${esc(T("zone.edge"))}</dt><dd>${esc(zone.edge_node || T("app.none"))}</dd>
      <dt>${esc(T("zone.declared"))}</dt><dd>${zone.declared_count}</dd>
      <dt>${esc(T("zone.discovered"))}</dt><dd>${zone.discovered_count}</dd>
    </dl>
    <h3 style="font-size:16px;margin:16px 0 4px">${esc(T("zone.infrastructure"))}</h3>
    <ul class="plain">${infra || `<li class="note">${esc(T("app.none"))}</li>`}</ul>
    <h3 style="font-size:16px;margin:16px 0 4px">${esc(T("zone.neighbours"))}</h3>
    <ul class="plain">${neighbours || `<li class="note">${esc(T("app.none"))}</li>`}</ul>
    <h3 style="font-size:16px;margin:16px 0 4px">${esc(T("zone.usable"))}</h3>
    <div class="tags">${zone.usable_functions.length
      ? zone.usable_functions.map(f => `<span class="tag zone">${esc(f)}</span>`).join("")
      : `<span class="note">${esc(T("zone.noRobots"))}</span>`}</div>
    <h3 style="font-size:16px;margin:16px 0 4px">${esc(T("mapinfo.heading"))}</h3>
    <div id="mapInfo"></div>`;
  paintMapInfo(zone, objects, mayMove);
  el("zoneSide").querySelectorAll("button[data-reset]").forEach(b =>
    b.addEventListener("click", async () => {
      await post("/api/placement",
        {device_id:b.dataset.reset, zone_id:S.zoneId, reset:true});
      await repaintZone();
    }));
}

/* ── 맵 정보 — 좌표를 **숫자로** 고친다 ────────────────────────────────
   끌어다 놓기는 빠르지만 정밀하지 않다. 줄자로 잰 값이 있는 사람은 그 숫자를
   그대로 넣을 수 있어야 하고, 그때 소수점 두 자리가 픽셀 한 칸에 갇히면 안 된다.

   세 가지가 각각 **다른 계약**으로 간다. 장치 자리는 `/api/placement`(선언을
   덮지 않고 덧댄다), 사람이 잰 공간 값은 `/api/survey`(센서 추정과 같은 칸에
   담지 않는다 — AI-S-08), 객체의 자리·종류·크기는 `/api/correction`(사람이
   확인한 값으로 남고 모델 파라미터는 바뀌지 않는다 — AI-L-03). 한 폼으로
   합치면 그 구분이 화면에서 사라진다.

   z 칸은 받되 **아직 아무도 쓰지 않는다**. 지금 구역 좌표는 평면이고, 층은
   구역이 나눈다. 칸만 만들어 두고 쓰는 척하면 넣은 값이 조용히 사라진다. */
/* 축 규약 — 화면은 **Unity 와 같은 3차원 축**으로 보여 준다.

   저장되는 값은 구역 로컬 평면 한 쌍(`at.x`, `at.y`)이고 단위는 미터다. 평면
   지도의 두 번째 축은 바닥 위의 **깊이**이지 높이가 아니다. 그래서 화면에서는
   그것을 **Z** 로 적고 **Y 를 높이**로 쓴다(Unity 의 Y-up 규약).

   계약을 바꾸지 않는다. `at` 는 그대로 `{x, y}` 로 오가고, 여기서 하는 일은
   **표시와 입력의 축 이름을 옮기는 것**뿐이다. 그 둘을 섞으면 같은 숫자가 API
   에서는 y 이고 화면에서는 z 가 되어 어느 쪽이 맞는지 아무도 모르게 된다 —
   그래서 옮기는 자리를 이 두 함수 하나로 모았다(AI-C-02).

   높이는 아직 대부분 미측정이다. 미측정은 0 이 아니므로 빈 칸으로 남는다. */
const PLAN_TO_VIEW = (at, heightM) => ({
  x: at ? at.x : null,
  y: (heightM === undefined || heightM === null) ? null : heightM,  // 위
  z: at ? at.y : null,                                              // 평면 깊이
});
/* 돌아가는 길. 화면의 (x, z) 가 계약의 (x, y) 다. */
const VIEW_TO_PLAN = (x, z) => ({x, y: z});

function coordField(id, labelText, value, step){
  const known = value !== null && value !== undefined && value !== "";
  return `<label class="field" style="gap:4px">
    <span class="note">${esc(labelText)}</span>
    <input id="${esc(id)}" type="number" step="${step || "0.1"}"
      value="${known ? esc(value) : ""}"
      placeholder="${known ? "" : esc(T("app.unmeasured"))}"
      style="width:74px;background:var(--raised);border:1px solid var(--border);
             border-radius:var(--radius);padding:5px 7px">
  </label>`;
}

function paintMapInfo(zone, objects, mayMove){
  const host = el("mapInfo");
  const movable = new Set(zone.movable_devices || []);
  const placed = [...(zone.infrastructure || []),
                  ...(zone.access_point ? [zone.access_point] : [])]
    .filter(item => movable.has(item.id) && item.at);
  const mayCorrect = !!S.caps.may_correct;

  host.innerHTML = `
    <dl class="kv">
      <dt>${esc(T("mapinfo.size"))}</dt>
      <dd><code>X ${esc(zone.rect.w)} × Z ${esc(zone.rect.h)}</code>
        ${esc((zone.space || {}).unit || "")}</dd>
      <dt>${esc(T("mapinfo.origin"))}</dt>
      <dd><code>X ${esc(zone.rect.x)} · Z ${esc(zone.rect.y)}</code></dd>
    </dl>
    ${mayMove ? `
      <div class="ctlsep">${esc(T("mapinfo.survey"))}</div>
      <div class="fnrow">
        <input id="svQty" placeholder="${esc(T("mapinfo.quantity"))}"
          style="flex:1;min-width:110px;background:var(--raised);
                 border:1px solid var(--border);border-radius:var(--radius);padding:5px 7px">
        ${coordField("svVal", T("mapinfo.value"), "", "0.01")}
        <button class="ghost" id="svGo">${esc(T("mapinfo.apply"))}</button>
      </div>
      <div id="svOut" class="note"></div>` : ""}

    <div class="ctlsep">${esc(T("mapinfo.devices"))}</div>
    ${placed.length ? placed.map(item => `
      <div class="fnrow" style="margin-bottom:6px">
        <span class="name">${esc(item.id)}</span>
        ${coordField("px-" + item.id, "X",
            PLAN_TO_VIEW(item.at, (item.pose || {}).height_m).x)}
        ${coordField("py-" + item.id, T("axis.up"),
            PLAN_TO_VIEW(item.at, (item.pose || {}).height_m).y)}
        ${coordField("pz-" + item.id, "Z",
            PLAN_TO_VIEW(item.at, (item.pose || {}).height_m).z)}
        ${mayMove ? `<button class="ghost" data-place="${esc(item.id)}"
          >${esc(T("mapinfo.apply"))}</button>` : ""}
      </div>`).join("") : `<div class="note">${esc(T("app.none"))}</div>`}

    <div class="ctlsep">${esc(T("mapinfo.objects"))}</div>
    ${objects.length ? objects.map(o => `
      <div style="margin-bottom:10px">
        <div class="fnrow">
          <input id="oc-${esc(o.object_id)}" value="${esc(o.semantic_class || "")}"
            placeholder="${esc(T("obj.unknownClass"))}"
            style="flex:1;min-width:100px;background:var(--raised);
                   border:1px solid var(--border);border-radius:var(--radius);padding:5px 7px">
          ${coordField("oe-" + o.object_id, T("obj.extent"), o.extent_m, "0.01")}
        </div>
        <div class="fnrow" style="margin-top:4px">
          ${coordField("ox-" + o.object_id, "X", o.at ? o.at.x : "")}
          ${coordField("oy-" + o.object_id, T("axis.up"), "")}
          ${coordField("oz-" + o.object_id, "Z", o.at ? o.at.y : "")}
          ${mayCorrect ? `<button class="ghost" data-obj="${esc(o.object_id)}"
            >${esc(T("mapinfo.apply"))}</button>` : ""}
        </div>
      </div>`).join("") : `<div class="note">${esc(T("mapinfo.noObjects"))}</div>`}
    <div id="miOut" class="note"></div>`;

  const num = (id) => {
    const node = el(id);
    if (!node || node.value === "") return null;
    const value = Number(node.value);
    return Number.isFinite(value) ? value : null;
  };
  const say = (id, text, bad) => {
    const box = el(id);
    if (box) box.innerHTML = bad ? `<code>${esc(text)}</code>` : esc(text);
  };

  if (el("svGo")) el("svGo").addEventListener("click", async () => {
    const quantity = (el("svQty").value || "").trim();
    const value = num("svVal");
    if (!quantity || value === null){ say("svOut", T("mapinfo.needBoth")); return; }
    try {
      await post("/api/survey", {zone_id: S.zoneId, quantity_id: quantity,
        value, unit: (zone.space || {}).unit || "m",
        reason: T("mapinfo.survey")});
      say("svOut", T("dep.submitted"));
    } catch (err){ say("svOut", err.message, true); }
  });

  host.querySelectorAll("button[data-place]").forEach(node =>
    node.addEventListener("click", async () => {
      const id = node.dataset.place;
      /* 화면의 X·Z 가 계약의 x·y 다. 높이(Y)는 자리 계약에 칸이 없어 아직
         보내지 않는다 — 받는 칸이 없는 값을 보내면 조용히 버려진다. */
      const x = num("px-" + id), z = num("pz-" + id);
      if (x === null || z === null){ say("miOut", T("mapinfo.needXZ")); return; }
      try {
        await post("/api/placement", {device_id: id, zone_id: S.zoneId,
          at: VIEW_TO_PLAN(x, z), reason: T("mapinfo.heading")});
        await repaintZone();
      } catch (err){ say("miOut", err.message, true); }
    }));

  host.querySelectorAll("button[data-obj]").forEach(node =>
    node.addEventListener("click", async () => {
      const id = node.dataset.obj;
      const x = num("ox-" + id), z = num("oz-" + id);
      const extent = num("oe-" + id);
      const klass = (el("oc-" + id).value || "").trim();
      const before = (objects.find(o => o.object_id === id) || {});
      try {
        /* 셋은 **따로** 보낸다. 한 번에 보내면 자리 수정과 의미 수정이 한
           기록으로 합쳐져, 나중에 무엇을 고친 것인지 되짚을 수 없다. */
        if (x !== null && z !== null)
          await post("/api/correction", {object_id: id, at: VIEW_TO_PLAN(x, z),
            reason: T("mapinfo.heading")});
        if (klass && klass !== (before.semantic_class || ""))
          await post("/api/correction", {object_id: id,
            cue_name: "semantic_class", value: klass,
            reason: T("mapinfo.heading")});
        if (extent !== null && extent !== before.extent_m)
          await post("/api/correction", {object_id: id,
            cue_name: "extent_m", value: extent, reason: T("mapinfo.heading")});
        await repaintZone();
      } catch (err){ say("miOut", err.message, true); }
    }));
}

  el("robotMain").querySelectorAll("button[data-fn]").forEach(b =>
    b.addEventListener("click", () => openSubtasks(nodeId, b.dataset.fn)));

  const rec = (r.recommendations || []);
  const recHtml = rec.map(c => `
    <li><div class="fnrow"><span class="name">${esc(c.title)}</span>
      ${chip(c.recommended ? "good" : "", c.recommended ? T("rec.reason.recommended") : T("rec.blocked"))}

  const vocab = r.command_vocabulary || [];
  const mayCommand = !!S.caps.may_command;
  const cmdBody = !S.commanding
    ? `<p class="note">${esc(T("robot.adminOnly"))}</p>`

           <div class="fnrow"><select id="cmdAction">
             ${vocab.map(a => `<option value="${esc(a)}">${esc(a)}</option>`).join("")}

           <div id="cmdOut" class="note" style="margin-top:10px"></div>`

  el("robotSide").innerHTML = `
    <div class="card">
      <h3 style="margin:0 0 10px;font-size:17px">${esc(T("robot.resources"))}</h3>
      <div>${chip(r.presence === "discovered" ? "good" : "", T("robot.presence." + r.presence))}

/* ===========================================================================
   추론 근거 — 모델이 왜 그 class 라고 했는가

   픽셀은 상태 응답에 담겨 오지 않는다. `/api/explain` 은 참조만 주고 바이트는
   `/api/media` 가 낸다(AI-C-08). 그래서 이 화면은 `<img src>` 를 그 미디어 경로로
   가리키기만 하고, 같은 설명을 Unity 뷰어가 받아도 자기 방식으로 그릴 수 있다.
   =========================================================================== */
const mediaUrl = (ref) => ref
  ? `${ref.path}?kind=${encodeURIComponent(ref.kind)}&class=${encodeURIComponent(ref["class"])}`
    + `&file=${encodeURIComponent(ref.file)}&${qs({})}`
  : "";

async function paintEvidence(){
  const host = el("evBody");
  let info;
  try { info = await api("/api/samples", {}); }
  catch (err) { host.innerHTML = `<div class="empty">${esc(err.message)}</div>`; return; }
  if (!info.available){
    host.innerHTML = `<div class="empty">${esc(T("ev.unavailable"))}
      <div class="note" style="margin-top:8px"><code>${esc(info.reason || "")}</code></div></div>`;
    return;
  }
  const classes = Object.keys(info.samples);
  if (!classes.length){
    host.innerHTML = `<div class="empty">${esc(T("ev.unavailable"))}</div>`;
    return;
  }
  if (!S.evSample || !info.samples[S.evSample.cls]) S.evSample = {cls: classes[0], file: info.samples[classes[0]][0]};

  host.innerHTML = `
    <div class="card" style="margin-bottom:14px">
      <h3 style="margin:0 0 8px;font-size:17px">${esc(T("ev.pick"))}</h3>
      <div class="fnrow">
        <select id="evClass">${classes.map(c =>
          `<option value="${esc(c)}" ${c === S.evSample.cls ? "selected" : ""}>${esc(c)}</option>`).join("")}</select>
        <select id="evFile">${(info.samples[S.evSample.cls] || []).map(f =>
          `<option value="${esc(f)}" ${f === S.evSample.file ? "selected" : ""}>${esc(f)}</option>`).join("")}</select>
      </div>
      ${Object.keys(info.unfit_classes || {}).length
        ? `<p class="note" style="margin:10px 0 0">${esc(T("ev.unfit"))}:
           ${Object.entries(info.unfit_classes).map(([c, why]) =>
             `<span class="tag miss">${esc(c)} · ${esc(why)}</span>`).join(" ")}</p>` : ""}
    </div>
    <div id="evReport"><div class="empty">${esc(T("app.loading"))}</div></div>`;

  el("evClass").addEventListener("change", (e) => {
    S.evSample = {cls: e.target.value, file: info.samples[e.target.value][0]};
    paintEvidence();
  });
  el("evFile").addEventListener("change", (e) => {
    S.evSample = {cls: S.evSample.cls, file: e.target.value};

}
