            </div>
            <label><span>${esc(T("dep.model.candidateVersion"))}</span>
              <select id="mVersion"><option value=""></option>${approved.map(c =>
                `<option value="${esc(c.version)}" ${pickable(c.learning_state) ? "" : "disabled"}

            <label><span>${esc(T("dep.model.pin"))}</span>
              <select id="mPinned"><option value="">${esc(T("dep.model.auto"))}</option>
                ${m.versions.map(v =>
                  `<option value="${esc(v.reference)}">${esc(v.reference)}</option>`).join("")}
              </select></label>
            <label><span>${esc(T("lab.reason"))}</span><textarea id="mReason"
              placeholder="${esc(T("dep.reasonPlaceholder"))}"></textarea></label>
            <div class="acts">

          <div><div class="note">${esc(T("dep.model.versions"))}</div>${versions}</div>

  function requirement(){
    const body = {device_id: el("mDev").value, capability_kind: el("mKind").value};
    if (el("mQuality").value !== "") body.min_quality = Number(el("mQuality").value);
    if (el("mLatency").value !== "") body.max_latency_ms = Number(el("mLatency").value);
    if (el("mVersion").value) body.version = el("mVersion").value;
    if (el("mPinned").value) body.pinned_reference = el("mPinned").value;
    return body;
  }

  function eligibilityView(rows){
    return `<ul class="steps">${rows.map(r => `<li>${chip(
      r.eligible ? "good" : "critical",
      r.reference + " · " + (r.eligible ? T("dep.model.eligible")
                                        : pick("dep.model.reason.", r.reason)))}</li>`
      ).join("")}</ul>`;
  }

  function statusView(st){
    return `<dl class="kv">
      <dt>${esc(T("dep.model.phase"))}</dt><dd>${esc(T("dep.phase." + st.phase))}</dd>
      <dt>${esc(T("dep.model.scope"))}</dt>
      <dd>${esc(T("dep.scope." + st.scope))}
        ${st.next_scope ? " → " + esc(T("dep.scope." + st.next_scope)) : ""}</dd>
      <dt>${esc(T("dep.train.version"))}</dt>
      <dd><code>${esc(st.version_reference || "")}</code></dd>
      <dt>${esc(T("dep.model.unit"))}</dt><dd><code>${esc(st.unit_id || "")}</code></dd>
      <dt>${esc(T("dep.model.area"))}</dt><dd><code>${esc(st.area_id || "")}</code></dd>
      <dt>${esc(T("dep.model.unitStatus"))}</dt>
      <dd>${st.unit_status ? `<code>${esc(st.unit_status)}</code>` : T("app.unmeasured")}</dd>
      <dt>${esc(T("dep.model.availability"))}</dt>
      <dd>${st.device_availability ? `<code>${esc(st.device_availability)}</code>`
                                   : T("app.unmeasured")}</dd>
      <dt>${esc(T("dep.train.state"))}</dt>
      <dd>${st.lineage_state ? `<code>${esc(st.lineage_state)}</code>` : T("app.none")}</dd>
      ${st.reason ? `<dt>${esc(T("lab.reason"))}</dt><dd><code>${esc(st.reason)}</code></dd>` : ""}
    </dl>`;
  }

  function bindModel(){
    for (const id of ["mDev", "mKind", "mVersion", "mPinned"]) keep(id, id);
    if (el("mPlan")) el("mPlan").addEventListener("click", async () => {
      try {
        const out = await post("/api/model", {...requirement(), step: "plan",
          reason: T("dep.model.plan")});
        const p = out.plan;
        el("mResult").innerHTML = `
          <div>${p.would_place ? chip("good", T("dep.phase.PLACED"))
                               : chip("critical", pick("dep.model.reason.",
                                       p.refusal_reason || ""))}</div>
          <dl class="kv">
            <dt>${esc(T("dep.train.version"))}</dt>
            <dd><code>${esc(p.assignment.assigned ? p.assignment.assigned.reference : "")}</code>
              ${p.assignment.assigned ? "" : esc(pick("dep.model.reason.",
                                                      p.assignment.reason))}</dd>
            <dt>${esc(T("dep.model.area"))}</dt><dd><code>${esc(p.area_id || "")}</code></dd>
            <dt>${esc(T("dep.model.unit"))}</dt><dd><code>${esc(p.unit_id || "")}</code></dd>
          </dl>
          ${eligibilityView(out.eligibility)}`;
      } catch (err){ fail("mResult", err); }
    });
    if (el("mApply")) el("mApply").addEventListener("click", async () => {
      const reason = reasonOf("mReason", "mResult");
      if (!reason) return;
      try {
        const out = await post("/api/model", {...requirement(), step: "apply", reason});
        const before = out.applied
          ? chip("good", T("dep.submitted"))
          : chip("critical", pick("dep.model.reason.",
              out.reason || (out.status && out.status.reason) || ""));
        await open();
        el("mResult").innerHTML = `<div>${before}</div>
          ${out.status ? statusView(out.status) : ""}`;
      } catch (err){ fail("mResult", err); }
    });
    if (el("mApprove")) el("mApprove").addEventListener("click", async () => {
      const reason = reasonOf("mReason", "mResult");
      if (!reason) return;
      if (!el("mVersion").value){
        el("mResult").innerHTML = ``;
        return;
      }
      try {
        const out = await post("/api/model",
          {step: "approve", version: el("mVersion").value, reason});
        await open();
        el("mResult").innerHTML = `
          <div>${out.advanced ? chip("good", T("dep.submitted"))
                              : chip("critical", pick("dep.train.reason.",
                                      out.reason || ""))}</div>
          ${out.candidate ? candidateView(out.candidate) : ""}`;
      } catch (err){ fail("mResult", err); }
    });
    const act = async (which, deploymentId) => {
      try {
        const out = await post("/api/model", {step: which, deployment_id: deploymentId,
          reason: T("dep.model." + which)});
        await open();
        el("mResult").innerHTML = statusView(out.status);
      } catch (err){ fail("mResult", err); }
    };
    el("sec-deploy").querySelectorAll("button[data-widen]").forEach(node =>
      node.addEventListener("click", () => act("widen", node.dataset.widen)));
    el("sec-deploy").querySelectorAll("button[data-rollback]").forEach(node =>
      node.addEventListener("click", () => act("rollback", node.dataset.rollback)));
  }

  return {open, goStep};
})();

/* ===========================================================================
   장치 연결 확인 · 장치 수동 제어 · 장치 관리

   화면 구성은 현대 로보틱스랩의 Narchon 관제 화면을 따른다 — 고른 장치가 곧
   제목이고, 그 아래에 수치 띠가 한 줄, 그 아래에 모듈별 상태, 제어는 큰 버튼
   격자이며 되돌릴 수 없는 것은 따로 떼어 아래에 둔다.

   **따라 하지 않은 것이 하나 있다.** 그 화면은 배터리 잔량·전압·CPU·메모리를
   수치로 띄운다. 우리는 그 값을 아직 **측정하지 않는다** — 선언된 예산
   (compute_units·memory_mb)은 "이 노드가 쓸 수 있다고 적어 둔 양"이지 지금 쓰고
   있는 양이 아니다. 그 자리에 그럴듯한 숫자를 넣으면 운영자는 그것을 실측으로
   읽고, 그 순간 이 화면은 거짓을 말하기 시작한다. 그래서 측정하지 않는 칸은
   점선 테두리에 "미측정" 이라고 적는다(AI-B-01, AI-O-05 의 3값 판정).
   =========================================================================== */

/* 함대 전체를 한 줄 목록으로. 도메인·구역을 **한꺼번에** 부른다 — 하나씩
   순서대로 부르면 구역이 스무 개인 배치에서 화면이 "읽는 중" 에 머문다.
   (여기서 무엇도 판정하지 않는다. 서버가 이미 낸 칸을 모아 줄로 펼 뿐이다.) */
let fleetRowsCache = null;
async function fleetRows(force){
  if (fleetRowsCache && !force) return fleetRowsCache;
  const scenes = await Promise.all(S.domains.map(d =>
    api("/api/domain", {id: d.domain_id}).catch(() => null)));
  const zoneIds = [];
  scenes.forEach((scene, i) => {
    for (const zone of (scene && scene.zones) || [])
      zoneIds.push({zone, domain: S.domains[i].domain_id});
  });
  const details = await Promise.all(zoneIds.map(z =>
    api("/api/zone", {id: z.zone.zone_id}).catch(() => null)));
  const rows = [];
  details.forEach((detail, i) => {
    if (!detail) return;
    const {zone, domain} = zoneIds[i];
    for (const robot of detail.robots || [])
      rows.push({...robot, zone_label: zone.label, domain, kind: "robot"});
    for (const item of detail.infrastructure || [])
      rows.push({node_id: item.id, role: item.kind, zone_id: zone.zone_id,
                 zone_label: zone.label, domain, presence: "declared",
                 kind: "infrastructure", calibration: item.calibration || null});
    if (detail.access_point)
      rows.push({node_id: detail.access_point.id, role: detail.access_point.kind,
                 zone_id: zone.zone_id, zone_label: zone.label, domain,
                 presence: "declared", kind: "infrastructure"});
  });
  fleetRowsCache = rows;
  return rows;
}

/* 수치 띠 한 칸. 값이 null 이면 **0 이 아니라 미측정**이다. */
function cell(labelKey, value, unit){
  const none = value === null || value === undefined || value === "";
  return `<div class="cell${none ? " none" : ""}">
    <span class="lab">${esc(T(labelKey))}</span>
    <b>${esc(none ? T("app.unmeasured") : value)}</b>
    ${none || !unit ? "" : `<span class="unit">${esc(unit)}</span>`}</div>`;
}

/* 노드 하나의 "지금". 서버가 이미 낸 값만 옮긴다 — 여기서 판정하지 않는다. */
function presenceGrade(row){
  if (row.presence === PRESENCE_DISCOVERED) return "good";
  if (row.presence === "unexpected") return "warn";
  return "";
}
const PRESENCE_DISCOVERED = "discovered";

/* ── 모니터링 — Narchon 의 화면을 그대로, 뜻만 우리 것으로 ───────────────
   배치는 그 화면을 벗어나지 않는다: 장치 선택이 머리에, 수치 카드 셋이 한 줄,
   영상과 지도가 나란히, 아래에 로그·제어·원격조종.

   우리가 그 화면보다 더 가진 여섯이 이 배치 **위에** 얹힌다:
   서브태스크 분할(임무 명령 탭) · 로봇 확장(로봇 운영의 ＋) · 자원에 맞는 기능
   분배(모델 배정) · 원인 추적(로그 줄 → 팝업) · 근거 화이트박스(추론 결과 →
   근거 팝업) · 다중 장치 추론 정합(지도의 융합 객체).

   따라 하지 않은 칸이 둘이다 — 배터리와 지연. 우리는 그 둘을 측정하지 않는다.
   같은 자리에 **우리가 실제로 아는 것**을 둔다: 선언된 자원과, 마지막 공지로부터
   경과한 시간(그 카드가 하는 일과 같다 — "지금 살아 있는가"). */

/* ── 그림 셋 — 숫자 하나로 끝나는 칸을 비교 가능한 자국으로 ───────────────
   참고한 화면은 배터리·전압·지연을 **막대와 게이지**로 그린다. 우리는 그 셋을
   측정하지 않으므로 값을 베끼지 않고 **그림의 구실**을 베낀다 — 한 눈에 "여유가
   있는가 / 온전한가 / 살아 있는가" 를 말하는 자국이다.

   규칙 셋을 지킨다. (1) 색만으로 뜻을 말하지 않는다 — 범례가 이름과 수를 적는다.
   (2) 미측정은 0 이 아니다 — 0 폭 막대가 아니라 점선 빈 트랙이다. (3) 축은 하나다 —
   한 그림에 두 척도를 겹치지 않는다. */

/* 미터 — **선언 예산 대비 선언 수요**. 둘 다 선언값이고 라벨이 그렇게 적는다. */
function meter(labelKey, used, budget, unit){
  const known = used !== null && used !== undefined
             && budget !== null && budget !== undefined && Number(budget) > 0;
  if (!known)
    return `<div class="meter none">
      <div class="cap"><span>${esc(T(labelKey))}</span>
        <b>${esc(T("app.unmeasured"))}</b></div>
      <div class="track"></div></div>`;
  const share = Number(used) / Number(budget);
  const grade = share > 1 ? "over" : share >= 0.8 ? "tight" : "";
  const width = Math.max(share > 0 ? 2 : 0, Math.min(100, share * 100));
  return `<div class="meter">
    <div class="cap"><span>${esc(T(labelKey))}</span>
      <b>${esc(round2(used))}</b>
      <span class="of">/ ${esc(round2(budget))}${unit ? " " + esc(unit) : ""}</span>
      <span class="pct">${Math.round(share * 100)}%</span></div>
    <div class="track"><div class="fill ${grade}" style="width:${width}%"></div></div>
  </div>`;
}
const round2 = (value) => Math.round(Number(value) * 100) / 100;

/* 쌓은 띠 — 상태 구성. `parts` 는 [{grade, label, n}] 이고 0 인 묶음도 **범례에는
   남는다**(없다는 것도 사실이다). 전부 0 이면 띠는 빗금이다. */
function sbar(parts, onPick){
  const total = parts.reduce((sum, part) => sum + part.n, 0);
  const bar = total
    ? `<div class="sbar">${parts.filter(p => p.n > 0).map(p =>
        `<i class="${p.grade}" style="width:${(p.n / total) * 100}%"
            title="${esc(p.label)} ${p.n}"></i>`).join("")}</div>`
    : `<div class="sbar empty"></div>`;
  const key = `<div class="chartkey">${parts.map((p, i) =>
    `<span ${onPick ? `role="button" tabindex="0" data-seg="${i}"
       style="cursor:pointer"` : ""}><i class="${p.grade}"></i>${esc(p.label)}
       <b>${p.n}</b></span>`).join("")}</div>`;
  return bar + key;
}

/* 게이지 — 마지막 공지로부터. 경계는 색이 아니라 **눈금**이다. 한 번도 공지하지
   않았으면 0 초가 아니라 미측정이고, 그때는 빗금 트랙을 그린다. */
function gauge(age, boundary){
  if (age === null || age === undefined)
    return `<div class="gauge none"></div>`;
  const span = Math.max(Number(boundary) * 1.5, Number(age) * 1.05, 1);
  const at = Math.min(100, (Number(age) / span) * 100);
  const tick = Math.min(100, (Number(boundary) / span) * 100);
  return `<div class="gauge">
    <div class="fill ${Number(age) > Number(boundary) ? "warn" : ""}"
         style="width:${Math.max(2, at)}%"></div>
    <div class="tick" style="left:${tick}%"><b>${esc(boundary)} s</b></div>
  </div>`;
}

let monDevice = null;      /* 지금 보고 있는 장치 */
let monLevel = null;       /* 지금 보고 있는 층 */

async function paintLink(){
  const host = el("linkBody");
  host.innerHTML = `<div class="empty">${esc(T("app.loading"))}</div>`;
  const rows = await fleetRows();
  const robots = rows.filter(r => r.kind === "robot");
  if (!rows.length){
    host.innerHTML = `<div class="empty">${esc(T("link.none"))}</div>`;
    return;
  }
  if (!monDevice || !rows.some(r => r.node_id === monDevice))
    monDevice = (robots[0] || rows[0]).node_id;
  const current = rows.find(r => r.node_id === monDevice);

  const staleAfter = ((S.freshness || {}).stale_after_s || {}).discovery || 300;
  const needing = rows.filter(r => r.kind === "robot" && (
    r.presence !== "discovered" || r.last_seen_age_s === null
    || r.last_seen_age_s === undefined || r.last_seen_age_s > staleAfter));

  host.innerHTML = `
    <div class="subject">
      <select id="monDev">${rows.map(r =>
        `<option value="${esc(r.node_id)}" ${r.node_id === monDevice ? "selected" : ""}
          >${esc(r.node_id)}</option>`).join("")}</select>
      <span id="monPresence"></span>
      <div style="flex:1"></div>
      ${may("may_see_internals")
        ? `<button class="ghost" id="monTrace">${esc(T("trace.open"))}</button>` : ""}
      <button class="ghost" id="monDetail">${esc(T("mon.openDetail"))}</button>
      <button class="ghost" id="monList">${esc(T("mon.allDevices"))} ${rows.length}</button>
      ${needing.length ? `<button class="ghost" id="monNeed"
        style="border-color:var(--critical);color:var(--critical)"
        >${esc(T("link.f.need"))} ${needing.length}</button>` : ""}
    </div>
    <div class="monband">
      <span class="lab">${esc(T("mon.fleetMix"))}</span>
      <div class="bars" id="monBand"></div>
    </div>
    <div class="mongrid">
      <div class="card fig"><div class="cardhead"><h3>${esc(T("mon.resources"))}</h3>
        <div class="tools" id="monResTools"></div></div>
        <div id="monRes" class="plot"></div></div>
      <div class="card fig"><div class="cardhead"><h3>${esc(T("mon.modules"))}</h3>
        <div class="tools" id="monModTools"></div></div>
        <div class="grow" id="monMods"></div>
        <div class="plot" id="monModPlot"></div></div>
      <div class="card fig"><div class="cardhead"><h3>${esc(T("mon.liveness"))}</h3></div>
        <div id="monLive" class="plot"></div></div>

      <div class="card media"><div class="cardhead"><h3>${esc(T("mon.camera"))}</h3>
        <div class="tools" id="monCamTools"></div></div>
        <div class="cam" id="monCam"></div></div>
      <div class="card wide media"><div class="cardhead"><h3>${esc(T("mon.map"))}</h3>
        <div class="tools" id="monMapTools"></div></div>
        <div class="mapwrap" id="monMap"></div></div>

      <div class="card wide"><div class="cardhead"><h3>${esc(T("mon.log"))}</h3></div>
        <div class="grow" style="max-height:340px" id="monLog"></div></div>
      <div class="card"><div class="cardhead"><h3>${esc(T("mon.control"))}</h3>
        <div class="tools" id="monCtlTools"></div></div>
        <div id="monControl"></div></div>
    </div>`;

  el("monDev").addEventListener("change", (event) => {
    monDevice = event.target.value;
    monLevel = null;
    paintLink().catch(reportBoot);
  });
  /* 요약 띠 — 장치 하나를 고르기 전에 전체가 어떤가. 네 묶음으로 가른다.
     "한 번도 공지 없음" 과 "오래됨" 을 **한 칸에 담지 않는다** — 둘은 다른
     상태이고, 섞으면 급사한 장치가 조용한 장치로 읽힌다(AI-O-01/04). */
  const fresh = robots.filter(r => r.presence === "discovered"
    && r.last_seen_age_s !== null && r.last_seen_age_s !== undefined
    && r.last_seen_age_s <= staleAfter);
  const stale = robots.filter(r => r.presence === "discovered"
    && (r.last_seen_age_s === null || r.last_seen_age_s === undefined
        || r.last_seen_age_s > staleAfter));
  const silent = robots.filter(r => r.presence === "declared");
  const unexpected = robots.filter(r => r.presence === "unexpected");
  const bands = [
    {grade: "good", label: T("band.fresh"), n: fresh.length, rows: fresh},
    {grade: "warn", label: T("band.stale"), n: stale.length, rows: stale},
    {grade: "none", label: T("band.silent"), n: silent.length, rows: silent},
    {grade: "serious", label: T("band.unexpected"), n: unexpected.length,
     rows: unexpected},
  ];
  el("monBand").innerHTML = sbar(bands, true);
  el("monBand").querySelectorAll("[data-seg]").forEach(node => {
    const pick = () => {
      const band = bands[Number(node.dataset.seg)];
      if (band.rows.length) openFleetList(band.rows);
    };
    node.addEventListener("click", pick);
    node.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " "){ event.preventDefault(); pick(); }
    });
  });

  const trace = el("monTrace");
  if (trace) trace.addEventListener("click", () => openFailurePopup(monDevice, null));
  el("monDetail").addEventListener("click", () =>
    openDevicePopup(current.node_id, current.zone_id, null));
  el("monList").addEventListener("click", () => openFleetList(rows));
  const need = el("monNeed");
  if (need) need.addEventListener("click", () => openFleetList(needing, "need"));

  await paintMonDevice(current, rows);
}

/* 머리의 세 카드 + 영상 + 지도 + 로그 + 빠른 조작. */
async function paintMonDevice(row, rows){
  let robot = null;
  try { robot = await api("/api/robot", {id: row.node_id, zone: row.zone_id || ""}); }
  catch (err){ /* 인프라는 로봇 계약이 아니다 — 아래에서 선언값만 쓴다 */ }
  const res = (robot && robot.resources) || {};
  const age = row.last_seen_age_s;
  const staleAfter = ((S.freshness || {}).stale_after_s || {}).discovery || 300;
  const grade = row.presence !== "discovered" ? ""
              : (age === null || age === undefined) ? "warn"
              : age > staleAfter ? "warn" : "good";

  el("monPresence").innerHTML =
    chip(grade, T("robot.presence." + row.presence) || row.presence)
    + ` <span class="note">${esc(label(row.zone_label) || row.zone_id || "")}</span>`;

  /* 카드 1 — 배터리 자리. 우리는 **선언된 예산**만 알고, 그 예산에 얹힌 **선언
     수요**(그 노드에 과금된 kind 들의 비용 합)를 서버가 함께 낸다. 예산만 보여
     주면 "6 유닛" 이 여유인지 포화인지 알 수 없다. 둘 다 선언값이므로 카드가
     그렇게 적는다 — 지금 쓰는 양이 아니다. */
  const demand = (robot && robot.declared_demand) || {};
  const charged = (demand.kinds || []).length;
  el("monResTools").innerHTML = charged
    ? chip("", `${T("mon.kindsCharged")} ${charged}`)
    : chip("", T("mon.noDemand"));
  /* 이름표가 **선언**이라고 적는다. 옆에 붙여 두던 "둘 다 선언값이다" 한 줄을
     걷어냈으므로, 그 사실은 이름표가 들고 있어야 한다 — 숫자만 남으면 지금
     쓰고 있는 양으로 읽힌다(AI-S-08). */
  el("monRes").innerHTML = `
    ${meter("mon.declCompute", charged ? demand.compute_units : null,
            res.compute_units ?? null, "")}
    ${meter("mon.declMemory", charged ? demand.memory_mb : null,
            res.memory_mb ?? null, "MB")}
    `;

  /* 카드 2 — 모듈별 상태 정보. Narchon 의 ON/OFF 자리에 우리 세 값이 온다. */
  const fns = (robot && robot.functions) || [];
  el("monMods").innerHTML = fns.length
    ? `<div class="modgrid">${fns.map(f => `
        <div class="row"><span class="n">${esc(f.function_id)}</span>
          <span class="v ${FN_GRADE[f.state] || "none"}">${esc(f.state)}</span></div>`
      ).join("")}</div>`
    : `<div class="note">${esc(T("mon.noModules"))}</div>`;
  const degraded = fns.filter(f => f.state !== "ACTIVE").length;
  el("monModTools").innerHTML = degraded
    ? chip("warn", `${T("mon.degraded")} ${degraded}`)
    : (fns.length ? chip("good", `${fns.length}`) : "");
  /* 카드 바닥의 쌓은 띠 — 목록은 "무엇이" 를 말하고 띠는 "얼마나" 를 말한다.
     DISABLED 를 빨강으로 두지 않는다: 필수 조건이 없어 그 기능만 꺼진 것은
     정상적인 격리이고(AI-C-05), 빨강으로 그리면 고장으로 읽힌다. */
  el("monModPlot").innerHTML = sbar([
    {grade: "good", label: T("fn.state.ACTIVE"),
     n: fns.filter(f => f.state === "ACTIVE").length},
    {grade: "warn", label: T("fn.state.DEGRADED"),
     n: fns.filter(f => f.state === "DEGRADED").length},
    {grade: "none", label: T("fn.state.DISABLED"),
     n: fns.filter(f => f.state === "DISABLED").length},
  ]);

  /* 카드 3 — 지연 자리. 우리가 실제로 재는 것은 "마지막 공지로부터" 다. */
  el("monLive").innerHTML = `
    <div class="strip" style="margin:0">
      ${cell("robot.lastSeen", age === null || age === undefined
              ? null : Math.round(age), "s")}
    </div>
    <div style="margin-top:14px">${gauge(
      age === null || age === undefined ? null : Math.round(age), staleAfter)}</div>
    <div class="note" style="margin-top:12px">
      ${esc(T("mon.freshBoundary"))} ${staleAfter} s</div>`;

  /* 영상 — 저장된 프레임이다. 생중계라고 적지 않는다. */
  await paintMonCamera(row);

  /* 지도 — 층 선택기 + 구역. */
  await paintMonMap(row, rows);

  /* 로그 — 운영자 장부. 한 줄을 누르면 그 줄의 상세·원인으로 간다. */
  await paintMonLog(row);

  /* 제어 — 같은 화면, 머리에서 고른 그 장치다. 어휘를 공지하지 않았거나 명령
     능력이 없으면 판을 그리지 않는다. 둘 다 정상 상태이고 그렇게 적는다
     (AI-C-05). */
  const acts = (robot && robot.announced_actions) || [];
  const tools = el("monCtlTools");
  if (!may("may_issue_command")){
    tools.innerHTML = "";
    el("monControl").innerHTML = `<div class="none">${esc(T("auth.noPermission"))}</div>`;
  } else if (!acts.length){
    tools.innerHTML = "";
    el("monControl").innerHTML = `<div class="none">${esc(T("ctl.noVocabulary"))}</div>`;
  } else {
    tools.innerHTML = `${esc(T("robot.actions"))} ${esc(acts.length)}`
      + (S.commanding ? "" : " " + chip("warn", T("ctl.noPath")));
    paintControl(row.node_id, acts);
  }
}

async function paintMonCamera(row){
  const host = el("monCam");
  const tools = el("monCamTools");
  /* 프레임은 **출처**에 매여 있다. 이 장치가 주체인 출처가 없으면 보여 줄 것이
     없고, 그것은 고장이 아니라 "그 장치의 저장 프레임이 없다" 이다. */
  let tasks = null;
  if (may("may_label_ground_truth"))
    tasks = await api("/api/label/tasks", {}).catch(() => null);
  const source = tasks && (tasks.sources || []).find(
    s => s.device_id === row.node_id && s.frame_count > 0);
  if (!source){
    host.innerHTML = `<div class="none">${esc(T("mon.noFrames"))}</div>`;
    tools.innerHTML = "";
    return;
  }
  const listing = await api("/api/label/tasks", {source: source.source_id})
    .catch(() => null);
  const frame = listing && (listing.frames || [])[0];
  if (!frame){
    host.innerHTML = `<div class="none">${esc(T("mon.noFrames"))}</div>`;
    return;
  }
  const src = `/api/media?kind=frame&source=${encodeURIComponent(source.source_id)}`
            + `&file=${encodeURIComponent(frame)}`;
  host.innerHTML = `
    <img alt="${esc(frame)}" src="${esc(src)}">
    <span class="badge">${esc(T("mon.stored"))}</span>
    <span class="idx">1 / ${listing.frame_count}</span>`;
  tools.innerHTML = `<span class="note">${esc(source.captured_at || "")}</span>`;
}

async function paintMonMap(row, rows){
  const host = el("monMap");
  if (!row.zone_id){
    host.innerHTML = `<div class="empty">${esc(T("mon.notPlaced"))}</div>`;
    return;
  }
  let zone = null;
  try { zone = await api("/api/zone", {id: row.zone_id}); }
  catch (err){ host.innerHTML = `<div class="empty">${esc(err.message)}</div>`; return; }
  const domain = (S.domains || []).find(d => d.domain_id === zone.domain_id);
  let scene = null;
  try { scene = await api("/api/domain", {id: zone.domain_id}); } catch (err){ /* 선택 */ }
  const levels = (scene && scene.levels) || [];
  if (!monLevel) monLevel = zone.level_id || (levels[0] && levels[0].level_id) || null;

  /* 층마다 그 층의 로봇 수. 0 인 층에는 뱃지를 달지 않는다 — 0 을 달면 눈이
     그것을 매번 읽는다. */
  const countOf = (levelId) => rows.filter(
    r => r.kind === "robot" && r.presence === "discovered"
      && (scene.zones || []).some(z => z.zone_id === r.zone_id
                                    && z.level_id === levelId)).length;

  host.innerHTML = `
    <div class="floors">${levels.map(l => {
      const n = countOf(l.level_id);
      return `<button data-level="${esc(l.level_id)}"
        aria-current="${String(l.level_id === monLevel)}">
        <span>${esc(label(l.label) || l.level_id)}</span>
        ${n ? `<i>${n}</i>` : ""}</button>`;
    }).join("") || `<span class="note">${esc(T("mon.oneLevel"))}</span>`}</div>
    <div style="position:relative"><div id="monStage"></div>
      <div class="mapchips" id="monChips"></div>
      <div class="maptask" id="monTask"></div>
      <div class="mapzoom"><button data-zoom="out">&minus;</button>
        <button data-zoom="in">+</button></div></div>`;

  Map3D.drawZone(el("monStage"), zone, {
    onDeviceHover(item, event){
      showPop(`<h4>${esc(item.id)}</h4><div class="note">${esc(item.kind || "")}</div>`,
              event);
    },
    onRobotHover(robot, event){
      showPop(`<h4>${esc(robot.node_id)}</h4>
        <div>${chip(robot.presence === "discovered" ? "good" : "",
                    T("robot.presence." + robot.presence) || robot.presence)}</div>`, event);
    },
    onLeave: hidePop,
    onRobotClick(nodeId){
      hidePop();
      openDevicePopup(nodeId, zone.zone_id, null);
    },
  });
  el("monChips").innerHTML =
    chip("", `${T("nav.zone")} ${label(zone.label) || zone.zone_id}`)
    + " " + chip(ZONE_GRADE[zone.state], T("map.state." + zone.state))
    + (domain ? " " + chip("", label(domain.label)) : "");
  /* 지금 하는 일. Narchon 의 지도 오른쪽 위가 그 자리다. */
  el("monTask").innerHTML = `<b>${esc(T("mon.doingNow"))}</b>
    <span class="note">${esc(T("mon.noTask"))}</span>`;

  host.querySelectorAll("button[data-level]").forEach(node =>
    node.addEventListener("click", () => {
      monLevel = node.dataset.level;
      paintLink().catch(reportBoot);
    }));
  let zoom = 1;
  host.querySelectorAll("button[data-zoom]").forEach(node =>
    node.addEventListener("click", () => {
      zoom = Math.max(0.5, Math.min(3, zoom * (node.dataset.zoom === "in" ? 1.25 : 0.8)));
      const svg = el("monStage").querySelector("svg");
      if (svg){ svg.style.transformOrigin = "0 0"; svg.style.transform = `scale(${zoom})`; }
    }));
}

async function paintMonLog(row){
  const host = el("monLog");
  let log = null;
  try { log = await api("/api/overlay", {}); } catch (err){ /* 장부가 없을 수 있다 */ }
  const entries = ((log && log.entries) || []).slice().reverse();
  if (!entries.length){
    host.innerHTML = `<div class="note">${esc(T("mon.noLog"))}</div>`;
    return;
  }
  host.innerHTML = `<table class="logtable"><thead><tr>
      <th>${esc(T("mon.when"))}</th><th>${esc(T("mon.what"))}</th>
      <th>${esc(T("mon.target"))}</th><th>${esc(T("mon.who"))}</th><th></th>
    </tr></thead><tbody>${entries.slice(0, 60).map((e, i) => `<tr>
      <td><code>${esc(new Date((e.edited_at || 0) * 1000)
            .toLocaleTimeString(S.locale))}</code></td>
      <td>${esc(e.kind)}${e.action === "reset"
            ? " " + chip("warn", T("mon.undone")) : ""}</td>
      <td><code>${esc(String(e.target_id).slice(0, 36))}</code></td>
      <td>${esc(e.actor)}</td>
      <td><button class="go" data-log="${i}" title="${esc(T("mon.detail"))}">&#9711;</button></td>
    </tr>`).join("")}</tbody></table>`;
  host.querySelectorAll("button[data-log]").forEach(node =>
    node.addEventListener("click", () => {
      const entry = entries[Number(node.dataset.log)];
      Flow.show({
        id: "log:" + node.dataset.log, title: entry.kind, width: 420,
        trail: entry.target_id,
        body: `<dl class="kv">
            <dt>${esc(T("mon.when"))}</dt>
            <dd>${esc(new Date((entry.edited_at || 0) * 1000).toLocaleString(S.locale))}</dd>
            <dt>${esc(T("mon.who"))}</dt><dd>${esc(entry.actor)}</dd>
            <dt>${esc(T("lab.reason"))}</dt><dd>${esc(entry.reason || T("app.none"))}</dd>
          </dl>
          <pre style="margin-top:10px">${esc(JSON.stringify(entry.payload || {}, null, 1))}</pre>`,
        actions: may("may_see_internals")
          ? [{label: T("trace.open"),
              run: (id) => openFailurePopup(entry.target_id, id)}] : [],
      });
    }));
}

/* 함대 전체 목록 — 장치 선택기가 한 줄이라면 이것은 표다(MRCS 의 두 보기). */
function openFleetList(rows, filter){
  const staleAfter = ((S.freshness || {}).stale_after_s || {}).discovery || 300;
  Flow.show({
    id: "fleet-list", width: 600,
    title: T("mon.allDevices") + " " + rows.length,
    grade: filter === "need" ? "critical" : "",
    body: `<table class="logtable"><thead><tr>
        <th>${esc(T("link.device"))}</th><th>${esc(T("robot.role"))}</th>
        <th>${esc(T("nav.zone"))}</th><th>${esc(T("link.presence"))}</th>
        <th>${esc(T("robot.lastSeen"))}</th></tr></thead><tbody>
      ${rows.map(r => `<tr><td><button class="go" data-pick="${esc(r.node_id)}"
          style="color:var(--accent-ink);text-decoration:underline"
          >${esc(r.node_id)}</button></td>
        <td>${esc(r.role || "")}</td>
        <td>${esc(label(r.zone_label) || r.zone_id || "")}</td>
        <td>${chip(r.presence === "discovered" ? "good" : "",
                   T("robot.presence." + r.presence) || r.presence)}</td>
        <td>${r.last_seen_age_s === null || r.last_seen_age_s === undefined
              ? `<span class="note">${esc(T("app.unmeasured"))}</span>`
              : `${Math.round(r.last_seen_age_s)} s`
                + (r.last_seen_age_s > staleAfter
                    ? " " + chip("warn", T("mon.stale")) : "")}</td>
      </tr>`).join("")}</tbody></table>`,
    mount: (body, id) => {
      body.querySelectorAll("button[data-pick]").forEach(node =>
        node.addEventListener("click", () => {
          monDevice = node.dataset.pick;
          monLevel = null;
          Flow.close(id);
          paintLink().catch(reportBoot);
        }));
    },
  });
}

/* ── 장치 하나의 팝업 ────────────────────────────────────────────────────
   지각(상태) → 이해(자원·기능) → 예측(무엇을 할 수 있는가)의 세 층을 한 카드에
   담는다. 다중 로봇 관제 연구가 운영자 1인당 로봇 수를 늘린 설계들이 공통으로
   가졌던 구조다. */
async function openDevicePopup(nodeId, zoneId, parent){
  const id = "dev:" + nodeId;
  Flow.show({id, parent, title: nodeId, trail: zoneId || "", width: 420,
             body: `<div class="note">${esc(T("app.loading"))}</div>`});
  let robot = null;
  try { robot = await api("/api/robot", {id: nodeId, zone: zoneId || ""}); }
  catch (err){
    Flow.show({id, parent, title: nodeId, grade: "absent", width: 420,
               body: `<div class="note">${esc(err.message)}</div>`});
    return;
  }
  const res = robot.resources || {};
  const fresh = robot.last_seen_age_s;
  const estopAction = (robot.announced_actions || [])
    .find(a => EMERGENCY_ACTIONS.includes(a)) || null;
  /* 이 장치를 가상환경에서 **무엇으로 그리는가**. 대역이 없는 것도 정상이고,
     대역은 정해졌는데 자산 파일이 아직 없는 것도 정상이다 — 둘은 다른 상태라
     한 칸에 담지 않는다. */
  let proxy = null;
  if (robot.zone_id){
    const twin = await api("/api/twin", {zone: robot.zone_id}).catch(() => null);
    proxy = ((twin || {}).proxies || []).find(row => row.object_id === nodeId) || null;
  }
  Flow.show({
    id, parent, width: 460,
    title: nodeId,
    trail: robot.zone_id || "",
    grade: robot.presence === PRESENCE_DISCOVERED ? "good" : "absent",
    body: `
      <div class="strip">
        ${cell("robot.compute", res.compute_units ?? null)}
        ${cell("robot.memory", res.memory_mb ?? null, "MB")}
        ${cell("robot.lastSeen", fresh === null || fresh === undefined
                ? null : Math.round(fresh), "s")}
      </div>
      <div class="fnrow">
        ${chip(robot.presence === PRESENCE_DISCOVERED ? "good" : "",
               T("robot.presence." + robot.presence))}
        ${fresh !== null && fresh !== undefined
          && fresh > (((S.freshness || {}).stale_after_s || {}).discovery || 300)
          ? chip("warn", T("link.f.need")) : ""}
      </div>
      <dl class="kv" style="margin-top:10px">
        <dt>${esc(T("robot.role"))}</dt><dd>${esc(robot.role || "")}</dd>
        <dt>${esc(T("robot.tags"))}</dt>
        <dd class="tags">${(res.tags || []).map(t =>
          `<span class="tag">${esc(t)}</span>`).join("")}</dd>
        <dt>${esc(T("robot.actions"))}</dt>
        <dd class="tags">${(robot.announced_actions || []).map(a =>
          `<span class="tag">${esc(a)}</span>`).join("")
          || `<span class="note">${esc(T("app.none"))}</span>`}</dd>
      </dl>
      <div class="ctlsep">${esc(T("proxy.heading"))}</div>
      ${proxyView(proxy)}
      <div class="ctlsep">${esc(T("robot.functions"))}</div>
      <div class="modgrid">${(robot.functions || []).map(f => `
        <div class="row"><span class="n">${esc(f.function_id)}</span>
          <span class="v ${FN_GRADE[f.state] || "none"}">${esc(f.state)}</span></div>`
        ).join("") || `<div class="note">${esc(T("app.none"))}</div>`}</div>`,
    /* 긴급정지는 **그 장치의 일**이다. 머리글에 하나를 두면 급할 때 어느
       장치를 세울지 한 번 더 고르게 되고, 그 한 번이 늦다. 그 장치가 공지한
       어휘에 긴급정지가 없으면 단추도 없다 — 없는 길을 그리지 않는다. */
    actions: [
      ...(estopAction && may("may_issue_command")
        ? [{label: T("estop.button"), danger: true, run: async (popupId) => {
            try {
              await post("/api/command", {robot: nodeId, action: estopAction});
              Flow.show({id: "estop:" + nodeId, parent: popupId, width: 300,
                grade: "critical", title: T("estop.button"),
                body: `<div>${chip("critical", T("ctl.requested"))}
                  <code>${esc(estopAction)}</code></div>`});
            } catch (err){
              Flow.show({id: "estop:" + nodeId, parent: popupId, width: 300,
                grade: "absent", title: T("estop.button"),
                body: `<div class="note">${esc(err.message)}</div>`});
            }
          }}] : []),
      ...(may("may_issue_command") ? [{label: T("ctl.openControl"), run: () => {
        monDevice = nodeId; selectTab("link");
      }}] : []),
      ...(may("may_see_internals") ? [{label: T("trace.open"), run: () =>
        openFailurePopup(nodeId, id)}] : []),
    ],
  });
}

/* 가상환경 대역 — "이 물건을 무엇으로 그릴 것인가" 와 그 근거.

   서버는 **어느 자산을 쓸지와 왜 그것인지**만 내고 색·픽셀은 내지 않는다
   (AI-C-08). 그래서 이 칸이 그리는 것도 이름과 사실뿐이다.

   세 가지를 섞지 않는다. (1) 대역이 정해지지 않았다, (2) 정해졌지만 자산 파일이
   이 노드에 없다, (3) 자산이 있는지 **확인하지 못했다**(자산 뿌리가 없는 노드).
   셋을 "없음" 으로 합치면 배포가 덜 된 것과 종류를 모르는 것이 같아 보인다. */
function proxyView(proxy){
  if (!proxy) return `<div class="note">${esc(T("proxy.none"))}</div>`;
  if (proxy.proxy_state !== "RESOLVED")
    return `<div class="fnrow">${chip("", T("proxy.absent"))}</div>
      <div class="note">${esc(T("proxy.reason." + proxy.proxy_reason)
                              || proxy.proxy_reason || "")}</div>`;
  const grounds = proxy.grounds || {};
  const fit = proxy.size_fit || {};
  const present = proxy.asset_present;
  return `
    <div class="fnrow">
      <span class="name">${esc(label(proxy.depicts) || proxy.proxy_id)}</span>
      ${present === true ? chip("good", T("proxy.assetHere"))
        : present === false ? chip("warn", T("proxy.assetMissing"))
        : chip("", T("app.unmeasured"))}
    </div>
    <dl class="kv" style="margin-top:6px">
      <dt>${esc(T("proxy.asset"))}</dt>
      <dd><code>${esc(proxy.proxy_id)}</code> · ${esc(proxy.asset_kind || "")}</dd>
      <dt>${esc(T("proxy.because"))}</dt>
      <dd><code>${esc(grounds.semantic_class || "")}</code>
        ${chip(TIER_GRADE[grounds.evidence_tier] || "",
               T("ev.tier." + grounds.evidence_tier) || grounds.evidence_tier || "")}</dd>
      <dt>${esc(T("proxy.size"))}</dt>
      <dd>${fit.size_fit_state === "mismatch"
            ? chip("warn", T("proxy.sizeMismatch"))
            : fit.size_fit_state === "match" ? chip("good", T("proxy.sizeMatch"))
            : `<span class="note">${esc(T("app.unmeasured"))}</span>`}
        ${fit.proxy_extent_m !== null && fit.proxy_extent_m !== undefined
          ? `<code>${esc(fit.proxy_extent_m)} m</code>` : ""}</dd>
    </dl>
    `;
}

/* ── 실패 원인 ───────────────────────────────────────────────────────────
   탭이 아니라 팝업이다. 실패는 "그 자리에서" 묻는 것이지 다른 화면으로 건너가
   다시 찾는 것이 아니다. 부모 팝업과 선으로 이어져 무엇의 실패인지가 남는다. */
async function openFailurePopup(subjectId, parent){
  const id = "fail:" + subjectId;
  Flow.show({id, parent, title: T("trace.heading") + " · " + subjectId, width: 440,
             grade: "critical", body: `<div class="note">${esc(T("app.loading"))}</div>`});
  let out;
  try { out = await api("/api/failure", {subject: subjectId}); }
  catch (err){
    Flow.show({id, parent, title: T("trace.heading") + " · " + subjectId, width: 440,
               grade: "absent", body: `<div class="note">${esc(err.message)}</div>`});
    return;
  }
  const causes = out.causes || out.candidates || [];
  Flow.show({
    id, parent, width: 460, grade: causes.length ? "critical" : "absent",
    title: T("trace.heading") + " · " + subjectId,
    body: causes.length
      ? `<ol class="plain">${causes.map((c, i) => `<li>
          <div class="fnrow"><span class="name">${i + 1}. ${esc(c.kind || c.cause || "")}</span>
            ${c.confidence !== undefined && c.confidence !== null
              ? chip("", `${Math.round(c.confidence * 100)}%`) : ""}</div>
          ${c.reason ? `<div class="note">${esc(c.reason)}</div>` : ""}
          ${(c.evidence || []).length ? `<div class="tags">${c.evidence.map(e =>
            `<span class="tag">${esc(typeof e === "string" ? e : JSON.stringify(e))}</span>`
            ).join("")}</div>` : ""}
        </li>`).join("")}</ol>`
      : `<div class="note">${esc(T("trace.none"))}</div>`,
  });
}

/* ── 장치 수동 제어 — 모니터링 화면의 아랫줄 ──────────────────────────────
   Narchon 은 한 로봇의 상태와 그 로봇을 움직이는 판을 **한 화면**에 둔다 —
   아랫줄이 로그·제어·원격조종이다. 우리도 그 자리로 되돌렸다. 탭으로 갈라
   두면 "이 로봇이 지금 어떤가" 와 "이 로봇을 움직인다" 사이를 오갈 때마다
   장치를 두 번 고르게 되고, 두 화면이 서로 다른 로봇을 볼 수 있다. 그래서
   여기에는 장치 고르개가 없다 — 머리에서 고른 그 장치다.

   무엇이 눌리는가는 **장치가 공지한 어휘**가 정한다(AI-C-18). 역할 이름으로
   버튼 표를 만들면 새 역할의 로봇은 그 표에 없다는 이유로 아무것도 못 한다.

   발급은 여기서 하지 않는다 — 요청만 하고 명령을 내는 것은 백엔드다(AI-C-19).
   그리고 전달이 곧 수락도 완료도 아니다(AI-C-20): 응답이 오면 서버가 낸 칸을
   그대로 적고 합치지 않는다. */

/* 긴급정지는 일반 취소와 다르다(AI-C-20). 어휘에 있으면 따로 떼어 **빨갛게**
   둔다 — 급할 때 격자 안에서 찾게 하면 늦는다. */
const EMERGENCY_ACTIONS = ["emergency_stop", "estop", "halt"];
const DESTRUCTIVE_ACTIONS = ["shutdown", "reboot", "system_off", "power_off"];

/* 방향판의 **자리**는 아홉으로 고정이고, 어느 자리에 무엇이 앉는가는 그 장치가
   공지한 이름이 정한다. 앉을 것이 없는 자리는 빈 칸으로 남는다 — 그 로봇이 그
   방향으로 갈 수 없다는 것은 고장이 아니라 정상이다(AI-C-05).

   이름을 **낱말로 끊어** 본다. `move_forward` 는 {move, forward} 라서 ↑ 에
   앉고, `goto_waypoint` 는 어느 자리에도 앉지 못해 격자에 남는다. 역할도 기종도
   보지 않으므로 새 로봇이 `drive_forward` 를 공지해도 이 코드는 그대로다
   (절대 준수 #3·#7).

   2026-11-03 이전에는 아홉 칸이 늘 단추였고 `forward`·`left`·`right`·`back`
   이라는 **아무도 공지하지 않은 이름**을 보내고 있었다. 드론에도 같은 판이
   떴다 — 공지한 것은 takeoff·land 뿐인데. 자리 이름을 명령으로 쓴 것이 그
   오류였고, 지금 나가는 것은 공지된 문자열 그대로다. */
const JOG_TURN_WORDS = ["turn", "rotate", "yaw", "spin"];
const JOG_SLOTS = [
  {hole: true},
  {glyph: "&uarr;", words: ["forward", "ahead", "advance", "fwd"]},
  {hole: true},
  {glyph: "&larr;", words: ["left", "port"]},
  {hub: true, glyph: "&#9633;", words: ["stop", "hold", "brake"]},
  {glyph: "&rarr;", words: ["right", "starboard"]},
  {hole: true},
  {glyph: "&darr;", words: ["back", "backward", "backwards", "reverse", "rear"]},
  {hole: true},
];
/* 자리 ↔ 자판. 화살표가 아무 일도 하지 않던 것이 사용자가 말한 "키보드 안 맞음"
   의 절반이다. 누르는 것은 **그 자리에 실제로 앉은 action** 이므로, 빈 자리의
   화살표는 눌러도 아무 일이 없다. */
const JOG_KEYS = {ArrowUp: 1, ArrowLeft: 3, ArrowRight: 5, ArrowDown: 7, " ": 4};

const wordsOf = (action) => String(action).toLowerCase().split(/[^a-z0-9]+/);

/* 공지한 어휘를 자리에 **앉힌다**. 돌아오는 것은 자리마다 "그 장치가 공지한
   문자열 그대로" 이고 우리가 지어낸 이름은 하나도 들어가지 않는다. */
function jogLayout(actions){
  const spare = actions.filter(a => !EMERGENCY_ACTIONS.includes(a)
                                 && !DESTRUCTIVE_ACTIONS.includes(a));
  const taken = new Set();
  const claim = (words) => {
    const hit = spare.find(a => {
      if (taken.has(a)) return false;
      const w = wordsOf(a);
      /* 도는 것은 방향 자리에 앉지 않는다 — `turn_left` 가 ← 에 앉으면
         "왼쪽으로 간다" 와 "왼쪽으로 돈다" 가 한 단추가 된다. */
      if (w.some(x => JOG_TURN_WORDS.includes(x))) return false;
      return w.some(x => words.includes(x));
    });
    if (hit) taken.add(hit);
    return hit || null;
  };
  const cells = JOG_SLOTS.map(slot =>
    slot.hole ? {hole: true} : {...slot, action: claim(slot.words)});
  /* 돌림은 **공지한 수만큼** 둔다. 참고 화면에는 둘이지만 그것은 그 로봇이 둘을
     공지했기 때문이다. 하나만 공지한 로봇에 같은 명령을 보내는 단추를 둘 그리면
     둘 중 하나는 거짓말이다. */
  const turns = spare.filter(a => !taken.has(a)
    && wordsOf(a).some(x => JOG_TURN_WORDS.includes(x))).slice(0, 2);
  turns.forEach(a => taken.add(a));
  /* 멈춤 하나만으로는 판을 세우지 않는다 — 그것은 조종 어휘가 아니다. */
  const steering = cells.some(c => c.action && !c.hub) || turns.length > 0;
  return {cells, turns, taken, steering};
}

/* 모니터링 아랫줄의 제어 판. `actions` 는 그 장치가 공지한 것 그대로다. */
function paintControl(nodeId, actions){
  const host = el("monControl");
  if (!host) return;
  const urgent = actions.filter(a => EMERGENCY_ACTIONS.includes(a));
  const heavy = actions.filter(a => DESTRUCTIVE_ACTIONS.includes(a));
  const pad = jogLayout(actions);
  /* 판에 앉은 것은 격자에서 뺀다 — 같은 명령이 두 자리에 있으면 어느 쪽이
     무엇인지 묻게 된다. 판을 세우지 않았으면 전부 격자에 남는다. */
  const plain = actions.filter(a =>
    !EMERGENCY_ACTIONS.includes(a) && !DESTRUCTIVE_ACTIONS.includes(a)
    && !(pad.steering && pad.taken.has(a)));

  host.innerHTML = `
    ${urgent.length ? `<div class="ctlgrid estop">${urgent.map(a =>
      actionButton(a, true)).join("")}</div>` : ""}
    ${plain.length ? `<div class="ctlgrid" style="margin-top:${
      urgent.length ? "10px" : "0"}">${plain.map(a =>
      actionButton(a, false)).join("")}</div>` : ""}
    ${heavy.length ? `<div class="ctlsep">${esc(T("ctl.destructive"))}</div>
      <div class="ctlgrid danger">${heavy.map(a =>
        actionButton(a, true)).join("")}</div>` : ""}

    <div class="ctlsep"><label class="toggle"><input type="checkbox" id="ctlJog"
      ${pad.steering ? "" : "disabled"}>
      <span>${esc(T("ctl.remote"))}</span></label></div>
    ${pad.steering ? `
      <div class="jog">${pad.cells.map(c => c.hole ? `<i class="hole"></i>`
        : c.action
          ? `<button class="${c.hub ? "hub" : ""}" data-jog="${esc(c.action)}"
              title="${esc(c.action)}" disabled>${c.glyph}</button>`
          : `<i class="hole"></i>`).join("")}</div>
      ${pad.turns.length ? `<div class="jogturn">${pad.turns.map((a, i) =>
        `<button data-jog="${esc(a)}" title="${esc(a)}" disabled
          >${i ? "&#8635;" : "&#8634;"}</button>`).join("")}</div>` : ""}
      <div class="jogkey"><kbd>&larr;</kbd><kbd>&uarr;</kbd><kbd>&darr;</kbd
        ><kbd>&rarr;</kbd></div>`
      : `<div class="none">${esc(T("ctl.noSteering"))}</div>`}

    <div class="ctlsep">${esc(T("ctl.log"))}</div>
    <div id="ctlLog" class="cmdlog"><div class="note">${esc(T("app.none"))}</div></div>`;

  const jog = el("ctlJog");
  const pads = () => host.querySelectorAll("button[data-jog]");
  const sync = () => {
    for (const b of pads()) b.disabled = !jog.checked || !S.commanding;
  };
  jog.addEventListener("change", sync);
  for (const b of host.querySelectorAll("button[data-act]"))
    b.addEventListener("click", () => sendCommand(nodeId, b.dataset.act,
                                                  b.dataset.confirm === "1"));
  for (const b of pads())
    b.addEventListener("click", () => sendCommand(nodeId, b.dataset.jog, false));

  /* 자판은 토글이 켜져 있을 때만 듣는다 — 토글이 "잘못 누른 한 번" 을 막는
     장치인데 자판만 그 밖에 있으면 막은 것이 없다.

     **글을 치는 칸에서만** 듣지 않는다: 사유 칸에서 ← 를 눌렀다고 로봇이 돌면
     안 된다. 토글 자체도 `input` 이라 태그 이름만 보고 걸러내면 토글을 켠 직후
     (초점이 토글에 있다) 화살표가 죽는다 — 그래서 **글칸인지**를 본다. */
  const TYPING = ["text", "number", "search", "password", "email", "url", "tel"];
  if (jogKeyHandler) window.removeEventListener("keydown", jogKeyHandler);
  jogKeyHandler = (event) => {
    if (!el("ctlJog") || !el("ctlJog").checked || !S.commanding) return;
    const target = event.target || {};
    const tag = (target.tagName || "").toLowerCase();
    if (tag === "textarea" || tag === "select") return;
    if (tag === "input" && TYPING.includes((target.type || "text").toLowerCase()))
      return;
    const at = JOG_KEYS[event.key];
    if (at === undefined) return;
    const cell = pad.cells[at];
    if (!cell || !cell.action) return;
    event.preventDefault();
    sendCommand(nodeId, cell.action, false);
  };
  window.addEventListener("keydown", jogKeyHandler);
}
let jogKeyHandler = null;

function actionButton(action, danger){
  /* 되돌릴 수 없는 것은 한 번 더 묻는다. 그 확인이 유일한 안전장치는 아니다 —
     로봇의 안전 기능은 상위 네트워크 명령에 기대지 않는다(AI-C-20). */
  return `<button data-act="${esc(action)}" data-confirm="${danger ? 1 : 0}"
    ${S.commanding ? "" : "disabled"}>${esc(action)}</button>`;
}

async function sendCommand(node, action, confirmFirst){
  if (confirmFirst && !window.confirm(`${T("ctl.confirm")}\n\n${node} \u00b7 ${action}`))
    return;
  const log = el("ctlLog");
  if (!log) return;
  const at = new Date().toLocaleTimeString(S.locale);
  try {
    const out = await post("/api/command", {robot: node, action});
    /* 전달·수락·완료는 서로 다른 사실이다(AI-C-20). 셋을 **각자의 칸**에 적는다 —
       한 칸에 합치면 "보냈다" 가 "됐다" 로 읽히고, 통째로 JSON 을 쏟아 놓는 것은
       구분해 적은 것이 아니라 구분하는 일을 읽는 사람에게 떠넘긴 것이다.

       거절은 실행 상태가 아니라 **수락 결과**다 — 그래서 수락 칸에 적고 실행
       칸에는 적지 않는다. */
    const ack = out.acceptance || {};
    const state = (out.status || {}).state || null;
    const facts = [
      [T("ctl.delivered"), out.delivered ? "good" : "critical",
       T(out.delivered ? "app.yes" : "app.no")],
      [T("ctl.accepted"), ack.accepted ? "good" : "critical",
       ack.accepted ? T("app.yes")
         : (ack.rejection_code || ack.rejection_message || T("app.no"))],
      [T("ctl.state"), state === "SUCCEEDED" ? "good"
        : state === "ABORTED" ? "critical" : state ? "warn" : "",
       state || T("ctl.noState")],
    ];
    log.innerHTML = `
      <div class="cmdrow">
        <div class="fnrow"><span class="name"><code>${esc(action)}</code></span>
          <span class="note">${esc(at)}</span></div>
        <div class="cmdfacts">${facts.map(([name, grade, value]) =>
          `<span><i>${esc(name)}</i>${chip(grade, value)}</span>`).join("")}</div>
      </div>` + log.innerHTML;
  } catch (err){
    log.innerHTML = `
      <div class="cmdrow"><div class="fnrow">
        <span class="name"><code>${esc(action)}</code></span>
        ${chip("critical", err.message)}<span class="note">${esc(at)}</span></div></div>`
      + log.innerHTML;
  }
}


/* ── 장치 관리 ───────────────────────────────────────────────────────────
   들이기·보정·학습·모델 교체(배포 책상)와 정답 만들기(라벨)를 한 탭에 둔다.
   그 둘은 **같은 고리의 양 끝**이다 — 정답이 후보가 되고 후보가 학습이 되고
   학습이 모델 교체가 된다. 탭을 갈라 두면 그 고리가 화면에서 끊긴다.

   어느 쪽을 보고 있는지는 위의 조각 단추가 말한다. 권한이 없는 조각은 그리지
   않는다 — 안이 전부 잠긴 조각을 보여 주면 눌러 본 뒤에야 알게 된다. */
const OPS_SECTIONS = [
  /* "움직이기" 는 2026-11-03 에 모니터링 화면의 아랫줄로 갔다 — 로봇 한 대를
     보는 일과 그 로봇을 움직이는 일은 한 화면이다. 여기 남은 둘은 **로봇 한
     대를 두고 하는 일이 아니라** 장치를 들이고 기능을 올리는 다른 종류의
     일이어서, 같은 줄에 밀어 넣지 않고 제 탭에 둔다. */
  {id: "deploy", key: "ops.sec.deploy", needs: ["may_onboard_device", "may_calibrate",
    "may_request_training", "may_deploy_model"], mount: () => Deploy.open()},
  {id: "label", key: "ops.sec.label", needs: ["may_label_ground_truth"],
   mount: () => Labeler.open()},
];

async function paintOps(){
  const open = OPS_SECTIONS.filter(s => s.needs.some(may));
  const nav = el("opsNav");
  const add = el("opsAdd");
  if (!open.length){
    nav.textContent = "";
    add.hidden = true;
    el("opsBody").innerHTML = `<div class="empty">${esc(T("auth.noPermission"))}</div>`;
    return;
  }
  /* + 는 "로봇을 늘리거나 기능을 올리는" 입구다. 그 둘을 할 수 없는 사람에게는
     없는 단추여야 한다 — 눌러서 403 을 받는 단추는 알려 주는 것이 없다. */
  const mayExtend = ["may_onboard_device", "may_deploy_model"].some(may);
  add.hidden = !mayExtend;
  add.title = T("ops.add");
  if (!open.some(s => s.id === S.opsSection)) S.opsSection = open[0].id;
  nav.innerHTML = open.map(s =>
    `<button class="ghost" data-sec="${esc(s.id)}"
      ${s.id === S.opsSection ? 'style="border-color:var(--accent);color:var(--accent)"' : ""}
      >${esc(T(s.key))}</button>`).join(" ");
  nav.querySelectorAll("button[data-sec]").forEach(node =>
    node.addEventListener("click", () => {
      S.opsSection = node.dataset.sec;
      paintOps().catch(reportBoot);
    }));
  const section = open.find(s => s.id === S.opsSection);
  /* 조각마다 자기 본문 칸을 쓴다. 한 칸을 돌려쓰면 돌아왔을 때 앞 조각이
     적어 둔 결과가 사라진다. */
  el("opsBody").innerHTML = `
    <div id="sec-deploy" class="deck" ${S.opsSection === "deploy" ? "" : 'hidden'}></div>
    <div id="sec-label" ${S.opsSection === "label" ? "" : 'hidden'}></div>`;
  await section.mount();
}

/* + — 로봇을 늘리거나 가진 장치에 기능을 올린다. 둘 다 "장치 관리" 조각의 서로
   다른 자리라서, 여기서는 그 자리로 **데려다 줄** 뿐 새 경로를 만들지 않는다. */
function openOpsAdd(){
  Flow.show({
    id: "ops-add", title: T("ops.add"), width: 380,
    body: ``,
    actions: [
      ...(may("may_onboard_device") ? [{label: T("ops.addRobot"), primary: true,
        run: (id) => { Flow.close(id); S.opsSection = "deploy";
          paintOps().then(() => { Deploy.goStep("join");
            if (el("jDev")) el("jDev").focus(); }).catch(reportBoot); }}] : []),
      ...(may("may_deploy_model") ? [{label: T("ops.addFunction"),
        run: (id) => { Flow.close(id); S.opsSection = "deploy";
          paintOps().then(() => { Deploy.goStep("model");
            if (el("mDev")) el("mDev").scrollIntoView(
              {behavior: "smooth", block: "center"}); }).catch(reportBoot); }}] : []),
    ],
  });
}

/* ── 머리글 — Narchon 과 맞춘 것, 맞추지 않은 것 ─────────────────────────
   그 화면의 머리글에는 검색 · 알림(뱃지) · 언어 · **세션 남은 시간 + 연장** ·
   로그아웃이 있고, 본문 머리에는 관리자 모드 토글과 **긴급 대피 알림**이 있다.

   가져온 것: 검색(장치가 34개다 — 목록을 훑는 것보다 이름을 치는 게 빠르다),
   알림(우리에게는 "응답 없는 장치 수" 가 그 자리다), 세션 남은 시간과 연장,
   긴급정지(AI-C-20 이 일반 취소와 **구분하라**고 적은 바로 그것).

   가져오지 않은 것: **관리자 모드 토글.** 우리는 모드가 아니라 능력으로 가른다 —
   토글 하나로 권한이 열리면 그 토글이 곧 권한이 되고, 누가 무엇을 할 수 있는지가
   계정이 아니라 화면 상태에 달리게 된다. */

/* 세션이 끝나기까지. 서버가 **남은 초**를 주므로 시계가 달라도 어긋나지 않는다. */
let sessionLeft = null;
function paintSession(){
  const box = el("sessionBox");
  if (sessionLeft === null || sessionLeft === undefined){ box.textContent = ""; return; }
  const left = Math.max(0, Math.round(sessionLeft));
  const mm = String(Math.floor(left / 60)).padStart(2, "0");
  const ss = String(left % 60).padStart(2, "0");
  const hh = Math.floor(left / 3600);
  box.innerHTML = `<span class="note">${esc(T("auth.sessionLeft"))}</span>
    <code>${hh ? hh + ":" : ""}${hh ? String(Math.floor(left / 60) % 60).padStart(2, "0") : mm}:${ss}</code>
    <button class="link" id="sessionExtend">${esc(T("auth.extend"))}</button>`;
  const extend = el("sessionExtend");
  if (extend) extend.addEventListener("click", async () => {
    /* 연장은 별도 경로가 아니다 — 아무 조회나 한 번 하면 서버가 세션을 늘린다.
       새 경로를 만들면 "연장" 이 권한처럼 보이고, 실제로는 활동의 부산물이다. */
    await api("/api/identity", {}).catch(() => null);
    const id = await api("/api/identity", {}).catch(() => null);
    if (id) sessionLeft = id.session_expires_in_s;
    paintSession();
  });
}
setInterval(() => {
  if (sessionLeft === null || sessionLeft === undefined) return;
  sessionLeft = Math.max(0, sessionLeft - 1);
  /* 분이 바뀔 때만 다시 그린다 — 1초마다 DOM 을 갈아 끼울 이유가 없다. */
  if (Math.round(sessionLeft) % 60 === 0 || sessionLeft < 60) paintSession();
}, 1000);

/* 장치 검색 — 이름을 치면 그 장치 팝업이 바로 뜬다. 34개를 목록에서 찾는
   것보다 빠르고, 어느 탭에 있든 같은 자리다. */
async function runSearch(){
  const text = (el("search").value || "").trim().toLowerCase();
  if (!text) return;
  const rows = await fleetRows().catch(() => []);
  const hit = rows.find(r => String(r.node_id).toLowerCase() === text)
           || rows.find(r => String(r.node_id).toLowerCase().includes(text));
  if (!hit){
    Flow.show({id: "search-miss", title: T("search.none"), width: 300,
               grade: "absent",
               body: `<div><code>${esc(text)}</code></div>`});
    return;
  }
  openDevicePopup(hit.node_id, hit.zone_id, null);
}

/* 알림 — 우리에게 "지금 응답이 없는 것" 은 닿지 않는 장치다. 숫자가 0 이면
   뱃지를 그리지 않는다. 0 을 띄우면 운영자가 그것을 매번 확인하게 된다. */
async function paintAlerts(){
  const rows = await fleetRows().catch(() => []);
  const staleAfter = ((S.freshness || {}).stale_after_s || {}).discovery || 300;
  const needing = rows.filter(r =>
    r.kind === "robot" && (r.presence !== "discovered"
      || r.last_seen_age_s === null || r.last_seen_age_s === undefined
      || r.last_seen_age_s > staleAfter));
  const box = el("alertBox");
  box.innerHTML = needing.length
    ? `<button class="ghost" id="alertGo" title="${esc(T("link.f.need"))}"
        style="border-color:var(--critical);color:var(--critical)">
        ${esc(T("alert.needing"))} ${needing.length}</button>`
    : `<span class="note">${esc(T("alert.none"))}</span>`;
  const go = el("alertGo");
  if (go) go.addEventListener("click", () => {
    S.linkFilter = "need";
    selectTab("link");
  });
}

/* 긴급정지 — 일반 취소와 **다른 것**이다(AI-C-20). 늘 같은 자리에 있고, 급할 때
   격자 안에서 찾게 하지 않는다. 다만 이 화면이 액추에이터를 멈추는 것이 아니라
   **요청을 낸다**는 사실을 숨기지 않는다 — 상위 네트워크 명령만을 안전 기능의
   유일한 경로로 쓰지 않는다는 것이 같은 요구사항의 뒷문장이다. */
function openEmergency(){
  Flow.show({
    id: "estop", title: T("estop.title"), width: 420, grade: "critical",
    body: `
      <div class="ctlsep">${esc(T("estop.targets"))}</div>
      <div id="estopList" class="note">${esc(T("app.loading"))}</div>`,
    mount: async (body) => {
      const rows = (await fleetRows().catch(() => []))
        .filter(r => r.kind === "robot" && (r.announced_actions || []).some(
          a => EMERGENCY_ACTIONS.includes(a)));
      const list = body.querySelector("#estopList");
      list.innerHTML = rows.length
        ? `<div class="ctlgrid estop">${rows.map(r =>
            `<button data-estop="${esc(r.node_id)}">${esc(r.node_id)}
              <em>${esc((r.announced_actions || []).find(
                a => EMERGENCY_ACTIONS.includes(a)) || "")}</em></button>`).join("")}</div>`
        : `<div class="note">${esc(T("estop.noVocabulary"))}</div>`;
      list.querySelectorAll("button[data-estop]").forEach(node =>
        node.addEventListener("click", async () => {
          const target = node.dataset.estop;
          const action = (rows.find(r => r.node_id === target).announced_actions || [])
            .find(a => EMERGENCY_ACTIONS.includes(a));
          node.disabled = true;
          try {
            const out = await post("/api/command", {robot: target, action});
            node.innerHTML = `${esc(target)}<em>${esc(T("ctl.requested"))}</em>`;
            console.info("estop requested", out);
          } catch (err){
            node.disabled = false;
            node.innerHTML = `${esc(target)}<em>${esc(err.message)}</em>`;
          }
        }));
    },
  });
}

/* 빵부스러기 — 팝업이 경로를 선으로 말한다면 이것은 같은 경로를 글로 말한다.
   누르면 그 칸으로 돌아간다. */
function paintCrumbs(){
  const parts = [{label: T("app.title"), go: () => selectTab(visibleTabs()[0].id)}];
  const tab = TABS.find(t => t.id === active);
  if (tab) parts.push({label: T(tab.key), go: () => selectTab(tab.id)});
  if (active === "domains" && shown !== "domains" && S.domainId){
    const dom = (S.domains || []).find(d => d.domain_id === S.domainId);
    if (dom) parts.push({label: label(dom.label), go: () => openDomain(S.domainId)});
    if (shown === "zone" && S.zoneId){
      const zone = ((S.domainScene || {}).zones || [])
        .find(z => z.zone_id === S.zoneId);
      parts.push({label: zone ? label(zone.label) : S.zoneId,
                  go: () => openZone(S.zoneId)});
    }
  }
  const host = el("crumbs");
  host.innerHTML = parts.map((p, i) =>
    (i ? `<span class="sep">&rsaquo;</span>` : "")
    + (i === parts.length - 1
        ? `<span>${esc(p.label)}</span>`
        : `<button data-crumb="${i}">${esc(p.label)}</button>`)).join("");
  host.querySelectorAll("button[data-crumb]").forEach(node =>
    node.addEventListener("click", () => parts[Number(node.dataset.crumb)].go()));
}

/* ===========================================================================
   부팅
   =========================================================================== */
function applyStrings(){
  el("lblLang").textContent = T("app.language");
  el("refresh").textContent = T("app.refresh");
  el("search").placeholder = T("search.placeholder");
  el("h-domains").textContent = T("nav.domains");
  el("h-dev").textContent = T("nav.dev");
  el("h-link").textContent = T("nav.link");
  el("h-control").textContent = T("nav.control");
  el("h-accounts").textContent = T("nav.accounts");
  el("h-robot").textContent = T("nav.robot");
  el("h-sub").textContent = T("sub.heading");
  el("h-ev").textContent = T("ev.heading");
  el("h-mission").textContent = T("nav.mission");
  el("h-trace").textContent = T("trace.heading");
  document.documentElement.lang = S.locale;
}

async function boot(){
  // 신원을 먼저 읽는다 — 권한이 없으면 bootstrap 이 401 이고, 그때 띄울 것은
  // 오류가 아니라 들어가는 길이다.
  await loadIdentity();
  /* 지금은 계정과 권한을 **나누지 않는다.** 서버는 여전히 경로마다 능력을
     확인하므로 세션은 있어야 하고, 그래서 들어가는 문을 사람에게 보여 주는
     대신 능력이 가장 넓은 예시 계정으로 바로 들어간다. 나중에 운영자별로
     갈라야 할 때 이 블록만 지우면 문이 다시 선다 — 서버는 손대지 않았다. */
  if (!(S.identity || {}).authenticated
      && (S.identity || {}).auth_mode === "demo_roles"){
    /* 어느 계정이 가장 넓은가는 **서버의 역할 표**가 말한다. 계정 목록에는
       능력이 실려 있지 않으므로 이름 순서로 고르면 우연에 기대게 된다. */
    const roles = (S.identity || {}).roles || {};
    const widest = ((S.identity || {}).selectable_accounts || [])
      .slice().sort((a, b) => (roles[b.role] || []).length
                            - (roles[a.role] || []).length)[0];
    if (widest){
      await fetch("/api/assume", {method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({account: widest.account_id})}).catch(() => null);
      await loadIdentity();
    }
  }
  let b;
  try { b = await api("/api/bootstrap", {}); }
  catch (err){
    S.strings = S.strings && Object.keys(S.strings).length ? S.strings : {};
    paintIdentity();
    openGate();
    return;
  }
  S.strings = b.strings; S.scene = b.scene; S.domains = b.domains;
  // 권한은 능력 목록이다. 역할 이름으로 분기하지 않으므로 화면도 능력을 묻는다.
  S.caps = {
    may_command: may("may_issue_command"),
    may_correct: may("may_correct_evidence") || may("may_label_ground_truth"),
    // 자리를 고치는 것과 근거를 고치는 것은 다른 능력이다. 한 칸으로 묶으면
    // 한쪽 역할에는 없는 버튼이 생기고 다른 쪽에는 눌러도 403 인 버튼이 생긴다.
    may_edit_placement: may("may_edit_placement"),
    sees_internals: may("may_see_internals"),
  };
  S.commanding = b.commanding_available; S.explaining = b.evidence_available;
  /* 언제부터 오래된 것으로 볼지는 **서버가** 말한다. 뷰어마다 따로 정하면 같은
     값이 한 화면에서는 신선하고 다른 화면에서는 오래된 것이 된다. */
  S.freshness = b.freshness || {stale_after_s: {}, states: ["never", "fresh", "stale"]};
  S.facts = b.facts_vocabulary || {};
  applyStrings();
  paintIdentity();
  renderTabs();
  paintDomains();
  /* 첫 탭을 실제로 연다. `active` 를 정해 두는 것만으로는 패널에 `.on` 이 붙지
     않아 로그인 직후 본문이 통째로 비어 있었다 — 탭을 한 번 눌러야 뭔가 보였다. */
  selectTab(active);
  if (S.domainScene) paintDomain();
  if (S.zoneId) await repaintZone();
  el("stamp").textContent = T("app.updated") + " " + new Date().toLocaleTimeString(S.locale);
  // 탭 본문은 그 탭을 열 때 채운다. 여기서는 아직 열지 않았다는 사실만 적는다.
  for (const [id, key] of [["evBody", "ev.noPick"], ["missionBody", "mission.hint"],
                           ["traceBody", "dev.subject"], ["devBody", "dev.objects"]])
    if (!el(id).childElementCount)
      el(id).innerHTML = `<div class="empty">${esc(T(key))}</div>`;
}

el("refresh").addEventListener("click", () => boot().catch(reportBoot));
el("locale").addEventListener("change", (e) => { S.locale = e.target.value; boot().catch(reportBoot); });
function reportBoot(err){
  /* 콘솔에도 남긴다. 화면에 한 줄만 적으면 어디서 터졌는지가 사라지고, 실제로
     `S.freshness` 가 없어 목록이 "읽는 중" 에 멈춘 것을 한참 뒤에야 알았다. */
  console.error("console failed:", err);
  document.querySelector("main").insertAdjacentHTML("afterbegin",
    `<div class="empty">${esc(err && err.message || String(err))}</div>`);
}
/* 레일을 접고 편다. 접힌 상태는 브라우저에 남겨 다음에 열 때도 그대로다 —
   접는 사람은 매번 접는다. */
const RAIL_KEY = "fms.rail.tight";
function applyRail(tight){
  document.querySelector(".shell").classList.toggle("tight", tight);
  el("menu").setAttribute("aria-expanded", String(!tight));
  try { localStorage.setItem(RAIL_KEY, tight ? "1" : "0"); } catch (err){ /* 사설 창 */ }
  Flow.redraw();
}
el("opsAdd").addEventListener("click", openOpsAdd);
el("search").addEventListener("keydown", (event) => {
  if (event.key === "Enter") runSearch().catch(reportBoot);
});
el("menu").addEventListener("click", () =>
  applyRail(!document.querySelector(".shell").classList.contains("tight")));
try { applyRail(localStorage.getItem(RAIL_KEY) === "1"); } catch (err){ /* 사설 창 */ }

el("locale").value = S.locale;
boot().catch(reportBoot);
</script>
