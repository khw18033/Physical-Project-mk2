/* ===========================================================================
   임무 명령 — 한 화면에서 **고르고 · 나누고 · 보내고 · 왜 그랬는지 본다**

   탭은 하나이고 깊이는 팝업이 맡는다. 길은 이렇다.

     추천 임무 → [메인 임무] → [서브태스크 산출] → 서브태스크 팝업(지도 포함)
                                        ↓                    ↓
                                   [이 구역 진행]        [근거] [왜 실패했는가]
                                                              ↓
                                                        고쳐서 학습 후보로

   팝업끼리는 선으로 이어져 있어서(Flow) 어디서 왔는지가 화면에 남는다. 탭을
   더 만들지 않는 이유가 그것이다 — 탭을 갈아타면 온 길이 사라진다.

   경계: 여기서 물리 명령을 **발급하지 않는다**(AI-C-19). 진행은 요청이고,
   전달·수락·완료는 서로 다른 사실이다(AI-C-20).
   =========================================================================== */
async function paintMission(){
  const host = el("missionBody");
  host.innerHTML = `<div class="empty">${esc(T("app.loading"))}</div>`;
  const rows = await fleetRows().catch(() => []);
  const robots = rows.filter(r => r.kind === "robot" && r.presence === "discovered");
  const all = rows.filter(r => r.kind === "robot");
  const pool = robots.length ? robots : all;
  if (!pool.length){
    host.innerHTML = `<div class="empty">${esc(T("mis.noRobot"))}</div>`;
    return;
  }
  if (!S.robotId || !pool.some(r => r.node_id === S.robotId))
    S.robotId = pool[0].node_id;
  const robot = S.robotId;

  /* 권할 임무 — 촉발 근거가 선 것만 "권함" 이고, 막힌 것도 **무엇이 없어서**
     막혔는지와 함께 보인다(AI-B-15). 빈 목록도 정상이다. */
  let recs = [];
  try { recs = (await api("/api/recommend", {robot})).recommendations || []; }
  catch (err){ /* 선언 구역이 없을 수 있다 */ }
  if (!S.goalKind || !recs.some(r => r.goal_kind === S.goalKind))
    S.goalKind = (recs.find(r => r.recommended) || recs[0] || {}).goal_kind
                 || S.goalKind || "m10_dt_map_update";

  /* 임무를 **고르기 전에는** 경로도 구역별 진행도 그리지 않는다. 그 내용은
     명령을 내린 뒤 서브태스크와 **함께 산출되는 것**이고, 고르기 전에 그려 두면
     아직 내리지 않은 명령의 경로가 이미 정해진 것처럼 보인다. */
  const chosen = S.missionSelected || null;
  let plan = null, work = {};
  if (chosen){
    try { plan = await api("/api/mission", {robot, function: chosen}); }
    catch (err){ /* 목표가 없을 수 있다 */ }
    work = await missionWork(robot, chosen, (plan && plan.zone_order) || []);
  }
  S.missionRobot = robot;
  S.missionRoute = (plan && plan.zone_order) || [];
  S.missionWork = work;
  const run = ((plan && plan.status) || {}).run || null;
  const attempts = ((plan && plan.status) || {}).history || [];
  const title = chosen
    ? (T("mission.kind." + (recs.find(r => r.goal_kind === chosen) || {}).mission_kind)
       || chosen) : "";

  host.innerHTML = `
    <div class="subject">
      <select id="misRobot">${pool.map(r =>
        `<option value="${esc(r.node_id)}" ${r.node_id === robot ? "selected" : ""}
          >${esc(r.node_id)}</option>`).join("")}</select>
      <span id="misWhere"></span>
      <div style="flex:1"></div>
      ${chosen ? `<strong>${esc(title)}</strong>
        <button class="ghost" id="misOpen">${esc(T("mis.open"))}</button>
        <button class="ghost" id="misClear">${esc(T("mis.clear"))}</button>` : ""}
    </div>
    <div class="mongrid">
      <div class="card ${chosen ? "fig" : "wide fig"}">
        <div class="cardhead"><h3>${esc(T("mis.recommend"))}</h3>
        <div class="tools">${recs.filter(r => r.recommended).length
          ? chip("good", `${recs.filter(r => r.recommended).length}`)
          : chip("", T("mis.noTrigger"))}</div></div>
        <div class="grow" id="misRecs"></div></div>
      ${chosen ? `
      <div class="card wide fig"><div class="cardhead"><h3>${esc(T("mis.progress"))}</h3>
        <div class="tools" id="misRunTools"></div></div>
        <div class="grow" id="misLegs"></div></div>
      <div class="card wide media"><div class="cardhead"><h3>${esc(T("mis.route"))}</h3>
        <div class="tools"></div></div>
        <div id="misMap" class="mapwrap" style="grid-template-columns:minmax(0,1fr)"></div></div>
      <div class="card fig"><div class="cardhead"><h3>${esc(T("mis.attempts"))}</h3></div>
        <div class="grow" id="misAttempts"></div></div>` : ""}
    </div>`;

  el("misRobot").addEventListener("change", (event) => {
    S.robotId = event.target.value;
    /* 다른 로봇을 고르면 앞 로봇의 경로는 더 이상 그 로봇의 것이 아니다. */
    S.missionSelected = null;
    paintMission().catch(reportBoot);
  });
  if (el("misOpen"))
    el("misOpen").addEventListener("click", () => openMissionPopup(robot, chosen));
  if (el("misClear"))
    el("misClear").addEventListener("click", () => {
      S.missionSelected = null;
      Flow.closeAll();
      paintMission().catch(reportBoot);
    });

  const here = rows.find(r => r.node_id === robot);
  el("misWhere").innerHTML = here
    ? chip(here.presence === "discovered" ? "good" : "",
           label(here.zone_label) || here.zone_id || T("app.none")) : "";

  /* 추천 */
  el("misRecs").innerHTML = recs.length
    ? `<ul class="plain">${recs.map(r => `<li>
        <div class="fnrow">
          <span class="name">${esc(T("mission.kind." + r.mission_kind)
                                    || r.title || r.mission_kind)}</span>
          ${r.recommended ? chip("good", T("mis.recommended"))
                          : chip("", T("mis.blocked"))}
        </div>
        <div class="note">${esc(pick("mis.reason.", r.reason))}</div>
        ${(r.matched_triggers || []).length ? `<div class="tags">${
          r.matched_triggers.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>` : ""}
        ${(r.missing_capabilities || []).length ? `<div class="tags">${
          r.missing_capabilities.map(t => `<span class="tag miss">${esc(t)}</span>`).join("")
        }</div>` : ""}
        <button class="link" data-goal="${esc(r.goal_kind)}">${esc(T("mis.openThis"))}</button>
      </li>`).join("")}</ul>`
    : `<div class="note">${esc(T("mis.noRecommendation"))}</div>`;
  el("misRecs").querySelectorAll("button[data-goal]").forEach(node =>
    node.addEventListener("click", async () => {
      /* 고르는 순간 경로·구역별 할 일이 **산출된다**. 그 전에는 없다. */
      S.missionSelected = node.dataset.goal;
      S.goalKind = node.dataset.goal;
      await paintMission().catch(reportBoot);
      openMissionPopup(robot, S.missionSelected);
    }));

  if (!chosen) return;

  /* 구역별 진행 — 계획 상태와 **실제 시도 결과**를 다른 칸에 둔다. 한 칸에
     합치면 "계획상 가능" 과 "해 봤더니 됐다" 가 구별되지 않는다. */
  const legs = (plan && plan.legs) || [];
  const attemptOf = (zoneId) => attempts.filter(a => a.zone_id === zoneId).slice(-1)[0];
  el("misLegs").innerHTML = legs.length
    ? `<table class="logtable"><thead><tr>
         <th>#</th><th>${esc(T("mission.leg"))}</th><th>${esc(T("sub.plan"))}</th>
         <th>${esc(T("mis.done"))}</th><th></th></tr></thead>
       <tbody>${legs.map(leg => {
         const done = attemptOf(leg.zone_id);
         return `<tr>
           <td>${leg.order_index + 1}</td>
           <td><strong>${esc(leg.zone_id)}</strong>
             ${leg.radio_handover_required ? chip("warn", T("zone.radioHandover")) : ""}</td>
           <td>${chip(LEG_GRADE[leg.reason] || "", pick("mis.leg.", leg.reason))}</td>
           <td>${done ? chip(done.completed ? "good" : "critical",
                             pick("mis.att.", (done.reason || "").split(":")[0]))
                      : `<span class="note">${esc(T("mis.notRun"))}</span>`}</td>
           <td><button class="link" data-leg="${esc(leg.zone_id)}"
                 >${esc(T("mis.openSubtasks"))}</button></td></tr>`;
       }).join("")}</tbody></table>`
    : `<div class="note">${esc(T("app.none"))}</div>`;
  el("misLegs").querySelectorAll("button[data-leg]").forEach(node =>
    node.addEventListener("click", () =>
      openSubtaskPopup(robot, S.goalKind, node.dataset.leg, null)));
  el("misRunTools").innerHTML = run
    ? chip(run.completed ? "good" : "warn", pick("mis.term.", run.terminal))
    : chip("", T("mis.notRun"));

  /* 지도 — **지나갈 구역 순서를 미리** 긋는다. */
  await paintMissionMap(here);

  /* 시도 이력 — 실패한 줄에서 원인 추적으로 들어간다. */
  el("misAttempts").innerHTML = attempts.length
    ? `<ul class="plain">${attempts.slice().reverse().map(a => `<li>
        <div class="fnrow"><span class="name">${esc(a.zone_id)}
          <span class="note">#${a.attempt}</span></span>
          ${chip(a.completed ? "good" : "critical",
                 pick("mis.att.", (a.reason || "").split(":")[0]))}</div>
        <div class="note">${(a.outcomes || []).map(o =>
          `${esc(o.subtask_id.split(":").slice(1, 2)[0] || o.subtask_id)}
           <code>${esc(o.outcome)}</code>`).join(" · ")}</div>
        ${(a.sacrificed || []).length ? `<button class="link"
           data-why="${esc(a.sacrificed[0])}">${esc(T("mis.whyFailed"))}</button>` : ""}
      </li>`).join("")}</ul>`
    : `<div class="note">${esc(T("mis.noAttempt"))}</div>`;
  el("misAttempts").querySelectorAll("button[data-why]").forEach(node =>
    node.addEventListener("click", () => openFailurePopup(node.dataset.why, null)));
}

const LEG_GRADE = {fully_executable: "good", partially_executable: "warn",
                   not_executable: "critical"};
/* 서버가 내는 사유 문자열을 그대로 쓰되, 번역이 있으면 번역을 쓴다. 번역이
   없다고 빈칸을 두면 **사유가 사라진다** — 원문이라도 보여 주는 편이 낫다. */
const pick = (prefix, value) => T(prefix + value) || value || "";

/* 구역마다 **무엇을 하는가**. 서브태스크 경로(`/api/subtasks`)에서 그대로 가져온다 —
   지도에 적히는 글과 서브태스크 팝업의 표가 다른 출처에서 나오면 둘이 어긋난다.
   임무를 고른 뒤에만 불린다. */
async function missionWork(robot, goalKind, zones){
  const graphs = await Promise.all(zones.map(zone =>
    api("/api/subtasks", {robot, function: goalKind, zone}).catch(() => null)));
  const out = {};
  zones.forEach((zone, i) => {
    const graph = graphs[i];
    if (!graph) return;
    out[zone] = (graph.nodes || []).map(step =>
      step.executable ? step.action : `${step.action} (${T("sub.notExecutable")})`);
  });
  return out;
}

/* 임무 지도 — 지금 그 로봇이 있는 도메인을 펴고 지나갈 순서를 긋는다. */
async function paintMissionMap(here){
  const host = el("misMap");
  if (!here || !here.domain){
    host.innerHTML = `<div class="note">${esc(T("mis.noZone"))}</div>`;
    return;
  }
  const scene = await api("/api/domain", {id: here.domain}).catch(() => null);
  if (!scene){ host.innerHTML = `<div class="note">${esc(T("app.none"))}</div>`; return; }
  const stage = document.createElement("div");
  host.textContent = "";
  host.appendChild(stage);
  Map3D.drawDomain(stage, scene, {
    route: S.missionRoute,
    annotations: S.missionWork || {},
    onHover(zone, event){
      /* 커서를 올리면 그 구역 안의 현황을 바로 본다 — 들어가지 않고도
         "거기 무엇이 있고 무엇이 되는가" 를 알 수 있어야 한다. */
      showPop(`<h4>${esc(label(zone.label))}</h4>
        <div>${chip(ZONE_GRADE[zone.state], T("map.state." + zone.state))}
          ${S.missionRoute.includes(zone.zone_id)
            ? chip("", `${T("mis.visitOrder")} ${S.missionRoute.indexOf(zone.zone_id) + 1}`)
            : ""}</div>
        <dl class="kv" style="margin-top:8px">
          <dt>${esc(T("zone.discovered"))}</dt>
          <dd>${zone.discovered_count} / ${zone.declared_count}</dd>
          <dt>${esc(T("zone.usable"))}</dt><dd>${(zone.usable_functions || []).length}</dd>
          <dt>${esc(T("zone.edge"))}</dt>
          <dd>${esc(zone.edge_node || T("app.none"))}</dd>
        </dl>`, event);
    },
    onLeave: hidePop,
    onClick(zoneId){
      hidePop();
      openSubtaskPopup(S.missionRobot, S.goalKind, zoneId, null);
    },
  }, null);
}

/* ── 메인 임무 팝업 ─────────────────────────────────────────────────── */
async function openMissionPopup(robot, goalKind){
  const id = "mission:" + robot + ":" + goalKind;
  Flow.show({id, title: T("mis.main"), trail: robot, width: 470,
             body: `<div class="note">${esc(T("app.loading"))}</div>`});
  let plan;
  try { plan = await api("/api/mission", {robot, function: goalKind}); }
  catch (err){
    Flow.show({id, title: T("mis.main"), width: 420, grade: "absent",
               body: `<div class="note">${esc(err.message)}</div>`});
    return;
  }
  S.missionRoute = plan.zone_order || [];
  const legs = plan.legs || [];
  const blocked = legs.filter(l => !l.runnable).length;
  Flow.show({
    id, title: T("mis.main"), trail: robot, width: 470,
    grade: blocked ? "warn" : "good",
    body: `
      <dl class="kv">
        <dt>${esc(T("sub.goalKind"))}</dt><dd><code>${esc(plan.goal_kind)}</code></dd>
        <dt>${esc(T("mis.startZone"))}</dt><dd><code>${esc(plan.start_zone)}</code></dd>
        <dt>${esc(T("mission.order"))}</dt>
        <dd>${(plan.zone_order || []).map((z, i) =>
          `<span class="tag zone">${i + 1}. ${esc(z)}</span>`).join(" ")}</dd>
      </dl>
      <div class="ctlsep">${esc(T("mis.legs"))}</div>
      <ul class="plain">${legs.map(leg => `<li>
        <div class="fnrow"><span class="name">${esc(leg.zone_id)}</span>
          ${chip(LEG_GRADE[leg.reason] || "", pick("mis.leg.", leg.reason))}</div>
        ${(leg.blocked_capabilities || []).length ? `<div class="tags">${
          leg.blocked_capabilities.map(k =>
            `<span class="tag miss">${esc(k)}</span>`).join("")}</div>` : ""}
        <button class="link" data-leg="${esc(leg.zone_id)}"
          >${esc(T("mis.openSubtasks"))}</button>
      </li>`).join("")}</ul>
      `,
    actions: may("may_issue_command")
      ? [{label: T("mis.runAll"), primary: true,
          run: () => runMission(robot, goalKind, null, id)}] : null,
    mount(body){
      body.querySelectorAll("button[data-leg]").forEach(node =>
        node.addEventListener("click", () =>
          openSubtaskPopup(robot, goalKind, node.dataset.leg, id)));
    },
  });
}

/* ── 서브태스크 팝업 — 단계 · 어디서 도는가 · 지도 · 진행 ─────────────── */
async function openSubtaskPopup(robot, goalKind, zoneId, parent){
  const id = "sub:" + zoneId;
  Flow.show({id, parent, title: T("sub.heading"), trail: zoneId, width: 560,
             body: `<div class="note">${esc(T("app.loading"))}</div>`});
  let graph, zone;
  try {
    [graph, zone] = await Promise.all([
      api("/api/subtasks", {robot, function: goalKind, zone: zoneId}),
      api("/api/zone", {id: zoneId}).catch(() => null),
    ]);
  } catch (err){
    Flow.show({id, parent, title: T("sub.heading"), trail: zoneId, width: 420,
               grade: "absent", body: `<div class="note">${esc(err.message)}</div>`});
    return;
  }
  const nodes = graph.nodes || [];
  const blocked = nodes.filter(n => !n.executable);
  Flow.show({
    id, parent, title: T("sub.heading"), trail: zoneId, width: 560,
    grade: blocked.length ? "warn" : "good",
    body: `
      <div class="note">${esc(T("sub.derivedFrom"))}
        <code>${esc(graph.template_version || graph.goal_kind)}</code>
        ${graph.generator ? ` · ${esc(T("sub.generator"))}
          <code>${esc(graph.generator)}</code>` : ""}</div>
      <div id="subMap" style="margin:10px 0;min-height:170px"></div>
      <table class="logtable"><thead><tr>
        <th>#</th><th>${esc(T("sub.step"))}</th><th>${esc(T("sub.runsOn"))}</th>
        <th>${esc(T("fn.state.ACTIVE"))}</th><th></th></tr></thead>
        <tbody id="subRows"></tbody></table>
      <div id="subOut" style="margin-top:10px"></div>`,
    actions: may("may_issue_command")
      ? [{label: T("mis.runZone"), primary: true,
          run: () => runMission(robot, goalKind, zoneId, id)}] : null,
    async mount(body){
      /* 지도 — 이 구역 안에서 **어떤 장치를 차례로 쓰는가**. 단계의 실행
         위치를 자리로 옮겨 그린다. 주행 경로가 아니다. */
      const stage = body.querySelector("#subMap");
      if (zone){
        const byId = {};
        for (const row of (zone.robots || [])) if (row.at) byId[row.node_id] = row.at;
        for (const item of (zone.infrastructure || [])) if (item.at) byId[item.id] = item.at;
        const route = [];
        for (const step of nodes){
          const at = byId[step.executor_id || graph.executor || robot];
          if (at && (!route.length || route[route.length - 1] !== at)) route.push(at);
        }
        Map3D.drawZone(stage, zone, {
          selected: robot,
          route,
          onRobotHover(row, event){
            showPop(`<h4>${esc(row.node_id)}</h4>
              <div>${chip(row.presence === "discovered" ? "good" : "",
                          T("robot.presence." + row.presence))}</div>
              <div class="note">${esc(T("robot.functions"))}
                ${(row.functions || []).filter(f => f.state !== "DISABLED").length}
                / ${(row.functions || []).length}</div>`, event);
          },
          onDeviceHover(item, event){
            showPop(`<h4>${esc(item.id)}</h4>
              <div class="note">${esc(item.kind)}</div>`, event);
          },
          onLeave: hidePop,
          onRobotClick(nodeId){ hidePop(); openDevicePopup(nodeId, zoneId, id); },
        });
      } else {
        stage.innerHTML = `<div class="note">${esc(T("mis.noZone"))}</div>`;
      }

      body.querySelector("#subRows").innerHTML = nodes.map((step, i) => `
        <tr><td>${i + 1}</td>
          <td><strong>${esc(step.action)}</strong>
            ${(step.missing_required || []).map(k =>
              `<span class="tag miss">${esc(k)}</span>`).join("")}
            ${(step.missing_optional || []).map(k =>
              `<span class="tag">${esc(k)}</span>`).join("")}</td>
          <td class="note">${(step.runs_on || []).map(r =>
            esc(T("sub.runsOn." + r) || r)).join(" + ") || "-"}</td>
          <td>${step.executable
                ? chip(FN_GRADE[step.state] || "good", T("fn.state." + step.state))
                : chip("", T("sub.notExecutable"))}</td>
          <td><button class="link" data-ev="${esc(step.subtask_id)}"
                data-cap="${esc(step.capability_kind || "")}"
                >${esc(T("sub.evidence"))}</button></td></tr>`).join("");
      body.querySelectorAll("button[data-ev]").forEach(node =>
        node.addEventListener("click", () =>
          openEvidencePopup(robot, zoneId, node.dataset.cap, node.dataset.ev, id)));
    },
  });
}

/* ── 진행 — 한 구역씩 또는 통째로 ───────────────────────────────────── */
async function runMission(robot, goalKind, zoneId, parent){
  const id = "run:" + (zoneId || "all");
  Flow.show({id, parent, title: T("mis.running"), trail: zoneId || "", width: 460,
             body: `<div class="note">${esc(T("app.loading"))}</div>`});
  let out;
  try {
    out = await post("/api/mission-run",
      zoneId ? {robot, goal_kind: goalKind, zone: zoneId}
             : {robot, goal_kind: goalKind});
  } catch (err){
    Flow.show({id, parent, title: T("mis.running"), width: 420, grade: "critical",
               body: `<div class="note">${esc(err.message)}</div>`});
    return;
  }
  const run = out.run || {};
  const attempts = run.attempts || [];
  Flow.show({
    id, parent, width: 480, trail: zoneId || "",
    title: T("mis.ran"),
    grade: run.completed ? "good" : "critical",
    body: `
      <div>${chip(run.completed ? "good" : "critical", pick("mis.term.", run.terminal))}
        ${run.stop_reason ? `<span class="note">${esc(run.stop_reason)}</span>` : ""}</div>
      ${attempts.map(a => `
        <div class="ctlsep">${esc(a.zone_id)} · #${a.attempt}</div>
        <table class="logtable"><tbody>${(a.outcomes || []).map(o => `<tr>
          <td>${esc(o.subtask_id.split(":").slice(1, 2)[0] || o.subtask_id)}</td>
          <td>${chip(OUTCOME_GRADE[o.outcome] || "", T("mis.out." + o.outcome) || o.outcome)}</td>
          <td>${o.outcome === "SUCCEEDED" ? "" : `<button class="link"
                data-why="${esc(o.subtask_id)}">${esc(T("mis.whyFailed"))}</button>`}</td>
          </tr>`).join("")}</tbody></table>`).join("")}
      ${(run.unexecuted_zones || []).length ? `<div class="note" style="margin-top:8px">
        ${esc(T("mis.unexecuted"))}: ${run.unexecuted_zones.map(esc).join(", ")}</div>` : ""}`,
    mount(body){
      body.querySelectorAll("button[data-why]").forEach(node =>
        node.addEventListener("click", () => openFailurePopup(node.dataset.why, id)));
    },
  });
  /* 탭의 진행 칸도 같이 따라간다 — 팝업만 갱신하면 뒤의 표가 옛값을 말한다. */
  paintMission().catch(reportBoot);
}

const OUTCOME_GRADE = {SUCCEEDED: "good", FAILED: "critical", UNAVAILABLE: ""};

/* ── 근거 팝업 — 화이트박스 ──────────────────────────────────────────
   "모델이 0.87 이라고 했다" 는 설명이 아니다. 이 팝업은 그 단계가 **어떤 종류의
   근거를 낼 수 있는지**, 그중 무엇이 결론을 가를 수 있는지(외형은 못 가른다),
   그리고 지금 그것을 낼 capability 가 있는지를 함께 적는다. 셋이 다 있어야
   "왜 그렇게 봤는가" 와 "무엇이 없어서 못 가렸는가" 를 구분할 수 있다. */
async function openEvidencePopup(robot, zoneId, capability, subtaskId, parent){
  const id = "ev:" + (subtaskId || capability || "all");
  Flow.show({id, parent, title: T("ev.heading"), trail: capability || "", width: 520,
             body: `<div class="note">${esc(T("app.loading"))}</div>`});
  let out;
  try {
    out = await api("/api/evidence-kinds",
                    {robot, zone: zoneId || "", capability: capability || ""});
  } catch (err){
    Flow.show({id, parent, title: T("ev.heading"), width: 420, grade: "absent",
               body: `<div class="note">${esc(err.message)}</div>`});
    return;
  }
  const kinds = out.kinds || [];
  const usable = kinds.filter(k => k.producible);
  const discriminating = usable.filter(k => k.discriminating);
  Flow.show({
    id, parent, title: T("ev.heading"), trail: capability || "", width: 520,
    grade: discriminating.length ? "good" : "warn",
    body: `
      ${subtaskId ? `<div class="note"><code>${esc(subtaskId)}</code></div>` : ""}
      <div class="strip" style="margin:10px 0">
        ${cell("ev.producible", `${usable.length} / ${kinds.length}`)}
        ${cell("ev.discriminating", discriminating.length)}
      </div>
      <table class="logtable">
        <colgroup><col style="width:42%"><col style="width:16%">
          <col style="width:16%"><col style="width:26%"></colgroup>
        <thead><tr>
        <th>${esc(T("ev.kind"))}</th><th>${esc(T("ev.tier"))}</th>
        <th>${esc(T("ev.canTell"))}</th><th>${esc(T("ev.now"))}</th></tr></thead>
        <tbody>${kinds.map(k => `<tr>
          <td><strong>${esc(k.kind)}</strong>
            ${k.note ? `<div class="note">${emph(k.note)}</div>` : ""}</td>
          <td>${chip(TIER_GRADE[k.tier] || "", T("ev.tier." + k.tier) || k.tier)}</td>
          <td>${k.discriminating ? chip("good", T("ev.yes"))
                                 : `<span class="note">${esc(T("ev.no"))}</span>`}</td>
          <td>${k.producible
                ? chip("good", T("ev.have"))
                : chip("", T("app.unmeasured"))}
            ${!k.producible && k.capability_kind
              ? `<div class="note"><code>${esc(k.capability_kind)}</code></div>` : ""}</td>
          </tr>`).join("")}</tbody></table>
      `,
    /* HITL — 고치는 자리는 라벨 책상이다. 여기서 바로 고치게 하면 같은 입력
       화면이 두 벌이 되고, 둘 중 하나만 장부에 남는 일이 생긴다. */
    actions: may("may_label_ground_truth")
      ? [{label: T("ev.correct"),
          run: () => { S.opsSection = "label"; selectTab("control"); }}] : null,
  });
}

const TIER_GRADE = {measured: "good", declared: "", estimated: "warn"};

/* ===========================================================================
   들어가기 — 역할을 고르거나 계정으로

   이 콘솔은 두 자세로 돈다. 계정 파일이 없으면 비밀번호 없이 역할을 고르고(예시),
   계정이 하나라도 있으면 비밀번호로 들어온다. 어느 자세인지는 서버가 `auth_mode` 로
   말해 주므로 화면이 추측하지 않는다.
   =========================================================================== */
async function loadIdentity(){
  S.identity = await (await fetch("/api/identity")).json();
  return S.identity;
}
const may = (permission) => (S.identity && S.identity.permissions || []).includes(permission);

function paintIdentity(){
  const id = S.identity || {};
  const acct = id.account;
  const who = acct ? (acct.display_name || acct.account_id) : (id.demo_account || "");
  /* 이름만 적는다. 어떤 자세로 들어왔는지(예시 역할인지 비밀번호인지)와 세션이
     몇 분 남았는지는 지금 이 화면이 하는 일과 상관이 없다. */
  el("identityBox").innerHTML = id.authenticated
    ? `<strong>${esc(who)}</strong>`
    : `<button class="primary" id="signIn">${esc(T("auth.signIn"))}</button>`;
  const out = el("signOut");
  if (out) out.addEventListener("click", async () => {
    await fetch("/api/logout", {method:"POST"});
    await boot();
  });
  const into = el("signIn");
  if (into) into.addEventListener("click", openGate);
}

function openGate(){
  const id = S.identity || {};
  const demo = id.auth_mode === "demo_roles";
  el("gateCard").innerHTML = `
    <h2>${esc(T("app.title"))} · ${esc(T("auth.signIn"))}</h2>
    ${demo
      ? `<div class="row">
           <select id="gateRole">${(id.selectable_accounts || []).map(a =>
             `<option value="${esc(a.account_id)}">${esc(a.account_id)}
               · ${esc(a.display_name)}</option>`).join("")}</select>
           <button class="primary" id="gateGo">${esc(T("auth.pickAccount"))}</button>
         </div>`
      : `<div class="row"><input id="gateUser" placeholder="${esc(T("auth.account"))}"></div>
         <div class="row"><input id="gatePass" type="password"
                                 placeholder="${esc(T("auth.password"))}"></div>
         <div class="row"><button class="primary" id="gateGo">${esc(T("auth.signIn"))}</button></div>`}
    <div id="gateOut" class="note" style="margin-top:10px"></div>`;
  el("gate").hidden = false;
  el("gateGo").addEventListener("click", async () => {
    const out = el("gateOut");
    out.textContent = T("app.loading");
    try{
      const path = demo ? "/api/assume" : "/api/login";
      const payload = demo
        ? {account: el("gateRole").value}
        : {account_id: el("gateUser").value, password: el("gatePass").value};
      const response = await fetch(path, {method:"POST",
        headers:{"Content-Type":"application/json"}, body:JSON.stringify(payload)});
      if (!response.ok){
        const body = await response.json().catch(() => ({}));
        out.innerHTML = `${esc(T("auth.failed"))} · <code>${esc(body.error || response.status)}</code>`;
        return;
      }
      el("gate").hidden = true;
      await boot();
    }catch(err){ out.innerHTML = `<code>${esc(err.message)}</code>`; }
  });
}

/* ===========================================================================
   계정과 권한 — 관리자 화면

   역할을 넓히지 않고 한 사람에게만 능력을 더하는 것이 이 화면의 요점이다. 역할이
   주는 능력은 여기서 뺄 수 없고(빼면 "그 역할이 무엇인가" 가 사람마다 달라진다),
   서버가 그 사유를 그대로 돌려준다.
   =========================================================================== */
/* ===========================================================================
   라벨 편집기 — 사람이 모델의 답을 고쳐 정답을 만든다

   AI-L-03: 여기서 모델이 바뀌지 않는다. 제출은 **사람이 확인한 학습 후보**를
   여는 것까지이고, 운영에 닿으려면 AI-L-05 검증과 AI-L-07 단계적 적용을 지나야
   한다. 그래서 이 화면의 버튼 이름이 "학습" 이 아니라 "정답 제출" 이다.

   좌표는 정규화(0..1)로만 들고 다닌다. 화면 픽셀로 들면 창 크기를 바꾸거나 다른
   해상도의 기기에서 같은 라벨을 열었을 때 전부 틀린다(labeling.py 와 같은 규약).

   판정(confirmed/adjusted/relabeled/rejected/added)은 **서버가 정한다.** 이 화면은
   무엇을 고쳤는지만 보내고 "내가 맞다고 했다" 를 보내지 않는다 — 보내게 하면
   좌표를 바꿔 놓고 confirmed 라고 적는 제출이 통과한다.
   =========================================================================== */
const Labeler = (() => {
  const HANDLES = [["nw",0,0],["n",.5,0],["ne",1,0],["e",1,.5],
                   ["se",1,1],["s",.5,1],["sw",0,1],["w",0,.5]];
  const MIN = 0.01;               // 이보다 작은 상자는 손이 떨린 것으로 본다
  let L = null;                   // {sources, frames, vocabulary, submitted, ...}
  let picked = null;              // 고른 출처. 탭을 다시 열어도 유지된다
  let task = null;                // 지금 열린 프레임의 작업
  let boxes = [];                 // 편집 중인 상자들
  let sel = null;                 // 고른 상자의 box_id
  let drag = null;                // 지금 끌고 있는 것
  let seq = 0;                    // 사람이 그린 상자의 이름을 만든다
  /* 이미 상자가 있는 자리 안에 새 상자를 그려야 할 때가 있다(가려진 객체). 상자
     안쪽이 잡히므로 그때는 끌기가 "옮기기" 로 해석된다. 그래서 그리기 모드를 둔다 —
     켜 두면 어디를 끌어도 새 상자가 된다. */
  let drawMode = false;

  const clamp01 = (v) => Math.min(1, Math.max(0, v));
  const norm = (b) => [Math.min(b[0], b[2]), Math.min(b[1], b[3]),
                       Math.max(b[0], b[2]), Math.max(b[1], b[3])].map(clamp01);

  /* 이 상자를 지금 서버가 어떻게 판정할지. 화면에만 쓰는 **예고**이고 제출에는
     싣지 않는다 — 판정의 정본은 서버다. */
  function previewVerdict(b){
    if (b.rejected) return "rejected";
    if (!b.predicted) return "added";
    const p = b.predicted;
    if (b.cls !== null && b.cls !== p.semantic_class) return "relabeled";
    const moved = b.box.some((v, i) => Math.abs(v - p.box[i]) > 1e-9);
    const reranged = b.range !== null &&
      (p.range_m === null || p.range_m === undefined || Math.abs(b.range - p.range_m) > 0.01);
    return (moved || reranged) ? "adjusted" : "confirmed";
  }
  const VERDICT_GRADE = {confirmed:"good", adjusted:"warn", relabeled:"warn",
                         rejected:"critical", added:"serious", unreviewed:""};

  async function open(){
    const host = el("sec-label");
    if (!may("may_label_ground_truth")){
      host.innerHTML = `<div class="empty">${esc(T("auth.needRole"))}</div>`;
      return;
    }
    L = await api("/api/label/tasks", picked ? {source: picked} : {});
    picked = L.selected;
    if (!L.sources.length){
      host.innerHTML = `<div class="empty">${esc(T("lab.noSources"))}</div>`;
      return;
    }
    host.innerHTML = `<div class="cols label">
      <div class="card">
        <h3 style="margin:0 0 8px;font-size:15px">${esc(T("lab.source"))}</h3>
        <select id="labSource" style="width:100%">${L.sources.map(s =>
          `<option value="${esc(s.source_id)}" ${s.source_id === picked ? "selected" : ""}
            ${s.present ? "" : "disabled"}>${esc(label(s.label) || s.source_id)}
            · ${s.frame_count}</option>`).join("")}</select>
        <div class="note" id="labProvenance" style="margin-top:8px"></div>
        <h3 style="margin:14px 0 8px;font-size:15px">${esc(T("lab.frames"))}
          <span class="note" id="labFrameCount"></span></h3>
        <ul class="framelist" id="labFrames"></ul></div>
      <div><div id="labCanvas"></div>
        <div class="head" style="display:flex;gap:10px;align-items:center;margin-top:8px">
          <button class="ghost" id="labDraw" aria-pressed="false">${esc(T("lab.drawMode"))}</button>
          <span class="note" id="labMeta"></span></div>
        <p class="note" style="margin:2px 0 0">${esc(T("lab.keysHint"))}</p></div>
      <div class="card" id="labSide"></div></div>`;
    el("labDraw").addEventListener("click", () => {
      drawMode = !drawMode;
      el("labDraw").setAttribute("aria-pressed", String(drawMode));
      el("labDraw").style.borderColor = drawMode ? "var(--accent)" : "";
      if (el("labSvg")) el("labSvg").style.cursor = drawMode ? "crosshair" : "default";
    });
    el("labSource").addEventListener("change", async (event) => {
      picked = event.target.value;
      await open().catch(reportBoot);
    });
    paintProvenance();
    if (!L.frames.length){
      el("labFrames").innerHTML =
        `<li class="note">${esc(T("lab.noFrames"))}</li>`;
      el("labCanvas").innerHTML = `<div class="empty">${esc(T("lab.noFrames"))}</div>`;
      el("labSide").innerHTML = "";
      return;
    }
    paintFrames();
    await load(L.frames[0]);
  }

  /* 출처를 고른 사람이 **무엇을 라벨하는지** 알아야 한다. 공개 데이터셋 사진은
     우리 기기가 본 것이 아니므로 그 정답이 기기 후보로 가지 않는다는 사실까지
     여기서 말한다. */
  function paintProvenance(){
    const s = L.sources.find(x => x.source_id === picked);
    if (!s){ el("labProvenance").textContent = ""; return; }
    const rows = [];
    rows.push(`<div>${chip(s.device_id ? "good" : "",
      T("lab.kind." + s.kind))} <code>${esc(s.subject_id)}</code></div>`);
    if (!s.device_id)
      rows.push(`<div>${esc(T("lab.notOurDevice"))}</div>`);
    if (s.captured_at) rows.push(`<div>${esc(T("lab.capturedAt"))}: ${esc(s.captured_at)}</div>`);
    if (s.origin) rows.push(`<div>${esc(T("lab.origin"))}: ${esc(s.origin)}</div>`);
    if (s.license) rows.push(`<div>${esc(T("lab.license"))}: ${esc(s.license)}</div>`);
    if (s.redistributable === false)
      rows.push(`<div>${chip("warn", T("lab.notRedistributable"))}</div>`);
    if (s.redistributable === null || s.redistributable === undefined)
      rows.push(`<div>${chip("warn", T("lab.licenseUnknown"))}</div>`);
    if (s.note) rows.push(`<div>${esc(s.note)}</div>`);
    el("labProvenance").innerHTML = rows.join("");
    el("labFrameCount").textContent = L.frames.length < L.frame_count
      ? ` ${L.frames.length} / ${L.frame_count}` : ` ${L.frame_count}`;
  }

  function paintFrames(){
    const host = el("labFrames");
    host.textContent = "";
    for (const name of L.frames){
      const li = document.createElement("li");
      const b = document.createElement("button");
      const done = L.submitted.includes(`${picked}:${name}`);
      b.innerHTML = `${esc(name)}${done ? ` <span class="done">&#10003;</span>` : ""}`;
      b.setAttribute("aria-current",
        String(!!task && task.frame_ref === `${picked}/${name}`));
      b.addEventListener("click", () => load(name).catch(reportBoot));
      li.appendChild(b); host.appendChild(li);
    }
  }

  async function load(name){
    task = await api("/api/label/task", {frame: name, source: picked});
    sel = null; seq = 0;
    /* 모델이 낸 상자를 편집 상태로 복사한다. 원본(`predicted`)은 그대로 들고
       있는다 — 지우면 모델이 무엇을 틀렸는지가 사라지고, 그 차이가 바로 학습
       가치다. */
    boxes = task.predicted.map((p) => ({
      box_id: p.box_id, predicted: p, box: p.box.slice(),
      cls: null, range: null, rejected: false, note: "",
    }));
    const gt = task.ground_truth;
    if (gt){
      // 다시 열었을 때 처음부터 하게 하면 라벨 작업이 두 배가 된다.
      for (const row of gt.boxes){
        const mine = boxes.find((b) => b.box_id === row.box_id);
        const target = mine || {box_id: row.box_id, predicted: null, box: [0,0,.1,.1],
                                cls: null, range: null, rejected: false, note: ""};
        if (!mine) boxes.push(target);
        target.rejected = row.verdict === "rejected";
        if (row.final_box) target.box = row.final_box.slice();
        if (row.final_class !== undefined && row.final_class !== null) target.cls = row.final_class;
        if (row.corrected_range_m !== undefined) target.range = row.corrected_range_m;
      }
    }
    paintFrames(); paintCanvas(); paintSide();
    el("labMeta").textContent =
      `${T("lab.model")}: ${task.model_version || T("app.none")} · ${task.frame_ref}` +
      (L.detector_available ? "" : " · " + T("lab.noDetector"));
  }

  /* -- 그리기 ------------------------------------------------------------ */

  function paintCanvas(){
    const host = el("labCanvas");
    const media = task.media || {};
    const src = `${media.path || "/api/media"}?kind=${encodeURIComponent(media.kind || "frame")}` +
                `&source=${encodeURIComponent(media.source || "")}` +
                `&file=${encodeURIComponent(media.file || "")}`;
    host.innerHTML = `<img alt="${esc(task.frame_ref)}" src="${esc(src)}">
      <svg viewBox="0 0 1000 1000" preserveAspectRatio="none" id="labSvg"></svg>`;
    drawBoxes();
    const svg = el("labSvg");
    svg.addEventListener("pointerdown", onDown);
    svg.addEventListener("pointermove", onMove);
    svg.addEventListener("pointerup", onUp);
    svg.addEventListener("pointercancel", onUp);
  }

  function drawBoxes(){
    const svg = el("labSvg");
    if (!svg) return;
    const NS = "http://www.w3.org/2000/svg";
    svg.textContent = "";
    // 큰 것부터 그린다. SVG 는 나중에 그린 것이 위에 오므로, 이렇게 두면 겹친
    // 상자 중 **작은 쪽**이 위에 와서 집을 수 있다.
    const area = (b) => (b.box[2] - b.box[0]) * (b.box[3] - b.box[1]);
    const order = boxes.slice().sort((a, b) => area(b) - area(a));
    const add = (tag, attrs, cls) => {
      const n = document.createElementNS(NS, tag);
      for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
      if (cls) n.setAttribute("class", cls);
      svg.appendChild(n);
      return n;
    };
    for (const b of order){
      const [x1, y1, x2, y2] = b.box;
      const kind = b.rejected ? "gone" : (b.predicted ? "model" : "mine");
      const selected = b.box_id === sel;
      const rect = add("rect", {x: x1*1000, y: y1*1000,
                                width: (x2-x1)*1000, height: (y2-y1)*1000},
                       `bx ${kind}${selected ? " sel" : ""}`);
      rect.dataset.box = b.box_id;
      const name = (b.cls !== null ? b.cls
                  : b.predicted ? b.predicted.semantic_class : "?");
      add("text", {x: x1*1000 + 6, y: y1*1000 - 6}, "cap").textContent =
        `${name}${b.rejected ? " ×" : ""}`;
      if (!selected || b.rejected) continue;
      for (const [id, fx, fy] of HANDLES){
        const h = add("rect", {x: (x1 + (x2-x1)*fx)*1000 - 7,
                               y: (y1 + (y2-y1)*fy)*1000 - 7,
                               width: 14, height: 14}, "hd");
        h.dataset.handle = id; h.dataset.box = b.box_id;
      }
    }
  }

  /* -- 끌기 -------------------------------------------------------------- */

  function at(event){
    const svg = el("labSvg");
    const r = svg.getBoundingClientRect();
    return [clamp01((event.clientX - r.left) / r.width),
            clamp01((event.clientY - r.top) / r.height)];
  }

  function onDown(event){
    const [x, y] = at(event);
    const t = event.target;
    el("labSvg").setPointerCapture(event.pointerId);
    if (!drawMode && t.dataset && t.dataset.handle){
      sel = t.dataset.box;
      drag = {kind: "resize", handle: t.dataset.handle, id: sel};
    } else if (!drawMode && t.dataset && t.dataset.box){
      sel = t.dataset.box;
      const b = find(sel);
      drag = {kind: "move", id: sel, from: [x, y], start: b.box.slice()};
    } else {
      /* 빈 곳을 끌면 모델이 놓친 것을 사람이 그린다. 바로 상자를 만들어 두고
         끌리는 동안 키운다 — 끝낸 뒤 만들면 그리는 동안 아무것도 안 보인다. */
      seq += 1;
      const id = `hand-${seq}`;
      boxes.push({box_id: id, predicted: null, box: [x, y, x + MIN, y + MIN],
                  cls: L.vocabulary[0] || null, range: null, rejected: false, note: ""});
      sel = id;
      drag = {kind: "draw", id, anchor: [x, y]};
    }
    drawBoxes(); paintSide();
  }

  function onMove(event){
    if (!drag) return;
    const [x, y] = at(event);
    const b = find(drag.id);
    if (!b) return;
    if (drag.kind === "draw"){
      b.box = norm([drag.anchor[0], drag.anchor[1], x, y]);
    } else if (drag.kind === "move"){
      const dx = x - drag.from[0], dy = y - drag.from[1];
      const w = drag.start[2] - drag.start[0], h = drag.start[3] - drag.start[1];
      // 끌어 옮길 때 크기는 유지한다 — 경계에서 찌그러지면 다시 그려야 한다.
      const nx = Math.min(1 - w, Math.max(0, drag.start[0] + dx));
      const ny = Math.min(1 - h, Math.max(0, drag.start[1] + dy));
      b.box = [nx, ny, nx + w, ny + h];
    } else {
      const v = b.box.slice();
      const H = drag.handle;
      if (H.includes("n")) v[1] = y;
      if (H.includes("s")) v[3] = y;
      if (H.includes("w")) v[0] = x;
      if (H.includes("e")) v[2] = x;
      b.box = norm(v);
    }
    drawBoxes();
  }

  function onUp(event){
    if (!drag) return;
    const b = find(drag.id);
    // 손이 떨려 생긴 점만 한 상자는 버린다. 남겨 두면 제출에서 거절된다.
    if (b && (b.box[2] - b.box[0] < MIN || b.box[3] - b.box[1] < MIN)){
      if (!b.predicted) boxes = boxes.filter((x) => x !== b);
      else b.box = b.predicted.box.slice();
    }
    drag = null;
    drawBoxes(); paintSide();
  }

  const find = (id) => boxes.find((b) => b.box_id === id);

  /* -- 오른쪽: 상자별 값과 제출 ------------------------------------------ */

  function paintSide(){
    const host = el("labSide");
    const gt = task.ground_truth;
    const rows = boxes.map((b) => {
      const v = previewVerdict(b);
      const p = b.predicted;
      const name = b.cls !== null ? b.cls : (p ? p.semantic_class : "");
      const range = b.range !== null ? b.range
                  : (p && p.range_m !== null && p.range_m !== undefined ? p.range_m : "");
      return `<div class="boxrow" data-sel="${b.box_id === sel ? 1 : 0}" data-row="${esc(b.box_id)}">
        <div class="head"><span class="id">${esc(b.box_id)}</span>
          ${chip(VERDICT_GRADE[v], T("lab.verdict." + v))}</div>
        ${p ? `<div class="note">${esc(T("lab.predicted"))}: ${esc(p.semantic_class)}
               · ${esc(T("lab.confidence"))} ${p.confidence.toFixed(2)}</div>`
            : `<div class="note">${esc(T("lab.newBox"))}</div>`}
        <label>${esc(T("lab.class"))}
          <input list="labVocab" data-cls="${esc(b.box_id)}" value="${esc(name)}"></label>
        <label>${esc(T("lab.range"))}
          <input type="number" step="0.1" min="0" data-range="${esc(b.box_id)}"
                 value="${range === "" ? "" : esc(String(range))}"></label>
        <div class="head" style="margin-top:7px">
          ${p ? `<button class="link" data-toggle="${esc(b.box_id)}">${
                   esc(b.rejected ? T("lab.undoReject") : T("lab.reject"))}</button>`
              : `<button class="link" data-drop="${esc(b.box_id)}">${esc(T("lab.remove"))}</button>`}
        </div></div>`;
    }).join("");
    host.innerHTML = `<h3 style="margin:0 0 8px;font-size:15px">${esc(T("lab.boxes"))}
        <span class="note">(${boxes.length})</span></h3>
      <datalist id="labVocab">${(L.vocabulary || []).map(
        (v) => `<option value="${esc(v)}">`).join("")}</datalist>
      ${rows || `<div class="empty">${esc(T("lab.noWork"))}</div>`}
      <label style="display:block;margin-top:14px;font-size:14px;color:var(--ink-3)">
        ${esc(T("lab.reason"))}
        <input id="labReason" placeholder="${esc(T("lab.reasonPlaceholder"))}"
               value="${esc(gt && gt.reason ? gt.reason : "")}"></label>
      <button class="primary" id="labSubmit" style="margin-top:12px">${
        esc(gt ? T("lab.resubmit") : T("lab.submit"))}</button>
      <div id="labOut" class="note" style="margin-top:10px"></div>`;
    wireSide();
  }

  function wireSide(){
    const host = el("labSide");
    host.querySelectorAll("[data-row]").forEach((row) => {
      row.addEventListener("pointerdown", (e) => {
        if (e.target.closest("input,button")) return;
        sel = row.dataset.row; drawBoxes(); paintSide();
      });
    });
    host.querySelectorAll("[data-cls]").forEach((input) => {
      input.addEventListener("change", () => {
        const b = find(input.dataset.cls);
        b.cls = input.value.trim() || null;
        drawBoxes(); paintSide();
      });
    });
    host.querySelectorAll("[data-range]").forEach((input) => {
      input.addEventListener("change", () => {
        const b = find(input.dataset.range);
        b.range = input.value === "" ? null : Number(input.value);
        paintSide();
      });
    });
    host.querySelectorAll("[data-toggle]").forEach((button) => {
      button.addEventListener("click", () => {
        const b = find(button.dataset.toggle);
        b.rejected = !b.rejected;
        drawBoxes(); paintSide();
      });
    });
    host.querySelectorAll("[data-drop]").forEach((button) => {
      button.addEventListener("click", () => {
        boxes = boxes.filter((b) => b.box_id !== button.dataset.drop);
        if (sel === button.dataset.drop) sel = null;
        drawBoxes(); paintSide();
      });
    });
    el("labSubmit").addEventListener("click", () => submit().catch((err) => {
      el("labOut").innerHTML = `<span style="color:var(--critical)">${esc(err.message)}</span>`;
    }));
  }

  /* -- 제출 --------------------------------------------------------------- */

  async function submit(){
    const reason = el("labReason").value.trim();
    if (!reason){ el("labOut").textContent = T("lab.needReason"); return; }
    const rows = boxes.map((b) => {
      if (b.rejected) return {box_id: b.box_id, rejected: true, note: b.note};
      const row = {box_id: b.box_id, box: b.box};
      if (b.cls !== null) row.semantic_class = b.cls;
      if (b.range !== null) row.range_m = b.range;
      return row;
    });
    const out = await post("/api/label",
      {frame: fileOf(task), source: picked, reason, boxes: rows});
    const filed = out.learning_candidates || [];
    const report = `${esc(T("lab.submitted"))} ·
      ${Object.entries(out.by_verdict || {}).map(
        ([v, n]) => chip(VERDICT_GRADE[v], `${T("lab.verdict." + v)} ${n}`)).join(" ")}
      ${filed.length ? `<div style="margin-top:8px">${esc(T("lab.filed"))}:
        ${filed.map((c) => `<code>${esc(c.learning_candidate_id)}</code>`).join(" ")}
        · ${esc(T("lab.lineage"))} ${filed.map(
          (c) => `<code>${esc(c.learning_lineage_id)}</code>`).join(" ")}</div>` : ""}`;
    if (!L.submitted.includes(out.task_id)) L.submitted.push(out.task_id);
    /* 제출한 답을 서버에서 다시 읽어 화면을 맞춘다. 그 다음에 결과를 적는다 —
       순서를 뒤집으면 다시 읽기가 오른쪽 칸을 새로 그리면서 방금 적은 결과를
       지우고, 운영자는 제출이 되었는지 알 수 없다. */
    await load(fileOf(task));
    el("labOut").innerHTML = report;
  }

  /* 출처 뿌리 기준 상대 경로다. 마지막 조각만 쓰면 임무 폴더가 다른 같은 이름이
     한 칸으로 겹치고, 그때 열리는 것은 다른 프레임이다. */
  const fileOf = (t) => (t.media && t.media.file)
    || t.frame_ref.slice(t.frame_ref.indexOf("/") + 1);

  /* 고른 상자를 Delete 로 없는 것으로 적는다. 사람이 그린 상자는 지운다 —
     그리다 만 상자를 "모델이 없는 것을 봤다" 로 적으면 거짓 정답이 된다. */
  document.addEventListener("keydown", (event) => {
    if (active !== "label" || !sel) return;
    if (event.target.closest && event.target.closest("input,select,textarea")) return;
    /* 숫자키로 어휘를 집는다. 상자마다 입력란을 찾아 누르는 것보다 빠르고, 어휘는
       데이터이므로 키 배정도 목록 순서를 그냥 따른다. */
    const slot = Number(event.key);
    if (Number.isInteger(slot) && slot >= 1 && slot <= (L.vocabulary || []).length){
      const b = find(sel);
      if (b && !b.rejected){
        b.cls = L.vocabulary[slot - 1];
        event.preventDefault();
        drawBoxes(); paintSide();
      }
      return;
    }
    if (event.key !== "Delete" && event.key !== "Backspace") return;
    const b = find(sel);
    if (!b) return;
    if (b.predicted) b.rejected = !b.rejected;
    else { boxes = boxes.filter((x) => x !== b); sel = null; }
    event.preventDefault();
    drawBoxes(); paintSide();
  });

  return {open};
})();

async function paintAccounts(){
  const host = el("acctBody");
  if (!may("may_manage_accounts")){
    host.innerHTML = `<div class="empty">${esc(T("auth.noPermission"))}</div>`;
    return;
  }
  let data;
  try { data = await api("/api/accounts", {}); }
  catch (err){ host.innerHTML = `<div class="empty">${esc(err.message)}</div>`; return; }
  S.accountData = data;

  const roleOf = (name) => new Set(data.roles[name] || []);
  host.innerHTML = `
    ${data.persisted ? "" : `<p class="note">${esc(T("acct.notPersisted"))}</p>`}
    <table class="grid">
      <thead><tr>
        <th>${esc(T("auth.account"))}</th><th>${esc(T("acct.role"))}</th>
        <th>${esc(T("acct.permissions"))}</th><th></th>
      </tr></thead>
      <tbody>${data.accounts.map(a => {
        const fromRole = roleOf(a.role);
        const held = new Set(a.permissions);
        return `<tr>
          <td><strong>${esc(a.display_name || a.account_id)}</strong>
            <div class="note"><code>${esc(a.account_id)}</code>
              ${a.example ? " · " + esc(T("acct.example")) : ""}
              ${a.enabled ? "" : " · " + esc(T("acct.disable"))}</div></td>
          <td><select data-setrole="${esc(a.account_id)}">
            ${Object.keys(data.roles).map(r =>
              `<option value="${esc(r)}" ${r === a.role ? "selected" : ""}>${esc(r)}</option>`).join("")}
          </select></td>
          <td><div class="permgrid">${data.all_permissions.map(perm => {
            /* 세 상태를 색으로 섞지 않고 class 로 가른다 — 역할에서 온 것, 개별로
               부여한 것, 아직 없는 것. 역할에서 온 것은 누를 수 없다. */
            const kind = fromRole.has(perm) ? "role" : held.has(perm) ? "extra" : "off";
            const title = kind === "role" ? T("acct.fromRole")
                        : kind === "extra" ? T("acct.granted") : T("acct.grant");
            return `<span class="perm ${kind}" title="${esc(title)}"
              ${kind === "role" ? "" : `data-acct="${esc(a.account_id)}" data-perm="${esc(perm)}"
              data-action="${kind === "extra" ? "revoke" : "grant"}"`}
            >${esc(perm.replace(/^may_/, ""))}</span>`;
          }).join("")}</div></td>
          <td>${a.enabled
            ? `<button class="link" data-disable="${esc(a.account_id)}">${esc(T("acct.disable"))}</button>`
            : ""}</td>
        </tr>`;
      }).join("")}</tbody>
    </table>
    <div id="acctOut" class="note" style="margin-top:12px"></div>`;

  const send = async (payload) => {
    const out = el("acctOut");
    out.textContent = T("app.loading");
    try{
      const result = await post("/api/account", payload);
      out.innerHTML = `${esc(T("acct.changed"))} · <code>${esc(result.change)}</code>`;
      await paintAccounts();
    }catch(err){
      /* 서버가 돌려준 통제 어휘를 사람 말로 바꿔 보여 준다 — 사유 문장을 서버가
         정하면 그 문구를 번역할 수 없다. */
      const known = {
        "permission_comes_from_role": T("acct.refusedRolePermission"),
        "would_leave_no_account_able_to_manage_accounts": T("acct.refusedLastAdmin"),
      };
      const token = String(err.message).split(":")[0];
      out.innerHTML = `${esc(known[token] || err.message)}`;
    }
  };
  host.querySelectorAll(".perm[data-perm]").forEach(node =>
    node.addEventListener("click", () => send({
      account_id: node.dataset.acct, action: node.dataset.action,
      permission: node.dataset.perm, reason: "admin screen",
    })));
  host.querySelectorAll("select[data-setrole]").forEach(node =>
    node.addEventListener("change", () => send({
      account_id: node.dataset.setrole, action: "set_role", role: node.value,
      reason: "admin screen",
    })));
  host.querySelectorAll("button[data-disable]").forEach(node =>
    node.addEventListener("click", () => send({
      account_id: node.dataset.disable, action: "disable", reason: "admin screen",
    })));
}

/* ===========================================================================
   배포 탭 — 들이기 · 보정 · 학습 · 모델 교체

   네 가지가 한 탭인 이유는 그것이 실제 순서이기 때문이다. 장치를 들이면 보정이
   할 일로 남고, 보정과 검수가 쌓이면 학습 후보가 되고, 학습 결과는 검증·승인을
   지나야 기기에 올라간다. 화면이 그 순서를 끊으면 사용자는 다음에 무엇을 해야
   하는지 알 수 없다.

   이 모듈은 **판정하지 않는다.** 무엇이 적격이고 무엇이 막혔는지는 서버가 사유
   토큰으로 말하고, 여기서는 그 토큰을 사람 말로 바꿔 보여 줄 뿐이다. 화면이
   자기 규칙을 따로 들면 "쓸 수 있다고 보여 놓고 거절되는" 순간이 생긴다.
   =========================================================================== */
const Deploy = (() => {
  let snap = null;        /* 마지막 스냅샷 */
  let cam = null;         /* 지금 고른 카메라 */
  /* 고른 것을 기억한다. 제출 뒤 화면을 다시 그리면서 선택이 첫 항목으로 돌아가면,
     이어서 하는 일(검증 → 승인 → 적용)마다 사용자가 같은 선택을 다시 해야 한다. */
  const sel = {};
  const keep = (id, key) => {
    const node = el(id);
    if (!node || !node.options) return;      /* select 만 */
    node.addEventListener("change", () => { sel[key] = node.value; });
    /* 고를 수 없게 된 항목은 되살리지 않는다 — 되살리면 누를 수 없는 것이 골라진
       채로 보이고, 다음 제출이 그 이유를 모른 채 거절된다. */
    if (sel[key] !== undefined
        && Array.prototype.some.call(node.options,
                                     o => o.value === sel[key] && !o.disabled))
      node.value = sel[key];
  };

  const num = (v) => (v === null || v === undefined || v === "" ? T("app.unmeasured")
                      : String(v));
  const pick = (table, key, fallback) => {
    /* 사유 토큰은 `이름:상세` 로 올 수 있다. 앞부분으로 찾고, 상세는 뒤에 붙인다. */
    const [head, ...rest] = String(key).split(":");
    const text = T(table + head);
    const body = text === table + head ? (fallback || head) : text;
    return rest.length ? `${body} (${rest.join(":")})` : body;
  };
  const codes = (list) => (list || []).map(v => `<code>${esc(v)}</code>`).join(" ");

  /* 사유를 적지 않으면 아무 버튼도 누를 수 없다 — 서버가 400 으로 거절하므로
     여기서 미리 막아 같은 말을 두 번 하게 하지 않는다. */
  function reasonOf(id, outId){
    const value = (el(id).value || "").trim();
    if (!value){ el(outId).innerHTML = `<div class="note">${esc(T("dep.needReason"))}</div>`; }
    return value;
  }
  const fail = (outId, err) => {
    el(outId).innerHTML = `<div class="note">${esc(err.message)}</div>`;
  };
  const field = (key, id, attrs) =>
    `<label><span>${esc(T(key))}</span><input id="${id}" ${attrs || ""}></label>`;

  /* 네 책상은 **차례**다 — 들이고, 보정하고, 학습하고, 모델을 바꾼다. 넷을 한
     번에 펼쳐 두면 3000px 짜리 화면이 되고, 지금 할 일 하나가 그 안에 묻힌다.
     그래서 한 번에 하나만 보이고 나머지는 `hidden` 으로 **남아 있는다** —
     지우지 않는 이유는 적어 넣던 글이 칸을 옮겼다 돌아오면 사라지기 때문이다.

     걸음마다 지금 상태를 한 값으로 적는다. 어느 걸음이 남았는지를 알려면
     들어가 보아야 하는 화면은, 네 번 들어가 보게 한다. */
  let step = "join";
  const STEPS = [
    {id: "join",  key: "dep.join.heading",  needs: "join"},
    {id: "cal",   key: "dep.cal.heading",   needs: "calibration"},
    {id: "train", key: "dep.train.heading", needs: "training"},
    {id: "model", key: "dep.model.heading", needs: "model"},
  ];
  function stepState(id){
    if (id === "join"){
      const pending = Object.values(snap.join.pending || {})
        .reduce((n, ids) => n + ids.length, 0);
      return pending ? chip("warn", `${T("dep.step.pending")} ${pending}`)
                     : chip("", `${snap.join.joined.length}`);
    }
    if (id === "cal"){
      const cams = snap.calibration.cameras || [];
      const active = cams.filter(c => c.active).length;
      return chip(active ? "good" : "", `${active} / ${cams.length}`);
    }
    if (id === "train"){
      const n = (snap.training.candidates || []).length;
      return chip(n ? "good" : "", `${n}`);
    }
    const n = (snap.model.deployments || []).length;
    return chip(n ? "good" : "", `${n}`);
  }
  function stepRail(){
    return `<nav class="steprail">${STEPS.map((st, i) =>
      `<button data-step="${esc(st.id)}" class="${st.id === step ? "on" : ""}"
        ><b>${i + 1}</b><span>${esc(T(st.key))}</span>${stepState(st.id)}</button>`
      ).join("")}</nav>`;
  }
  function showStep(){
    for (const st of STEPS){
      const node = el("dstep-" + st.id);
      if (node) node.hidden = st.id !== step;
    }
    el("sec-deploy").querySelectorAll("nav.steprail button").forEach(node =>
      node.classList.toggle("on", node.dataset.step === step));
  }

  async function open(){
    const host = el("sec-deploy");
    host.innerHTML = `<div class="empty">${esc(T("app.loading"))}</div>`;
    try { snap = await api("/api/deployment", {}); }
    catch (err){ host.innerHTML = `<div class="empty">${esc(err.message)}</div>`; return; }
    host.innerHTML = stepRail()
      + joinSection() + calSection() + trainSection() + modelSection();
    bindJoin(); bindCal(); bindTrain(); bindModel();
    host.querySelectorAll("nav.steprail button").forEach(node =>
      node.addEventListener("click", () => { step = node.dataset.step; showStep(); }));
    showStep();
  }
  /* ＋ 가 특정 걸음으로 데려다 줄 수 있게 연다. */
  function goStep(id){ step = id; showStep(); }

  /* -- 권한 없는 구역은 비는 대신 **무슨 능력이 필요한지** 적는다 ------------ */
  function locked(permission){
    return `<div class="empty">${esc(T("auth.noPermission"))}
      <div class="note">${esc(T("dep.needs"))} <code>${esc(permission)}</code></div></div>`;
  }

  /* =========================================================================
     1. 들이기
     ========================================================================= */
  function joinSection(){
    const j = snap.join;
    const pendingRows = Object.entries(j.pending)
      .filter(([, ids]) => ids.length)
      .map(([step, ids]) => `<div>${chip("warn", T("dep.step." + step))}
        ${ids.map(id => `<code>${esc(id)}</code>`).join(" ")}</div>`).join("");
    const joined = j.joined.length ? `<table class="grid"><thead><tr>
        <th>${esc(T("dep.join.deviceId"))}</th><th>${esc(T("dep.join.role"))}</th>
        <th>${esc(T("dep.join.nextSteps"))}</th><th></th></tr></thead><tbody>
      ${j.joined.map(row => {
        const m = row.manifest, o = row.outcome || {};
        const steps = (o.next_steps || []);
        return `<tr>
          <td><code>${esc(m.device_id)}</code>
            ${o.accepted ? chip("good", T("dep.join.accepted")) : ""}
            ${(o.unannounced_declarations || []).length
              ? `<div class="note">${esc(T("dep.join.adapterGap"))}:
                 ${codes(o.unannounced_declarations)}</div>` : ""}
            ${(o.undeclared_announcements || []).length
              ? `<div class="note">${esc(T("dep.join.announcedOnly"))}:
                 ${codes(o.undeclared_announcements)}</div>` : ""}</td>
          <td>${esc(m.role)}<div class="note">${codes(m.node_tags)}</div></td>
          <td>${steps.length
            ? `<ul class="steps">${steps.map(s =>
                `<li>${chip("warn", T("dep.step." + s))}</li>`).join("")}</ul>`
            : `<span class="note">${esc(T("dep.join.noSteps"))}</span>`}</td>
          <td>${steps.length && j.may_submit ? steps.map(s =>
            `<button class="link" data-resolve="${esc(m.device_id)}"
              data-step="${esc(s)}">${esc(T("dep.join.resolve"))}</button>`).join("<br>") : ""}
          </td></tr>
        <tr><td colspan="4"><div class="note">${esc(T("dep.join.configEntry"))}</div>
          <pre>${esc(JSON.stringify(row.config_entry))}</pre></td></tr>`;
      }).join("")}</tbody></table>`
      : `<div class="empty">${esc(T("dep.join.none"))}</div>`;

    const refused = (j.refused || []).length ? `
      <div class="note">${esc(T("dep.join.refusedList"))}</div>
      <ul class="steps">${j.refused.map(o => `<li>${chip("critical",
        o.device_id + " · " + (o.rejections || []).map(r =>
          pick("dep.reject.", r.code)).join(", "))}</li>`).join("")}</ul>` : "";

    return `<section id="dstep-join">
      <h3>${esc(T("dep.join.heading"))}</h3>
      <div class="body">
        <div class="form" id="joinForm">
          ${j.may_submit ? `
            ${field("dep.join.deviceId", "jDev", 'placeholder="go2-01"')}
            <div class="note">${esc(T("dep.join.deviceIdHint"))}</div>
            ${field("dep.join.role", "jRole", 'placeholder="ugv"')}
            ${field("dep.join.tags", "jTags", 'placeholder="compute.cpu, tier.ugv"')}
            ${field("dep.join.actions", "jActions", 'placeholder="move_to, stop"')}
            ${field("dep.join.announced", "jAnnounced")}
            <div class="row">
              ${field("dep.join.compute", "jCompute", 'type="number" step="0.1"')}
              ${field("dep.join.memory", "jMemory", 'type="number" step="1"')}
            </div>
            <div class="row">
              ${field("dep.join.peer", "jPeer")}
              ${field("dep.join.appearanceClass", "jClass")}
            </div>
            <label class="check"><input type="checkbox" id="jCamera">
              <span>${esc(T("dep.join.hasCamera"))}</span></label>
            <label><span>${esc(T("lab.reason"))}</span>
              <textarea id="jReason"
                placeholder="${esc(T("dep.reasonPlaceholder"))}"></textarea></label>
            <div class="acts">
              <button class="primary" id="jSubmit">${esc(T("dep.join.submit"))}</button>
            </div>` : locked(snap.permissions.join)}
        </div>
        <div class="out" id="jOut"><div id="jResult"></div>
          ${pendingRows ? `<div><div class="note">${esc(T("dep.join.pending"))}</div>
            ${pendingRows}</div>` : ""}
          ${refused}
          <div><div class="note">${esc(T("dep.join.joined"))}</div>${joined}</div>
        </div>
      </div></section>`;
  }

  function bindJoin(){
    const list = (id) => (el(id).value || "").split(",").map(s => s.trim()).filter(Boolean);
    const button = el("jSubmit");
    if (button) button.addEventListener("click", async () => {
      const reason = reasonOf("jReason", "jResult");
      if (!reason) return;
      const body = {
        device_id: (el("jDev").value || "").trim(),
        role: (el("jRole").value || "").trim(),
        node_tags: list("jTags"),
        declared_actions: list("jActions"),
        has_camera: el("jCamera").checked,
        reason,
      };
      const announced = list("jAnnounced");
      if (announced.length) body.announced_actions = announced;
      const peer = (el("jPeer").value || "").trim();
      if (peer) body.overlay_peer = peer;
      const klass = (el("jClass").value || "").trim();
      if (klass) body.appearance_class = klass;
      /* 예산은 **둘 다** 있을 때만 보낸다. 반쪽 예산을 0 으로 메우지 않는다. */
      const compute = el("jCompute").value, memory = el("jMemory").value;
      if (compute !== "" && memory !== "")
        body.budget = {compute_units: Number(compute), memory_mb: Number(memory)};
      try {
        const out = await post("/api/join", body);
        const o = out.outcome;
        el("jResult").innerHTML = `
          <div>${o.accepted ? chip("good", T("dep.join.accepted"))
                            : chip("critical", T("dep.join.refusedChip"))}</div>
          ${(o.rejections || []).length ? `<ul class="steps">${o.rejections.map(r =>
            `<li>${chip("critical", pick("dep.reject.", r.code)
              + " · " + r.detail)}</li>`).join("")}</ul>` : ""}
          ${o.accepted ? `<div><div class="note">${esc(T("dep.join.nextSteps"))}</div>
            <ul class="steps">${(o.next_steps || []).map(s =>
              `<li>${chip("warn", T("dep.step." + s))}</li>`).join("")}</ul></div>
            <div><div class="note">${esc(T("dep.join.configEntry"))}</div>
              <pre>${esc(JSON.stringify(out.config_entry, null, 1))}</pre></div>` : ""}`;
        if (o.accepted) await open();
      } catch (err){ fail("jResult", err); }
    });
    el("sec-deploy").querySelectorAll("button[data-resolve]").forEach(node =>
      node.addEventListener("click", async () => {
        try {
          await post("/api/join-step", {device_id: node.dataset.resolve,
            step: node.dataset.step, reason: T("dep.join.resolve")});
          await open();
        } catch (err){ fail("jResult", err); }
      }));
  }

  /* =========================================================================
     2. 카메라 정보 → 보정
     ========================================================================= */
  function calSection(){
    const c = snap.calibration;
    const cameras = c.cameras;
    if (!cam || !cameras.some(x => x.device_id === cam))
      cam = cameras.length ? cameras[0].device_id : null;
    const current = cameras.find(x => x.device_id === cam) || null;
    return `<section id="dstep-cal">
      <h3>${esc(T("dep.cal.heading"))}</h3>
      ${c.frames_root_present ? ""
        : `<p class="note">${esc(T("dep.cal.framesRootMissing"))}</p>`}
      <div class="body">
        <div class="form" id="calForm">
          <label><span>${esc(T("dep.cal.camera"))}</span>
            <select id="cDev">${cameras.map(x =>
              `<option value="${esc(x.device_id)}" ${x.device_id === cam ? "selected" : ""}
                >${esc(x.device_id)}${x.zone_id ? " · " + esc(x.zone_id) : ""}</option>`
              ).join("")}</select></label>
          ${c.may_submit ? `
            <div class="row">
              ${field("dep.cal.width", "cW", 'type="number" step="1"')}
              ${field("dep.cal.height", "cH", 'type="number" step="1"')}
            </div>
            <div class="row3">
              ${field("dep.cal.focal", "cFocal", 'type="number" step="0.01"')}
              ${field("dep.cal.sensorWidth", "cSensor", 'type="number" step="0.01"')}
              ${field("dep.cal.hfov", "cHfov", 'type="number" step="0.1"')}
            </div>
            <div class="row">
              ${field("dep.cal.zoom", "cZoom", 'placeholder="full"')}
              ${field("dep.cal.mount", "cMount", 'placeholder="bracket-a"')}
            </div>
            <div class="row3">
              ${field("dep.cal.boardCols", "cCols", 'type="number" step="1"')}
              ${field("dep.cal.boardRows", "cRows", 'type="number" step="1"')}
              ${field("dep.cal.square", "cSquare", 'type="number" step="0.1"')}
            </div>
            <label><span>${esc(T("lab.reason"))}</span><textarea id="cReason"
              placeholder="${esc(T("dep.reasonPlaceholder"))}"></textarea></label>
            <div class="acts">
              <button class="primary" id="cRun">${esc(T("dep.cal.run"))}</button>
            </div>` : locked(snap.permissions.calibration)}
        </div>
        <div class="out" id="cOut"><div id="cResult"></div>
          <div id="cStanding">${cameraView(current, c)}</div></div>
      </div></section>`;
  }

  function cameraView(view, section){
    if (!view) return `<div class="empty">${esc(T("app.none"))}</div>`;
    const a = view.active;
    return `
      <div>${chip("", `${T("dep.cal.framesOffered")} ${view.frames_offered}`)}
        ${view.declared_profile ? chip("", `${T("dep.cal.declaredProfile")} `
          + (view.declared_profile.profile_version || "")) : ""}</div>
      ${a ? `<div>
          <div>${chip("good", `${T("dep.cal.active")} v${a.version}`)}
            ${chip("", `${T("dep.cal.rms")} ${a.reprojection_error_rms.toFixed(4)}`)}</div>
          <dl class="kv">
            <dt>${esc(T("dep.cal.scope"))}</dt>
            <dd><code>${esc(JSON.stringify(a.applicability))}</code></dd>
            <dt>${esc(T("dep.cal.validatedBy"))}</dt><dd>${codes(a.validated_by)}</dd>
            <dt>${esc(T("dep.cal.framesUsed"))}</dt>
            <dd>${num(a.quality.frames_used)} / ${num(a.quality.frames_offered)}</dd>
            <dt>${esc(T("dep.cal.measuredFx"))}</dt>
            <dd>${a.quality.measured_fx_px ? a.quality.measured_fx_px.toFixed(1) : num(null)} px</dd>
            <dt>${esc(T("dep.cal.declaredFx"))}</dt>
            <dd>${a.quality.declared_fx_px ? a.quality.declared_fx_px.toFixed(1) : num(null)} px</dd>
          </dl>
          <div class="why">${esc(T("dep.cal.noExtrinsic"))}</div>
        </div>`
        : `<div class="note">${esc(T("dep.cal.noActive"))}</div>`}
      ${(view.rejections || []).length ? `<div>
        <div class="note">${esc(T("dep.cal.rejections"))}</div>
        <ul class="steps">${view.rejections.map(r => `<li>${chip("critical",
          `v${r.version} · ` + r.reasons.map(x => pick("dep.cal.reason.", x)).join(", ")
          + ` · ${T("dep.cal.kept")} ${r.kept_version === null ? T("app.none") : "v" + r.kept_version}`
        )}</li>`).join("")}</ul></div>` : ""}
      ${(view.runs || []).length ? `<div>
        <div class="note">${esc(T("dep.cal.history"))} ${view.history.length}</div>
        <ul class="steps">${view.runs.map(r => `<li>${chip(
          r.verdict === "promoted" ? "good" : r.verdict === "rejected" ? "critical" : "warn",
          T("dep.cal.verdict." + r.verdict))}</li>`).join("")}</ul></div>` : ""}
      ${section.frames_root_present && view.frame_dir
        ? `<div class="why"><code>${esc(view.frame_dir)}</code></div>` : ""}`;
  }

  /* 폼은 **현재 선언의 뷰**다. 제출 뒤 다시 그릴 때 빈 칸으로 돌아가면 사용자가
     방금 적은 해상도·보정판을 또 적어야 하고, 한 칸만 고치려던 다음 제출이
     `image_size_required` 로 거절된다. */
  function fillCalForm(view){
    if (!el("cW")) return;
    const d = (view && view.declared) || null;
    const put = (id, value) => { el(id).value = (value === null || value === undefined)
      ? "" : String(value); };
    put("cW", d && d.image_size ? d.image_size[0] : "");
    put("cH", d && d.image_size ? d.image_size[1] : "");
    put("cFocal", d && d.focal_mm);
    put("cSensor", d && d.sensor_width_mm);
    put("cHfov", d && d.hfov_deg);
    put("cZoom", d ? d.zoom_token : "");
    put("cMount", d ? d.mount_token : "");
    put("cCols", d && d.board ? d.board[0] : "");
    put("cRows", d && d.board ? d.board[1] : "");
    put("cSquare", d && d.square_mm);
  }

  function bindCal(){
    const picker = el("cDev");
    const shown = () => snap.calibration.cameras.find(x => x.device_id === cam) || null;
    fillCalForm(shown());
    if (picker) picker.addEventListener("change", () => {
      cam = picker.value;
      el("cStanding").innerHTML = cameraView(shown(), snap.calibration);
      el("cResult").innerHTML = "";
      fillCalForm(shown());
    });
    const button = el("cRun");
    if (button) button.addEventListener("click", async () => {
      const reason = reasonOf("cReason", "cResult");
      if (!reason) return;
      const body = {device_id: el("cDev").value, reason,
                    zoom_token: (el("cZoom").value || "").trim(),
                    mount_token: (el("cMount").value || "").trim()};
      for (const [key, id] of [["width_px", "cW"], ["height_px", "cH"],
                               ["focal_mm", "cFocal"], ["sensor_width_mm", "cSensor"],
                               ["hfov_deg", "cHfov"], ["board_cols", "cCols"],
                               ["board_rows", "cRows"], ["square_mm", "cSquare"]]){
        /* 빈 칸은 보내지 않는다 — 0 으로 보내면 "쟀는데 0" 이 된다. */
        if (el(id).value !== "") body[key] = Number(el(id).value);
      }
      try {
        const out = await post("/api/camera-info", body);
        const r = out.run;
        const grade = r.verdict === "promoted" ? "good"
                    : r.verdict === "rejected" ? "critical" : "warn";
        await open();
        cam = body.device_id;
        el("cResult").innerHTML = `
          <div>${chip(grade, T("dep.cal.verdict." + r.verdict))}</div>
          ${(r.reasons || []).length ? `<ul class="steps">${r.reasons.map(x =>
            `<li>${chip(grade, pick("dep.cal.reason.", x))}</li>`).join("")}</ul>` : ""}
          <dl class="kv">
            <dt>${esc(T("dep.cal.framesUsed"))}</dt>
            <dd>${r.frames_used} / ${r.frames_offered}</dd>
            <dt>${esc(T("dep.cal.measuredFx"))}</dt>
            <dd>${r.measured_fx_px === null ? num(null) : r.measured_fx_px.toFixed(1) + " px"}</dd>
            <dt>${esc(T("dep.cal.declaredFx"))}</dt>
            <dd>${r.declared_fx_px === null ? num(null) : r.declared_fx_px.toFixed(1) + " px"}</dd>
            <dt>${esc(T("dep.cal.kept"))}</dt>
            <dd>${r.kept_version === null ? T("app.none") : "v" + r.kept_version}</dd>
          </dl>
          ${cameraView(out.camera, snap.calibration)}`;
      } catch (err){ fail("cResult", err); }
    });
  }

  /* =========================================================================
     3. 학습
     ========================================================================= */
  const LINEAGE_RAIL = ["candidate", "quarantined", "reviewed", "strategy_selected",
                        "validated", "approval_pending", "approved", "deployed"];

  function rail(state){
    const at = LINEAGE_RAIL.indexOf(state);
    return `<div class="gates">${LINEAGE_RAIL.map((s, i) =>
      `<span class="${i < at ? "done" : i === at ? "now" : ""}">${esc(s)}</span>`).join("")}</div>`;
  }

  function trainSection(){
    const t = snap.training;
    if (!t.may_submit) return `<section id="dstep-train">
      <h3>${esc(T("dep.train.heading"))}</h3>
      ${locked(snap.permissions.training)}</section>`;
    const groups = t.groups;
    return `<section id="dstep-train">
      <h3>${esc(T("dep.train.heading"))}</h3>
      <div class="body">
        <div class="form" id="trainForm">
          <label><span>${esc(T("dep.train.group"))}</span>
            <select id="tGroup">${groups.map(g =>
              `<option value="${esc(g.group_key)}" ${g.trainable ? "" : "disabled"}
                >${esc(g.device_id)} · ${g.confirmed}/${g.total} · ${esc(g.labels.join(", "))}</option>`
              ).join("")}</select></label>
          <label><span>${esc(T("lab.reason"))}</span><textarea id="tReason"
            placeholder="${esc(T("dep.reasonPlaceholder"))}"></textarea></label>
          <div class="acts">
            <button class="primary" id="tRun" ${groups.some(g => g.trainable) ? "" : "disabled"}
              >${esc(T("dep.train.run"))}</button>
          </div>
          <label><span>${esc(T("dep.train.version"))}</span>
            <select id="tVersion">${t.candidates.map(c =>
              `<option value="${esc(c.version)}">${esc(c.version)} · ${esc(c.learning_state)}</option>`
              ).join("")}</select></label>
          <div class="row">
            ${field("dep.train.minNew", "tMinNew", 'type="number" step="0.05" min="0" max="1"')}
            ${field("dep.train.maxRegression", "tMaxReg", 'type="number" step="0.01" min="0"')}
          </div>
          <div class="acts">
            <button class="ghost" id="tValidate">${esc(T("dep.train.validate"))}</button>
            <button class="ghost" id="tApproval">${esc(T("dep.train.requestApproval"))}</button>
          </div>
        </div>
        <div class="out" id="tOut"><div id="tResult"></div>
          ${groups.length ? `<table class="grid"><thead><tr>
              <th>${esc(T("dep.train.group"))}</th><th>${esc(T("dep.train.confirmed"))}</th>
              <th>${esc(T("dep.train.labels"))}</th></tr></thead><tbody>
            ${groups.map(g => `<tr>
              <td><code>${esc(g.group_key)}</code></td>
              <td>${g.confirmed} / ${g.total}
                ${g.trainable ? "" : `<div class="note">${esc(T("dep.train.notEnough"))}
                  (${esc(T("dep.train.minSamples"))} ${g.min_samples})</div>`}</td>
              <td>${codes(g.labels)}</td></tr>`).join("")}</tbody></table>`
            : `<div class="empty">${esc(T("dep.train.noGroups"))}</div>`}
          ${t.candidates.map(candidateView).join("")}
        </div>
      </div></section>`;
  }

  function candidateView(c){
    const ev = c.evaluation;
    return `<div>
      <div><code>${esc(c.version)}</code> ${chip("", c.learning_state)}</div>
      ${rail(c.learning_state)}
      <dl class="kv">
        <dt>${esc(T("dep.train.labels"))}</dt><dd>${codes(c.labels)}</dd>
        <dt>${esc(T("dep.train.used"))}</dt><dd>${c.used_sample_ids.length}</dd>
        <dt>${esc(T("dep.train.heldOut"))}</dt><dd>${c.held_out_sample_ids.length}</dd>
        ${c.unmeasured_labels.length ? `<dt>${esc(T("dep.train.unmeasuredLabels"))}</dt>
          <dd>${codes(c.unmeasured_labels)}</dd>` : ""}
        ${c.gate_used ? `<dt>${esc(T("dep.train.gateUsed"))}</dt>
          <dd><code>${esc(JSON.stringify(c.gate_used))}</code></dd>` : ""}
      </dl>
      ${ev ? `<div>${chip(ev.result === "PASS" ? "good"
                        : ev.result === "FAIL" ? "critical" : "warn",
          T("dep.train.result." + ev.result))}
        ${ev.reason ? chip("", pick("dep.train.reason.", ev.reason)) : ""}</div>
        <dl class="kv">
          <dt>${esc(T("dep.train.newAcc"))}</dt>
          <dd>${ev.new.correct} / ${ev.new.total}</dd>
          <dt>${esc(T("dep.train.retained"))}</dt>
          <dd>${ev.retained.total ? `${ev.retained.correct} / ${ev.retained.total}`
                                  : T("app.unmeasured")}</dd>
          <dt>${esc(T("dep.train.regression"))}</dt>
          <dd>${ev.regression === null ? T("app.unmeasured") : ev.regression.toFixed(3)}</dd>
          ${ev.lost_labels.length ? `<dt>${esc(T("dep.train.lostLabels"))}</dt>
            <dd>${codes(ev.lost_labels)}</dd>` : ""}
        </dl>` : ""}
      <pre>${esc(JSON.stringify(c.parameters))}</pre>
    </div>`;
  }

  function bindTrain(){
    keep("tGroup", "tGroup");
    keep("tVersion", "tVersion");
    const run = el("tRun");
    if (run) run.addEventListener("click", async () => {
      const reason = reasonOf("tReason", "tResult");
      if (!reason) return;
      try {
        const out = await post("/api/training",
          {step: "train", group_key: el("tGroup").value, reason});
        await open();
        el("tResult").innerHTML = out.produced
          ? candidateView(out.candidate)
          : `<div>${chip("critical", pick("dep.train.reason.", out.reason || ""))}</div>`;
      } catch (err){ fail("tResult", err); }
    });
    const step = async (which) => {
      const reason = reasonOf("tReason", "tResult");
      if (!reason) return;
      const body = {step: which, version: el("tVersion").value, reason};
      if (which === "validate"){
        if (el("tMinNew").value !== "") body.min_new_accuracy = Number(el("tMinNew").value);
        if (el("tMaxReg").value !== "") body.max_regression = Number(el("tMaxReg").value);
      }
      try {
        const out = await post("/api/training", body);
        await open();
        el("tResult").innerHTML = `
          <div>${out.advanced ? chip("good", T("dep.submitted"))
                              : chip("critical", pick("dep.train.reason.",
                                      out.reason || out.result || ""))}</div>
          ${out.candidate ? candidateView(out.candidate) : ""}`;
      } catch (err){ fail("tResult", err); }
    };
    if (el("tValidate")) el("tValidate").addEventListener("click", () => step("validate"));
    if (el("tApproval"))
      el("tApproval").addEventListener("click", () => step("request_approval"));
  }

  /* =========================================================================
     4. 모델 교체
     ========================================================================= */
  function modelSection(){
    const m = snap.model;
    const versions = `<table class="grid"><thead><tr>
        <th>${esc(T("dep.train.version"))}</th><th>${esc(T("dep.model.kind"))}</th>
        <th>${esc(T("dep.model.quality"))}</th><th>${esc(T("dep.model.latency"))}</th>
        <th>${esc(T("dep.model.memory"))}</th><th>${esc(T("dep.model.scopeTags"))}</th>
      </tr></thead><tbody>${m.versions.map(v => `<tr>
        <td><code>${esc(v.reference)}</code></td>
        <td><code>${esc(v.capability_kind)}</code></td>
        <td>${num(v.quality)}</td><td>${num(v.latency_ms)}</td><td>${num(v.memory_mb)}</td>
        <td>${codes(v.verified_hw_tags.concat(v.verified_input_conditions))}</td>
      </tr>`).join("")}</tbody></table>`;

    const deployments = m.deployments.length ? `<table class="grid"><thead><tr>
        <th>${esc(T("dep.model.deployments"))}</th><th>${esc(T("dep.model.phase"))}</th>
        <th>${esc(T("dep.model.scope"))}</th><th>${esc(T("dep.model.unitStatus"))}</th>
        <th></th></tr></thead><tbody>${m.deployments.map(d => `<tr>
        <td><code>${esc(d.deployment_id)}</code>
          <div class="note">${esc(d.version_reference || "")}</div></td>
        <td>${chip(d.phase === "PLACED" ? "good"
                  : d.phase === "ROLLED_BACK" ? "warn" : "critical",
            T("dep.phase." + d.phase))}</td>
        <td>${chip("", T("dep.scope." + d.scope))}
          ${d.next_scope ? `<div class="note">${esc(T("dep.model.nextScope"))}:
            ${esc(T("dep.scope." + d.next_scope))}</div>` : ""}</td>
        <td>${d.unit_status ? `<code>${esc(d.unit_status)}</code>` : T("app.unmeasured")}
          <div class="note">${esc(T("dep.model.area"))}
            <code>${esc(d.area_id || "")}</code></div></td>
        <td>${m.may_submit && d.phase === "PLACED" ? `
          <button class="link" data-widen="${esc(d.deployment_id)}"
            >${esc(T("dep.model.widen"))}</button><br>
          <button class="link" data-rollback="${esc(d.deployment_id)}"
            >${esc(T("dep.model.rollback"))}</button>` : ""}</td>
      </tr>`).join("")}</tbody></table>`
      : `<div class="empty">${esc(T("dep.model.noDeployments"))}</div>`;

    /* 걸 수 있는 것과 이미 써 버린 것을 **함께** 보여 준다. 배포된 후보를 목록에서
       지우면 적용 직후 칸이 비고, 운영자는 "왜 비었나" 를 알 수 없다 — 서버는
       그 계보를 다시 쓰지 않는다고 거절하므로 그 사실이 보여야 한다. */
    const pickable = (state) => state === "approved" || state === "validated"
                             || state === "approval_pending";
    const approved = (snap.training.candidates || [])
      .filter(c => pickable(c.learning_state) || c.learning_state === "deployed"
                || c.learning_state === "verified" || c.learning_state === "rolled_back");
    return `<section id="dstep-model">
      <h3>${esc(T("dep.model.heading"))}</h3>
      <div class="body">
        <div class="form" id="modelForm">
          ${m.may_submit ? `
            <label><span>${esc(T("dep.model.device"))}</span>
              <select id="mDev">${m.devices.map(d =>
                `<option value="${esc(d.device_id)}">${esc(d.device_id)}</option>`).join("")}
              </select></label>
            <label><span>${esc(T("dep.model.kind"))}</span>
              <select id="mKind">${m.capability_kinds.map(k =>
                `<option value="${esc(k)}">${esc(k)}</option>`).join("")}</select></label>
            <div class="row">
              ${field("dep.model.minQuality", "mQuality",
                      'type="number" step="0.05" min="0" max="1"')}
