<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FMS</title>
<style>
/* 배색과 모양은 가시화 파트의 관제 화면(third_party/vz-web-dashboard)을 따른다 —
   같은 시스템의 두 화면이 서로 다른 언어로 말하면 운영자가 두 번 배워야 한다.

   그 화면이 지키는 규칙을 그대로 가져온다. 색은 상태를 말할 때만 쓰고(ISA-101 의
   고성능 HMI 원칙), 평시는 중립색이며, 이모지 대신 색 + 글자 라벨로 말한다.
   **미배포·미측정은 장애가 아니라 "없는 것이 정상"** 이라 점선으로 눌러 그린다 —
   빨강으로 그리면 정상적인 축소 운용이 고장으로 읽힌다(AI-C-05). */
:root{
  /* 값은 눈대중이 아니라 Narchon 관제 화면에서 **뽑은** 것이다. 어두운 왼쪽
     레일(#2d2d2d)과 밝은 본문(#f2f2f5)의 대비가 그 화면의 뼈대다. */
  --surface:#f2f2f5; --panel:#ffffff; --raised:#fbfbfc;
  --border:#d2d6e0; --border-strong:#c2c7d2;
  --ink:#2a2b2d; --ink-2:#5a5e66; --ink-3:#8a8d93; --ink-faint:#bfbfc2;
  --accent:#2d8eff; --accent-ink:#1b6fd6; --accent-bg:#d5e8ff;
  --rail:#2d2d2d; --rail-ink:#d9dadc; --rail-on:#5ba8f7;
  --head:#edeff3;
  --good:#41b884; --good-bg:#e4f5ee;
  --warn:#e8a33d; --warn-bg:#fdf3e2; --warn-ink:#9a6b13;
  --serious:#e8590c; --serious-bg:#fff0e6;
  --critical:#e2544c; --critical-bg:#fdeceb;
  --heavy:#2a2b2d;
  --neutral:#b4b8c0; --neutral-bg:#f2f2f5;
  --radius:8px; --radius-lg:10px; --gap:14px;
  /* vz 의 첫 선택(Malgun Gothic/Consolas)은 윈도 글꼴이다. 뒤의 대체를 지우면
     리눅스·맥에서 한글이 통째로 두부가 된다 — 실제로 그렇게 났다. */
  --font:"Malgun Gothic","Segoe UI","Noto Sans KR","Apple SD Gothic Neo",
         system-ui,-apple-system,sans-serif;
  --mono:"Consolas","D2Coding","Noto Sans Mono CJK KR",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--surface);color:var(--ink);font:13px/1.6 var(--font);
     -webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}

header.top{display:flex;align-items:center;gap:var(--gap);padding:14px 22px;
  background:var(--panel);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:baseline;gap:10px}
.brand .mark{font-size:22px;font-weight:700;letter-spacing:.04em}
.brand .sub{font-size:13px;color:var(--ink-3)}
.top .spacer{flex:1}
.field{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-3)}
select,button.ghost{background:var(--raised);border:1px solid var(--border);
  border-radius:var(--radius);padding:7px 12px;font-size:13px}
button.ghost:hover{background:#eef1f4}
button.ghost{cursor:pointer}
button.ghost:hover{border-color:var(--accent)}
.stamp{font:12px/1 var(--mono);color:var(--ink-3)}

main{padding:var(--gap) 22px 40px}
.panel{display:none}
.panel.on{display:block}
h2{font-size:20px;margin:4px 0 6px;font-weight:700}
.hint{font-size:13px;color:var(--ink-3);margin:0 0 14px}
.card{background:var(--panel);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:14px 16px}
/* 왼쪽 굵은 선이 상태를 말한다 — vz 의 카드 규칙 그대로다. */
.card.good{border-left:5px solid var(--good)}
.card.warn{border-left:5px solid var(--warn);background:var(--warn-bg)}
.card.critical{border-left:5px solid var(--critical);background:var(--critical-bg)}
.card.absent{border:1px dashed var(--neutral);background:var(--neutral-bg);color:var(--ink-3)}
.cols{display:grid;gap:var(--gap)}
.cols.map{grid-template-columns:minmax(0,1fr) 340px}
.cols.zone{grid-template-columns:340px minmax(0,1fr)}
@media (max-width:1100px){.cols.map,.cols.zone{grid-template-columns:1fr}}

/* 상태 칩: 색 하나로 끝내지 않고 반드시 글자 라벨을 같이 둔다(vz 의 badge/chip). */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
  padding:3px 10px;border-radius:999px;background:#eef1f4;color:#37414b;white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none;opacity:.75}
.chip.good{background:var(--good-bg);color:var(--good)}
.chip.warn{background:var(--warn-bg);color:var(--warn-ink)}
.chip.serious{background:var(--serious-bg);color:#9a4408}
.chip.critical{background:var(--critical-bg);color:var(--critical)}

.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;margin:0}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font:12px/1.5 var(--mono);background:#eef1f4;border:1px solid var(--border);
  border-radius:6px;padding:2px 7px;color:var(--ink-2)}
.tag.miss{border-color:var(--critical);background:var(--critical-bg);color:var(--critical)}
.tag.zone{border-color:var(--accent);background:var(--accent-bg);color:var(--accent)}
ul.plain{list-style:none;margin:8px 0 0;padding:0}
ul.plain li{padding:7px 0;border-top:1px solid var(--border)}
ul.plain li:first-child{border-top:0}

.fnrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fnrow .name{font-weight:600;flex:1;min-width:180px}
button.link{background:none;border:0;color:var(--accent-ink);cursor:pointer;
  font-size:13px;padding:4px 0;text-decoration:underline}
button.primary{background:var(--accent);border:1px solid var(--accent);color:#fff;
  border-radius:var(--radius);padding:7px 14px;cursor:pointer;font-weight:600;font-size:13px}
button.primary[disabled]{background:var(--raised);border-color:var(--border-strong);
  color:var(--ink-3);cursor:not-allowed}
button.primary.danger{background:var(--critical);border-color:var(--critical)}
button.primary.danger:hover{background:#c23b33;border-color:#c23b33}

svg.stage{display:block;width:100%;height:auto;background:#fafbfc;
  border:1px solid var(--border);border-radius:var(--radius)}
svg text{font-family:var(--font)}
/* 맵 위의 장식은 포인터를 받지 않는다. 글자·격자·방향선·덮개원은 **보여 주는
   것**이고, 이벤트를 받게 두면 장치 위에 겹쳐 그 장치를 집을 수 없게 된다 —
   실제로 장치 이름(text)과 카메라 방향선(line)이 마커를 덮어 끌기가 되지 않았다.
   잡는 것은 `.zonehit` 뿐이라고 한 줄로 못박아 둔다. */
svg.stage *{pointer-events:none}
svg.stage .zonehit,svg.stage .zonehit *{pointer-events:all}
.zonehit{cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}

/* 커서를 올렸을 때 뜨는 작은 팝업. 화면 좌표로 띄우므로 body 에 붙인다. */
#gate{position:fixed;inset:0;z-index:80;background:#2a2b2dcc;display:flex;
  align-items:center;justify-content:center;padding:24px}
#gate[hidden]{display:none}
#gateCard{max-width:460px;width:100%}
#gateCard h2{margin:0 0 6px}
#gateCard .row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
#gateCard input,#gateCard select{background:var(--panel);
  border:1px solid var(--border-strong);border-radius:var(--radius);padding:9px 11px;flex:1;
  min-width:150px}
.permgrid{display:flex;flex-wrap:wrap;gap:6px}
.perm{font:12px/1.5 var(--mono);border:1px solid var(--border);border-radius:6px;
  padding:2px 7px;background:#eef1f4;color:var(--ink-2);cursor:default}
.perm.role{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.perm.extra{border-color:var(--accent);background:var(--accent-bg);color:var(--accent);
  cursor:pointer}
.perm.off{color:var(--ink-3);cursor:pointer}
.perm.off:hover{border-color:var(--accent)}
#pop{position:fixed;z-index:50;max-width:320px;background:var(--panel);
  border:1px solid var(--border);border-radius:var(--radius-lg);padding:11px 13px;
  box-shadow:0 8px 26px #1f23281f;font-size:13px;display:none;pointer-events:none}
#pop h4{margin:0 0 6px;font-size:15px}

table.grid{width:100%;border-collapse:collapse;font-size:13px}
table.grid th,table.grid td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border)}
table.grid th{color:var(--ink-2);font-weight:600;font-size:12px;
  background:var(--head)}
code{font:12px/1.5 var(--mono);color:var(--ink-2)}
.note{font-size:12px;color:var(--ink-3)}
/* 비어 있음은 장애가 아니다 — vz 가 미배포를 점선으로 그리는 것과 같은 이유다. */
.empty{padding:26px;text-align:center;color:var(--ink-3);border:1px dashed var(--neutral);
  background:var(--neutral-bg);border-radius:var(--radius-lg)}
.evgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.evgrid figure{margin:0;background:var(--panel);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:8px}
.evgrid img{width:100%;display:block;border-radius:3px;background:#000}
.evgrid figcaption{font-size:13px;color:var(--ink-3);margin-top:6px}
/* 라벨 편집기. 상자는 정규화 좌표(0..1)로 들고 그릴 때만 화면 크기를 곱한다 —
   표시 크기가 바뀌어도 좌표가 따라 흔들리지 않는다. */
.cols.label{display:grid;gap:var(--gap);grid-template-columns:210px minmax(0,1fr) 330px}
@media (max-width:1280px){.cols.label{grid-template-columns:1fr}}
#labCanvas{position:relative;background:#1f2328;border:1px solid var(--border);
  border-radius:var(--radius);overflow:hidden;user-select:none;touch-action:none}
#labCanvas img{display:block;width:100%;height:auto;pointer-events:none}
#labCanvas svg{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
#labCanvas .bx{fill:none;stroke-width:2;vector-effect:non-scaling-stroke;cursor:move;
  pointer-events:all}
#labCanvas .bx.model{stroke:#4d9bff;stroke-dasharray:5 4}
#labCanvas .bx.mine{stroke:#51cf66}
#labCanvas .bx.gone{stroke:#ff6b6b;stroke-dasharray:2 3}
#labCanvas .bx.sel{stroke:#ffffff;stroke-width:3}
#labCanvas .hd{fill:#ffffff;stroke:#1f2328;stroke-width:1;cursor:nwse-resize}
#labCanvas .cap{font:12px/1 var(--mono);fill:#ffffff;paint-order:stroke;
  stroke:#000;stroke-width:3;pointer-events:none}
.framelist{list-style:none;margin:0;padding:0;max-height:62vh;overflow-y:auto}
.framelist button{display:block;width:100%;text-align:left;background:none;border:0;
  border-left:3px solid transparent;padding:7px 9px;color:var(--ink-2);cursor:pointer;
  font:13px/1.4 var(--mono)}
.framelist button:hover{color:var(--ink);background:var(--raised)}
.framelist button[aria-current="true"]{color:var(--ink);border-left-color:var(--accent);
  background:var(--raised)}
.framelist .done{color:var(--good)}
.boxrow{border-top:1px solid var(--border);padding:9px 0}
.boxrow:first-child{border-top:0}
.boxrow[data-sel="1"]{background:var(--raised);border-radius:3px;padding:9px 8px}
.boxrow .head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.boxrow .head .id{font:13px/1 var(--mono);color:var(--ink-3);flex:1}
.boxrow label{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--ink-3);
  margin-top:6px}
.boxrow input,.boxrow select{background:var(--panel);border:1px solid var(--border-strong);
  border-radius:var(--radius);padding:5px 8px;flex:1;min-width:0}
#labReason{background:var(--panel);border:1px solid var(--border-strong);
  border-radius:var(--radius);padding:9px 11px;width:100%}
/* 배포 탭. 네 가지 일이 **실제 순서대로** 쌓이므로 한 열이고, 각 일은 폼과
   결과가 나란히 선다 — 폼만 보이면 무엇이 바뀌었는지 알 수 없다. */
.deck{display:grid;gap:var(--gap)}
.deck > section{background:var(--panel);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:14px 16px}
.deck > section > h3{margin:0 0 4px;font-size:16px}
.deck .body{display:grid;gap:var(--gap);grid-template-columns:minmax(0,360px) minmax(0,1fr);
  margin-top:12px}
@media (max-width:1100px){.deck .body{grid-template-columns:1fr}}
.form{display:grid;gap:8px}
.form label{display:grid;gap:4px;font-size:14px;color:var(--ink-3)}
.form input,.form select,.form textarea{background:var(--raised);
  border:1px solid var(--border-strong);border-radius:var(--radius);padding:6px 9px;
  width:100%;min-width:0}
.form textarea{resize:vertical;min-height:52px}
.form .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.form .check{display:flex;align-items:center;gap:7px}
.form .check input{width:auto}
.form .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
/* 결과 칸은 표를 담는다. 표가 칸보다 넓어지면 패널 **밖으로** 삐져나가므로
   (버튼이 카드 경계 너머에 그려진다) 넘치는 축만 스스로 미끄러지게 한다. */
.out{font-size:14px;display:grid;gap:10px;align-content:start;min-width:0;
  overflow-x:auto}
.deck .body > *{min-width:0}
.out table.grid{min-width:0}
.out code{word-break:break-all}
.out pre{margin:0;background:var(--neutral-bg);border:1px solid var(--border);
  border-radius:var(--radius);padding:9px 11px;overflow-x:auto;
  font:13px/1.5 var(--mono);color:var(--ink-2)}
.out .why{color:var(--ink-3);font-size:13px}
.steps{display:flex;gap:6px;flex-wrap:wrap;list-style:none;margin:0;padding:0}
.gates{display:flex;gap:0;align-items:stretch;flex-wrap:wrap;margin:10px 0 0}
.gates span{font-size:12px;padding:4px 10px;border:1px solid var(--border);
  border-right:0;color:var(--ink-3);background:var(--raised)}
.gates span:last-child{border-right:1px solid var(--border)}
.gates span.done{color:var(--good);border-color:var(--good);background:var(--good-bg)}
.gates span.now{color:var(--accent);background:var(--accent-bg);border-color:var(--accent)}
.bar{height:8px;background:var(--raised);border-radius:999px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--accent)}
/* ── 연결된 팝업(Flow) ──────────────────────────────────────────────────
   드릴을 탭으로 하지 않는다. 도메인을 누르면 그 자리에 구역 팝업이 뜨고, 구역에서
   장치를 누르면 장치 팝업이 그 옆에 뜨며, 둘은 선으로 이어진다 — 어디서 왔는지가
   화면에 남아 있어야 돌아갈 수 있다. 탭으로 갈아타면 그 경로가 사라진다.

   가시화 파트의 노드 그래프 화면과 같은 생각이다(third_party/vz-web-dashboard 의
   `canvas__edges`): 카드들이 놓이고 그 사이를 선이 잇는다. 다른 점은 우리 쪽
   카드가 **끌어 옮길 수 있다**는 것이고, 그래서 선을 그 자리마다 다시 그린다. */
/* 덮개는 **절대 포인터를 먹지 않는다.** 먹게 두면 팝업이 하나라도 열린 동안
   머리글·레일·본문이 통째로 눌리지 않는다 — 실제로 그렇게 났다. 이벤트를 받는
   것은 카드뿐이고, 카드 밖은 뒤에 있는 화면의 것이다. */
#flow{position:fixed;inset:0;z-index:60;pointer-events:none}
#flowEdges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pop3{pointer-events:auto}
#flowEdges path{fill:none;stroke:var(--border-strong);stroke-width:1.5}
#flowEdges path.live{stroke:var(--accent);stroke-dasharray:4 3}
.pop3{position:absolute;background:var(--panel);border:1px solid var(--border);
  border-left:5px solid var(--neutral);border-radius:var(--radius-lg);
  box-shadow:0 10px 30px #1f232826;display:flex;flex-direction:column;
  min-width:280px;max-width:min(620px,92vw);max-height:78vh}
.pop3.good{border-left-color:var(--good)}
.pop3.warn{border-left-color:var(--warn)}
.pop3.critical{border-left-color:var(--critical)}
.pop3.absent{border-left-style:dashed;border-left-color:var(--neutral)}
.pop3 > header{display:flex;align-items:center;gap:8px;padding:10px 12px;
  border-bottom:1px solid var(--border);cursor:move;user-select:none;flex:none}
.pop3 > header h4{margin:0;font-size:14px;font-weight:700;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pop3 > header .trail{font:11px/1 var(--mono);color:var(--ink-3);flex:none}
.pop3 > header button{background:none;border:0;color:var(--ink-3);cursor:pointer;
  font-size:16px;line-height:1;padding:2px 4px}
.pop3 > header button:hover{color:var(--ink)}
.pop3 > .body{padding:12px;overflow:auto;font-size:13px}
.pop3 > .acts{display:flex;gap:8px;flex-wrap:wrap;padding:10px 12px;flex:none;
  border-top:1px solid var(--border)}
/* ── 왼쪽 레일 ──────────────────────────────────────────────────────────
   탭을 위에 눕히지 않고 왼쪽에 세운다. 현대 로보틱스랩의 Narchon 관제 화면이
   같은 모양이고(아이콘 + 짧은 이름이 세로로), 그 편이 "지금 무엇을 하러 왔는가"
   여섯 가지를 한눈에 두면서 본문 가로폭을 지도에 내주기에 낫다.

   아이콘은 쓰지 않는다. 이 화면의 규칙이 "상태는 색 + 글자 라벨" 이고, 뜻을
   그림에 맡기면 처음 보는 사람이 눌러 봐야 안다. 대신 이름 아래에 그 탭이
   무엇인지 한 줄을 둔다. */
.shell{display:grid;grid-template-columns:168px minmax(0,1fr);min-height:calc(100vh - 56px)}
@media (max-width:900px){.shell{grid-template-columns:1fr}}
nav.rail{background:var(--rail);padding:10px 8px;
  display:flex;flex-direction:column;gap:2px}
@media (max-width:900px){
  nav.rail{flex-direction:row;overflow-x:auto}
}
nav.rail button{background:transparent;border:0;border-radius:var(--radius);
  padding:9px 10px;text-align:left;cursor:pointer;color:var(--rail-ink);
  display:flex;flex-direction:column;gap:2px;line-height:1.3;white-space:nowrap}
nav.rail button em{font-style:normal;font-size:11px;color:#8e9196;white-space:normal}
nav.rail button:hover{background:#3a3a3a;color:#fff}
nav.rail button[aria-selected="true"]{background:#1f1f1f;color:var(--rail-on);
  font-weight:700;box-shadow:inset 3px 0 0 var(--rail-on)}
nav.rail button[aria-selected="true"] em{color:#7fb9f5}
/* 접힌 레일 — **통째로 사라진다**. 아이콘만 남기면 그 아이콘이 무슨 탭인지
   눌러 봐야 알고, 접는 이유는 대개 지도에 폭을 내주려는 것이라 62px 도 아깝다.
   다시 펴는 길은 머리글의 메뉴 단추 하나뿐이고 그것은 늘 같은 자리에 있다.

   접었을 때 칸 **수**를 줄인다(`0 1fr` 이 아니라 `1fr`). 레일이 `display:none` 이면
   격자에 남는 자녀가 본문 하나뿐이고, 그 자녀는 첫 칸에 놓인다 — 첫 칸을 0 으로
   두면 본문 폭이 0 이 되어 화면이 빈다. 실제로 그렇게 깨졌다. */
.shell.tight{grid-template-columns:minmax(0,1fr)}
.shell.tight nav.rail{display:none}
nav.rail button span.short{display:none}

/* 빵부스러기 — 팝업이 경로를 선으로 말한다면, 이것은 같은 경로를 글로 말한다. */
.crumbs{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3);
  padding:10px 22px 0;flex-wrap:wrap}
.crumbs button{background:none;border:0;color:var(--accent-ink);cursor:pointer;
  font:inherit;padding:0;text-decoration:underline}
.crumbs span.sep{color:var(--neutral)}

/* 고른 장치가 곧 제목이다(Narchon 의 `SEONGSU_03 ⌄`). */
.subject{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0 10px}
.subject h2{margin:0}
.subject select{min-width:200px}

/* 수치 띠 — label / value / unit 한 줄. **미측정은 값 자리에 글자로 적는다.**
   0 으로 적으면 "쟀는데 0" 이 되고, 그것이 이 프로젝트가 가장 자주 경계하는 거짓이다. */
.strip{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 var(--gap)}
.strip .cell{background:var(--panel);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:10px 16px;display:flex;align-items:baseline;
  gap:10px}
.strip .cell b{font-size:34px;font-weight:700;line-height:1.05}
.strip .cell .lab{font-size:12px;color:var(--ink-3);align-self:center}
.strip .cell .unit{font-size:13px;color:var(--ink-3)}
.strip .cell.none{border-style:dashed;border-color:var(--neutral);background:var(--neutral-bg)}
.strip .cell.none b{font-size:14px;font-weight:600;color:var(--ink-3)}

/* 모듈별 상태 — 켜짐/꺼짐이 아니라 ACTIVE/DEGRADED/DISABLED 세 값이다. */
/* 카드 머리 — 제목 왼쪽, 그 카드의 조작 오른쪽. Narchon 의 모든 카드가 같은 모양이다. */
.cardhead{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.cardhead h3{margin:0;font-size:17px;font-weight:700;flex:1;min-width:0}
.cardhead .tools{display:flex;gap:6px;align-items:center}

.modgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
  gap:4px 18px;font-size:13px}
.modgrid .row{display:flex;align-items:center;gap:8px;padding:3px 0;
  border-bottom:1px solid var(--border)}
.modgrid .row .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.modgrid .row .v{font-weight:700;font-size:12px}
.modgrid .row .v.good{color:var(--good)}
.modgrid .row .v.warn{color:var(--warn-ink)}
.modgrid .row .v.critical{color:var(--critical)}
.modgrid .row .v.none{color:var(--ink-3)}

/* 제어 — 큰 버튼 격자. 되돌릴 수 없는 것은 **따로 떼어** 아래에 둔다. */
.ctlgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ctlgrid button{background:var(--accent-bg);border:1px solid #2d8eff22;
  border-radius:var(--radius-lg);padding:16px 12px;cursor:pointer;font-size:13px;
  font-weight:600;color:var(--ink);display:flex;flex-direction:column;gap:4px;
  align-items:center;text-align:center}
.ctlgrid button:hover{border-color:var(--accent)}
.ctlgrid button[disabled]{background:var(--neutral-bg);border-style:dashed;
  border-color:var(--neutral);color:var(--ink-3);cursor:not-allowed}
.ctlgrid button em{font-style:normal;font-size:11px;color:var(--ink-3);font-weight:400}
/* 되돌릴 수 없는 것은 Narchon 처럼 **검게** 둔다 — 빨강은 지금 난 고장에
   쓰고, 검정은 "이것을 누르면 끝난다" 에 쓴다. 둘을 같은 색으로 하면 고장
   난 화면에서 위험한 버튼이 묻힌다. */
.ctlgrid.danger button{background:var(--heavy);border-color:var(--heavy);
  color:#fff}
.ctlgrid.danger button em{color:#b9bcc1}
.ctlgrid.danger button:hover{background:#000}
/* 긴급정지만 **빨강**이다(AI-C-20: "긴급정지는 일반 취소와 구분하고"). 검정은
   "누르면 끝난다"(전원·재부팅)이고 빨강은 "지금 멈춰라" 다. 둘을 같은 검정으로
   두면 급할 때 손이 어느 것을 찾아야 하는지가 색으로 드러나지 않는다. */
.ctlgrid.estop button{background:var(--critical);border-color:var(--critical);
  color:#fff;font-size:14px}
.ctlgrid.estop button:hover{background:#c23b33;border-color:#c23b33}
.ctlgrid.estop button em{color:#ffd9d6}
.ctlgrid.estop button[disabled]{background:var(--critical-bg);
  border-color:var(--critical);color:var(--critical)}
.steprail{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:var(--gap)}
.steprail button{display:flex;align-items:center;gap:8px;cursor:pointer;
  background:var(--panel);border:1px solid var(--border-strong);
  border-radius:var(--radius-lg);padding:9px 14px;font-size:13px;color:var(--ink-2)}
.steprail button b{display:grid;place-items:center;width:20px;height:20px;
  border-radius:50%;background:var(--neutral-bg);color:var(--ink-3);font-size:11px}
.steprail button.on{border-color:var(--accent);color:var(--ink);font-weight:600}
.steprail button.on b{background:var(--accent);color:#fff}
.steprail button:hover{border-color:var(--accent)}
.ctlsep{margin:14px 0 8px;font-size:12px;color:var(--ink-3);
  border-top:1px dashed var(--border-strong);padding-top:10px}

/* 원격 조종 — Narchon 의 방향판 그대로 3x3 이고 돌림 두 개가 그 아래다.
   토글 뒤에 둔다. 켜 두지 않으면 눌리지 않는다.

   **자리는 고정이고 단추는 아니다.** 아홉 칸 중 그 장치가 공지한 action 이
   앉은 칸만 단추가 되고 나머지는 빈 칸으로 남는다(AI-C-18). 전에는 아홉 칸이
   늘 단추여서, 공지에 없는 이름을 보내는 단추를 네 개 그리고 있었다. */
.jog{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;
  width:min(100%,186px);margin:10px auto 0}
.jog > *{aspect-ratio:1;border-radius:var(--radius)}
.jog .hole{border:1px dashed var(--border)}
.jog button,.jogturn button{background:var(--panel);
  border:1px solid var(--border-strong);cursor:pointer;font-size:17px;
  color:var(--ink);border-radius:var(--radius)}
.jog button:hover,.jogturn button:hover{border-color:var(--accent);
  background:var(--accent-bg)}
.jog button[disabled],.jogturn button[disabled]{color:var(--ink-3);
  border-style:dashed;cursor:not-allowed;background:var(--panel)}
.jog button.hub{font-size:14px;font-weight:700}
.jogturn{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;
  width:min(100%,186px);margin:6px auto 0}
.jogturn button{height:38px;font-size:15px}
.jogkey{display:flex;justify-content:center;gap:6px;margin-top:8px;
  font-size:11px;color:var(--ink-3)}
.jogkey kbd{border:1px solid var(--border-strong);border-radius:4px;
  padding:0 5px;font-family:var(--mono);background:var(--panel)}
/* 요청 기록 — 제 칸 안에서 구른다. 이 판이 길어지면 같은 줄의 다른 카드 밑에
   그만큼 빈 자리가 생긴다. */
.cmdlog{max-height:230px;overflow:auto}
.cmdrow{border-bottom:1px solid var(--border);padding:8px 0}
.cmdrow:last-child{border-bottom:0}
/* 전달·수락·실행을 **나란히 셋**으로. 한 칸에 합치지 않는다(AI-C-20). */
.cmdfacts{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:5px}
.cmdfacts span{display:flex;align-items:center;gap:5px}
.cmdfacts i{font-style:normal;font-size:11px;color:var(--ink-3)}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px}
.toggle input{width:auto}
/* ── 모니터링 — Narchon 의 격자 그대로 ───────────────────────────────────
   그 화면의 배치를 베낀다: 장치 선택이 머리에 있고, 그 아래 수치 카드 세 장이
   한 줄, 그 아래 영상과 지도가 나란히, 맨 아래 로그·제어·원격조종 세 판이다.

   칸의 **뜻**만 우리 것으로 바꿨다. 그 화면의 세 카드는 배터리·모듈상태·지연인데
   우리는 배터리와 지연을 측정하지 않는다. 대신 우리가 실제로 아는 것을 같은
   자리에 둔다 — 선언된 자원, 기능별 상태(모듈별 상태 정보와 같은 자리), 마지막
   공지로부터의 경과(그 화면의 지연 카드가 하는 일과 같다: "지금 살아 있는가").

   우리가 그 화면보다 더 가진 것은 이 배치 위에 얹힌다 — 지도에 다중 장치 정합
   결과가 올라가고, 로그 한 줄을 누르면 원인 추적이 뜨고, 추론 결과에는 근거
   팝업이 달린다. */
/* 한 줄의 카드는 **키가 같다**. `align-items:start` 이면 카드마다 내용 길이대로
   끝나서 세 카드의 아래 선이 들쭉날쭉해지고, 참고 화면의 격자와 어긋난다. */
.mongrid{display:grid;gap:var(--gap);grid-template-columns:repeat(3,minmax(0,1fr));
  align-items:stretch}
.mongrid .wide{grid-column:span 2}
@media (max-width:1200px){
  .mongrid{grid-template-columns:1fr}
  .mongrid .wide{grid-column:span 1}
}
.mongrid .card{display:flex;flex-direction:column;min-height:0}
.mongrid .card .grow{flex:1;min-height:0;overflow:auto}
/* 세로 맞춤 — 줄은 맞되 **구멍이 남지 않아야** 한다. 앞서는 줄마다 최소 높이를
   박고 그림을 `margin-top:auto` 로 바닥에 붙였는데, 줄 높이를 정하는 것이 가장
   긴 카드(기능 목록)여서 짧은 두 카드 위로 빈 칸이 270px 씩 남았다.

   대신 **긴 쪽을 재운다**: 기능 목록에 제 높이를 주고 넘치면 그 안에서 구르게
   한다. 그러면 줄 자체가 짧아지고, 짧은 카드의 그림은 `margin-block:auto` 로
   남은 자리 **가운데**에 놓여 한쪽에 몰린 구멍이 되지 않는다. */
/* 목록이 제 칸을 넘으면 그 안에서 구른다. 잘린 자리에 선을 하나 두어 "아래에
   더 있다" 가 보이게 한다 — 선이 없으면 줄이 반쯤 잘린 것이 고장으로 읽힌다. */
.mongrid .fig .grow{max-height:142px;border-bottom:1px solid var(--border)}
.mongrid .fig .plot{margin-block:auto;padding-top:10px}
.mongrid .media{min-height:330px}
.mongrid .media .cam,
.mongrid .media .mapwrap{flex:1;min-height:0}

/* ── 그림 원형 — 가는 자국, 데이터 끝만 둥글게, 칸 사이 2px ───────────────
   1) 미터: 선언 예산 **대비** 선언 수요. 측정값이 아니라는 사실을 라벨이 적는다.
   2) 쌓은 띠: 상태 구성. 색만으로 뜻을 말하지 않고 아래 범례가 이름과 수를 적는다.
   3) 게이지: 마지막 공지로부터. 경계는 띠 위의 **눈금**이고 색이 아니다.
   미측정은 0 이 아니다 — 0 폭 막대가 아니라 **점선 빈 트랙**으로 그린다. */
.meter{margin:0 0 9px}
.meter:last-child{margin-bottom:0}
.meter .cap{display:flex;align-items:baseline;gap:6px;font-size:12px;
  color:var(--ink-2);margin-bottom:4px}
.meter .cap b{font-size:15px;color:var(--ink);font-weight:700}
.meter .cap .of{color:var(--ink-3)}
.meter .cap .pct{margin-left:auto;font:11px/1 var(--mono);color:var(--ink-3)}
.meter .track{height:8px;border-radius:4px;background:var(--head);overflow:hidden}
.meter .fill{height:100%;border-radius:0 4px 4px 0;background:var(--accent)}
.meter .fill.tight{background:var(--warn)}
.meter .fill.over{background:var(--serious)}
.meter.none .track{background:repeating-linear-gradient(135deg,
  var(--neutral-bg) 0 5px,#e6e7ec 5px 10px);border:1px dashed var(--neutral);
  height:10px}

.sbar{display:flex;gap:2px;height:12px;border-radius:6px;overflow:hidden;
  background:var(--head)}
.sbar i{display:block;height:100%}
.sbar i:first-child{border-radius:6px 0 0 6px}
.sbar i:last-child{border-radius:0 6px 6px 0}
.sbar i.good{background:var(--good)}
.sbar i.warn{background:var(--warn)}
.sbar i.serious{background:var(--serious)}
.sbar i.critical{background:var(--critical)}
.sbar i.none{background:var(--neutral)}
.sbar.empty{background:repeating-linear-gradient(135deg,var(--neutral-bg) 0 5px,
  #e6e7ec 5px 10px)}
.chartkey{display:flex;gap:12px;flex-wrap:wrap;margin-top:7px;font-size:12px;
  color:var(--ink-2)}
.chartkey span{display:inline-flex;align-items:center;gap:5px}
.chartkey i{width:8px;height:8px;border-radius:2px;display:inline-block}
.chartkey i.good{background:var(--good)}
.chartkey i.warn{background:var(--warn)}
.chartkey i.serious{background:var(--serious)}
.chartkey i.critical{background:var(--critical)}
.chartkey i.none{background:var(--neutral)}
.chartkey b{font-weight:700;color:var(--ink)}

.gauge{position:relative;height:12px;border-radius:6px;background:var(--head);
  overflow:visible;margin-top:2px}
.gauge .fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px 4px 4px 6px;
  background:var(--good)}
.gauge .fill.warn{background:var(--warn)}
.gauge .tick{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink-2)}
.gauge .tick b{position:absolute;left:4px;top:-15px;font:10px/1 var(--mono);
  color:var(--ink-3);font-weight:600;white-space:nowrap}
.gauge.none{background:repeating-linear-gradient(135deg,var(--neutral-bg) 0 5px,
  #e6e7ec 5px 10px);border:1px dashed var(--neutral)}

/* ── 도메인 상세 카드 ───────────────────────────────────────────────────
   옆 칸은 목록이 아니라 **고른 도메인 하나**를 말한다. 수치 셋이 위에, 그 아래
   구역 상태 띠, 그 아래 로봇 종류 막대, 맨 아래 인프라 줄이다. */
.domcard{display:flex;flex-direction:column;gap:2px}
.domhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.domhead h3{margin:0;font-size:18px;font-weight:700;flex:1;min-width:0}
.domnums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.domnums div{background:var(--raised);border:1px solid var(--border);
  border-radius:var(--radius);padding:8px 10px;text-align:center}
.domnums b{display:block;font-size:24px;line-height:1.1;font-weight:700}
.domnums span{font-size:11px;color:var(--ink-3)}
.domsec{font-size:12px;font-weight:700;color:var(--ink-2);margin:14px 0 6px;
  padding-top:10px;border-top:1px solid var(--border)}

/* 장치 그림 — 선 그림 하나. 글자를 대신하지 않고 옆에 선다. */
.devicon{display:block;color:var(--ink-2)}
.kindlist{display:flex;flex-direction:column;gap:4px}
.kindrow{display:grid;grid-template-columns:26px minmax(0,1fr) auto 84px;
  align-items:center;gap:8px;padding:4px 6px;border-radius:var(--radius);
  cursor:pointer}
.kindrow:hover,.kindrow:focus-visible{background:var(--accent-bg);outline:none}
.kindrow:hover .devicon{color:var(--accent-ink)}
.kindrow .nm{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kindrow .ct{font:12px/1 var(--mono);color:var(--ink-3)}
.kindrow .ct b{font-size:14px;color:var(--ink)}
/* 막대 길이 = 선언 수, 채워진 부분 = 탐지된 수. 한 축이고 부분과 전체다. */
.kindrow .br{height:10px;background:var(--head);border-radius:5px;overflow:hidden}
.kindrow .br i{display:block;height:100%;background:var(--neutral);border-radius:5px}
.kindrow .br u{display:block;height:100%;background:var(--good);border-radius:5px}
.infralist{display:flex;flex-wrap:wrap;gap:8px}
.infra{display:inline-flex;align-items:center;gap:5px;font-size:12px;
  color:var(--ink-2);background:var(--raised);border:1px solid var(--border);
  border-radius:var(--radius);padding:4px 8px}
.infra b{color:var(--ink)}
.domacts{display:flex;gap:8px;align-items:center;margin-top:16px}
.domacts select{flex:1;min-width:0}

/* 요약 띠 — 장치 하나를 고르기 **전에** 전체가 어떤가. Narchon 머리글의 요약
   자리와 같은 구실이고, 누르면 그 묶음의 목록이 뜬다. */
.monband{display:flex;align-items:center;gap:14px;background:var(--panel);
  border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:10px 14px;margin:0 0 var(--gap)}
.monband .lab{font-size:12px;color:var(--ink-3);flex:none}
.monband .bars{flex:1;min-width:0}
.monband button.link{flex:none}

/* 영상 판 — Narchon 의 `CAM 1 : IDLE` 뱃지와 전체화면 단추. 다만 우리가 내보내는
   것은 **저장된 프레임**이지 생중계가 아니다. 그 사실을 뱃지에 적는다 —
   "LIVE" 라고 쓰면 운영자가 지금을 보고 있다고 믿는다. */
.cam{position:relative;background:#1f2328;border-radius:var(--radius);overflow:hidden;
  min-height:160px;display:flex;align-items:center;justify-content:center}
.cam img{display:block;width:100%;height:auto}
.cam .badge{position:absolute;left:10px;top:10px;background:#00000099;color:#fff;
  font-size:12px;font-weight:700;padding:4px 10px;border-radius:var(--radius)}
.cam .idx{position:absolute;right:10px;top:10px;background:#ffffffe6;color:var(--ink);
  font-size:12px;font-weight:700;padding:4px 10px;border-radius:var(--radius)}
.cam .none{color:#9aa1a9;font-size:13px;padding:40px 16px;text-align:center}

/* 지도 판 — 층 선택기는 Narchon 처럼 왼쪽에 세로로 서고, 층마다 그 층의 로봇
   수가 뱃지로 붙는다. 0 인 층은 뱃지를 달지 않는다. */
.mapwrap{position:relative;display:grid;grid-template-columns:118px minmax(0,1fr);
  gap:10px;align-items:start}
.floors{display:flex;flex-direction:column;gap:3px}
.floors button{background:var(--panel);border:1px solid var(--border);
  border-radius:var(--radius);padding:7px 8px;cursor:pointer;font-size:12px;
  display:flex;align-items:center;justify-content:space-between;gap:6px}
.floors button:hover{border-color:var(--accent)}
.floors button[aria-current="true"]{border-color:var(--accent);color:var(--accent);
  font-weight:700;background:var(--accent-bg)}
.floors button i{font-style:normal;background:var(--good);color:#fff;border-radius:4px;
  font-size:10px;padding:1px 5px;font-weight:700}
.mapchips{position:absolute;left:86px;top:8px;display:flex;gap:6px;flex-wrap:wrap;
  z-index:2}
.maptask{position:absolute;right:8px;top:8px;z-index:2;background:var(--panel);
  border:1px solid var(--border);border-radius:var(--radius);padding:6px 10px;
  font-size:12px;max-width:50%}
.maptask b{display:block;font-size:11px;color:var(--ink-3);font-weight:600}
.mapzoom{position:absolute;right:8px;bottom:8px;z-index:2;display:flex;gap:4px}
.mapzoom button{width:32px;height:32px;border-radius:var(--radius);
  border:1px solid var(--border);background:var(--panel);cursor:pointer;font-size:15px}
.mapzoom button:hover{border-color:var(--accent)}

/* 로그 표 — 행 끝의 돋보기가 그 줄의 상세·원인으로 들어가는 입구다. */
.logtable{width:100%;border-collapse:collapse;font-size:12px}
.logtable th{background:var(--head);color:var(--ink-2);font-weight:600;
  text-align:left;padding:6px 8px;position:sticky;top:0}
.logtable td{padding:5px 8px;border-bottom:1px solid var(--border)}
.logtable tr:hover td{background:var(--neutral-bg)}
.logtable .go{background:none;border:0;cursor:pointer;color:var(--ink-3);font-size:13px}
.logtable .go:hover{color:var(--accent)}
/* 팝업 안의 표 — 카드 폭이 정해져 있으므로 긴 식별자는 **접는다**. 접지 않으면
   표가 카드 밖으로 밀려 오른쪽 칸이 통째로 보이지 않는다(실제로 그랬다). */
.pop3 .logtable{table-layout:fixed;width:100%}
.pop3 .logtable td,.pop3 .logtable th{overflow-wrap:anywhere}
.pop3 .logtable code{overflow-wrap:anywhere}
</style>
</head>
<body>

       그대로 쓰기 위해 자리만 남겨 둔다. Flow 가 이 노드를 팝업 안으로 옮긴다. -->

<!-- 들어가기 가림막. 권한이 없어 아무것도 못 하는 상태로 화면을 띄우는 대신
     들어갈 길을 먼저 보여 준다. -->
<div id="gate" hidden>
  <div class="card" id="gateCard"></div>
</div>

<script src="map_background.js"></script>
<script>
"use strict";
/* ===========================================================================
   상태
   =========================================================================== */
const S = {
  strings:{}, role:"admin", locale:"ko", caps:{}, scene:null, domains:[],
  domainId:null, domainScene:null, levelId:null, zoneId:null, zone:null,
  robotId:null, goalKind:null, graph:null, evidence:null,
  commanding:false, explaining:false, facts:{},
  evSample:null, twinRecords:[], identity:null, accountData:null,
};
const T = (k) => (S.strings[k] !== undefined ? S.strings[k] : k);
const el = (id) => document.getElementById(id);
const esc = (v) => String(v === undefined || v === null ? "" : v)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const qs = (extra) => {
  // 권한은 더 이상 질의 인자가 아니다 — 세션 쿠키가 그 일을 한다. 언어만 남는다.
  const p = new URLSearchParams({locale:S.locale});
  for (const [k,v] of Object.entries(extra||{})) if (v!==null && v!==undefined) p.set(k,v);
  return p.toString();
};
async function api(path, extra){
  const r = await fetch(path + "?" + qs(extra));
  const body = await r.json().catch(() => ({error:"bad_json"}));
  if (!r.ok) throw new Error(body.error || ("http_" + r.status));
  return body;
}
async function post(path, body){
  const r = await fetch(path + "?" + qs({}), {method:"POST",
    headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
  const out = await r.json().catch(() => ({error:"bad_json"}));
  if (!r.ok) throw new Error(out.error || ("http_" + r.status));
  return out;
}
const label = (v) => {
  if (v === null || v === undefined) return T("app.none");
  if (typeof v === "object") return v[S.locale] || v.en || v.ko || JSON.stringify(v);
  return String(v);
};

/* 상태 → 칩 등급. 색만으로 말하지 않으므로 라벨 키도 같이 돌려준다. */
const ZONE_GRADE = {operable:"good", limited:"warn", idle:"", no_robot:""};
const FN_GRADE = {ACTIVE:"good", DEGRADED:"warn", DISABLED:"critical"};
/* 코드 주석에서 온 설명문을 화면에 옮긴다. `**굵게**` 만 해석하고 나머지는
   글자 그대로 둔다 — 이스케이프가 먼저다. */
const emph = (text) => esc(text || "").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
const chip = (grade, text) =>
  `<span class="chip ${grade||""}"><span class="dot"></span>${esc(text)}</span>`;

/* ===========================================================================
   맵 렌더러 — **교체 지점**

   그리는 쪽이 아는 것은 /api/scene 과 /api/zone 의 장면 데이터뿐이다. 색·픽셀·
   폰트는 여기에만 있고 서버 응답에는 없다. 나중에 Unity WebGL 로 바꿀 때 이
   객체 하나를 같은 메서드 이름으로 다시 구현하면 되고, 서버와 나머지 화면은
   건드리지 않는다(AI-C-04 의 provider 경계를 화면에 적용한 것).
   =========================================================================== */
const SvgMapRenderer = (() => {
  const NS = "http://www.w3.org/2000/svg";
  /* 색은 가시화 파트 화면과 같은 값을 쓴다 — 같은 상태가 두 화면에서 다른 색이면
     운영자가 두 번 배운다. 로봇이 없는 구역은 장애가 아니라 "없는 것이 정상" 이라
     옅은 중립색이고, 그 구별이 vz 의 미배포 점선과 같은 뜻이다. */
  const FILL = {operable:"#e9f7ec", limited:"#fdf3e2", idle:"#f4f5f7", no_robot:"#fafbfc"};
  const LINE = {operable:"#2f9e44", limited:"#e8a33d", idle:"#c6ccd3", no_robot:"#e3e6ea"};
  /* 글자·장식에 쓰는 잉크. CSS 토큰과 같은 값이다. */
  const INK = "#1f2328", INK2 = "#37414b", INK3 = "#6b7280", MUTE = "#9aa1a9";
  const EDGE = "#ffffff";            /* 마커 테두리 — 밝은 바탕에서 형태를 세운다 */
  const ACCENT = "#1565c0";
  const ROLE_SHAPE = {ugv:"square", uav:"triangle", fixed_camera:"diamond",
                      edge_node:"hex", edge:"hex", server:"hex",
                      // 라우터는 엣지에 붙어 있지 않고 따로 선다. 모양도 따로 둔다.
                      access_point:"beacon"};

  function stage(space, pad){
    const node = document.createElementNS(NS, "svg");
    node.setAttribute("class", "stage");
    /* 평면의 원점이 (0,0) 이 아닐 수 있다 — 현장 평면은 datum 을 원점으로 삼고
       그 둘레로 **음수 쪽까지** 뻗는다. 원점을 무시하고 0 에서 그리면 지도의
       한쪽이 화면 밖으로 나가고 핀이 엉뚱한 자리에 선다. 없으면 0 이다. */
    const org = space.origin || {x: 0, y: 0};
    node.setAttribute("viewBox",
      `${org.x - pad} ${org.y - pad} ${space.width + pad*2} ${space.height + pad*2}`);
    node.setAttribute("preserveAspectRatio", "xMidYMid meet");
    return node;
  }
  function add(parent, name, attrs, text){
    const n = document.createElementNS(NS, name);
    for (const [k,v] of Object.entries(attrs)) n.setAttribute(k, v);
    if (text !== undefined) n.textContent = text;
    parent.appendChild(n);
    return n;
  }

  /* 지도 위의 글자 — 흰 테두리를 **먼저** 칠하고 글자를 그 위에 올린다.
     장치 아이콘과 경로 선이 글자 아래를 지나가도 읽을 수 있어야 한다. */
  function mapText(parent, attrs, text, k){
    const n = add(parent, "text", attrs, text);
    n.setAttribute("stroke", "#ffffff");
    n.setAttribute("stroke-width", String(0.55 * k));
    n.setAttribute("paint-order", "stroke");
    n.setAttribute("stroke-linejoin", "round");
    return n;
  }
  /* 글자 크기를 좌표계 크기에 맞춘다 — 도메인마다 단위가 달라(index vs meter)
     고정 크기로 두면 한쪽에서는 글자가 보이지 않고 다른 쪽에서는 화면을 덮는다. */
  const scaleOf = (space) => Math.max(space.width, space.height) / 100;

  function marker(parent, x, y, role, color, size){
    const s = size;
    const shape = ROLE_SHAPE[role] || "square";
    if (shape === "triangle")
      return add(parent, "polygon", {points:`${x},${y-s} ${x+s},${y+s} ${x-s},${y+s}`,
        fill:color, stroke:EDGE, "stroke-width":s*0.2});
    if (shape === "diamond")
      return add(parent, "polygon", {points:`${x},${y-s} ${x+s},${y} ${x},${y+s} ${x-s},${y}`,
        fill:color, stroke:EDGE, "stroke-width":s*0.2});
    if (shape === "beacon"){
      // 작은 원 + 퍼지는 호 두 개. 송출하는 물건임을 모양으로 말한다.
      const g = add(parent, "g", {});
      add(g, "circle", {cx:x, cy:y, r:s*0.55, fill:color,
        stroke:EDGE, "stroke-width":s*0.18});
      for (const r of [s*1.15, s*1.75])
        add(g, "path", {d:`M ${x-r*0.72} ${y-r*0.72} A ${r} ${r} 0 0 1 ${x+r*0.72} ${y-r*0.72}`,
          fill:"none", stroke:color, "stroke-width":s*0.18});
      /* 잡을 면을 맨 위에 **투명하게** 덮는다. 이것이 없으면 집을 수 있는 곳이
         0.18 굵기의 호와 작은 원뿐이고, 모양의 가운데를 눌러도 아무것도 잡히지
         않는다 — 빈 `g` 는 히트 대상이 아니기 때문이다. `fill:none` 이 아니라
         `transparent` 여야 이벤트를 받는다. */
      add(g, "circle", {cx:x, cy:y, r:s*1.9, fill:"transparent",
                        "pointer-events":"all"});
      return g;
    }
    if (shape === "hex")
      return add(parent, "rect", {x:x-s, y:y-s*0.7, width:s*2, height:s*1.4, rx:s*0.3,
        fill:"none", stroke:color, "stroke-width":s*0.35});
    return add(parent, "rect", {x:x-s, y:y-s, width:s*2, height:s*2, rx:s*0.25,
      fill:color, stroke:EDGE, "stroke-width":s*0.2});
  }

  /* 도면 칸 하나 — 흰 바닥 · 가는 벽 · 왼쪽 상태 띠.

     상태를 **면으로 칠하지 않는다.** 바닥을 상태 색으로 덮으면 그 위의 검은
     아이콘과 점선 경로가 묻히고, 결국 색 하나가 뜻을 혼자 말하게 된다. 대신 vz
     카드의 규칙 그대로 **왼쪽에 굵은 선 하나**를 두고 뜻은 글자가 말한다 —
     이 화면의 규칙이 처음부터 "상태는 색 + 글자 라벨" 이었다.

     예시 현장은 점선이다(미배포·실제가 아님을 뜻하는 vz 의 점선과 같은 뜻). */
  function planRect(parent, rect, k, opts){
    const o = opts || {};
    const g = add(parent, "g", o.hit ? {class:"zonehit"} : {});
    add(g, "rect", {x:rect.x, y:rect.y, width:rect.w, height:rect.h, rx:0.3*k,
      fill:"#ffffff", stroke:o.dashed ? "#b9bfc9" : "#c9ced6",
      "stroke-width":(o.strong ? 0.7 : 0.5)*k,
      "stroke-dasharray":o.dashed ? `${2*k} ${1.5*k}` : "none"});
    /* 안쪽 가는 선 한 겹 — 도면에서 벽 두께를 읽게 하는 값싼 방법이다. */
    add(g, "rect", {x:rect.x + 0.9*k, y:rect.y + 0.9*k,
      width:Math.max(0, rect.w - 1.8*k), height:Math.max(0, rect.h - 1.8*k),
      rx:0.2*k, fill:"none", stroke:"#eef1f4", "stroke-width":0.2*k});
    if (o.state)
      add(g, "rect", {x:rect.x, y:rect.y, width:0.9*k, height:rect.h,
        rx:0.3*k, fill:LINE[o.state] || LINE.idle});
    return g;
  }

  /* 장치 그림 마커 — Narchon 의 지도는 로봇을 **검은 픽토그램 + 이름표**로 찍는다.
     색 점은 "무엇이 거기 있는지" 를 말하지 못하고, 종류가 섞인 현장에서는 네발
     로봇과 드론이 같은 네모가 된다. 그림은 `DEVICE_ICONS` 를 그대로 쓴다 —
     옆 칸(도메인 상세)과 지도가 **같은 그림**이어야 한눈에 같은 것으로 읽힌다.

     흰 테두리를 먼저 깔고 검은 선을 그 위에 올린다. 도면 선 위에 바로 얹으면
     벽 선과 다리 선이 붙어 보인다. */
  function iconMarker(parent, x, y, kind, size, opts){
    const o = opts || {};
    const g = add(parent, "g", {class:"devicon", transform:
      `translate(${x - size / 2},${y - size / 2}) scale(${size / 24})`});
    const paths = DEVICE_ICONS[kind] || DEVICE_ICONS.unknown;
    /* 같은 그림을 두 번 그린다: 아래는 굵은 흰 선(바탕에서 형태를 떼어 낸다),
       위는 가는 검은 선. */
    for (const [stroke, width] of [[EDGE, 4.5], [o.color || INK, 1.7]]){
      const layer = add(g, "g", {fill:"none", stroke, "stroke-width":width,
        "stroke-linecap":"round", "stroke-linejoin":"round"});
      layer.innerHTML = paths;
    }
    /* 잡을 면 — 선만으로는 가운데를 눌러도 아무것도 잡히지 않는다. */
    add(g, "rect", {x:0, y:0, width:24, height:24, fill:"transparent",
                    "pointer-events":"all"});
    return g;
  }

  /* 이름표 — 지도의 그 자리 아래 붙는 작은 알약. 선택된 것은 빨간 테두리다. */
  function nameTag(parent, x, y, text, k, selected){
    const width = Math.max(text.length * 1.12, 6) * k;
    const g = add(parent, "g", {});
    add(g, "rect", {x:x - width / 2, y:y, width, height:3.2 * k, rx:0.6 * k,
      fill:"#ffffff", stroke:selected ? "#e2544c" : "#c6ccd3",
      "stroke-width":(selected ? 0.4 : 0.22) * k});
    add(g, "text", {x, y:y + 2.3 * k, fill:selected ? "#c0392b" : INK2,
      "font-size":1.9 * k, "text-anchor":"middle"}, text);
    return g;
  }

  /* 계획된 순서 — **앞으로 들를 자리를 미리** 선으로 잇는다. 주행 경로가
     아니다(경로 계획은 우리 것이 아니다 — AI-C-19). 그래서 점선이고, 범례가
     "계획된 순서" 라고 적는다. 번호는 들르는 차례다. */
  function routeLine(parent, points, k, opts){
    if (!points || points.length < 2) return null;
    const o = opts || {};
    const g = add(parent, "g", {"pointer-events":"none"});
    const d = points.map((pt, i) =>
      `${i ? "L" : "M"}${pt.x},${pt.y}`).join(" ");
    add(g, "path", {d, fill:"none", stroke:"#ffffff", "stroke-width":1.1 * k,
      "stroke-linecap":"round", "stroke-linejoin":"round"});
    add(g, "path", {d, fill:"none", stroke:o.color || ACCENT,
      "stroke-width":0.55 * k, "stroke-linecap":"round", "stroke-linejoin":"round",
      "stroke-dasharray":`${1.6 * k} ${1.1 * k}`});
    points.forEach((pt, i) => {
      add(g, "circle", {cx:pt.x, cy:pt.y, r:1.5 * k, fill:"#ffffff",
        stroke:o.color || ACCENT, "stroke-width":0.35 * k});
      add(g, "text", {x:pt.x, y:pt.y + 0.7 * k, fill:o.color || ACCENT,
        "font-size":1.9 * k, "font-weight":"700", "text-anchor":"middle"}, String(i + 1));
    });
    return g;
  }

  return {
    /** 메인 맵 — 도메인 목록, 또는 **현장 지도**.

        평면이 미터면(배경 그림이 걸린 현장) 도메인은 네모가 아니라 그 자리의
        **맵 포인트**로 선다 — 그 자리는 공개 지도에서 받아 적은 선언이고
        `site_at` 이 그 사실을 들고 온다. 평면이 index 면 지금까지와 같이 목록
        모양의 네모다. 배경 없는 현장이 정상 배치이기 때문이다(AI-C-05). */
    drawDomains(host, scene, handlers){
      host.textContent = "";
      const space = scene.space, k = scaleOf(space);
      const node = stage(space, 4*k);
      if (space.unit === "meter" && scene.domains.some(d => d.site_at)){
        /* 핀을 한 묶음 안에 둔다 — 배경 그림이 이 묶음의 **맨 앞**에 들어가
           모든 핀 아래에 깔린다(`map_background.js`). 묶음 없이 그리면 그림이
           첫 핀 안으로 들어가 둘째 핀부터는 그림 위에 서지 못한다. */
        const g0 = add(node, "g", {});
        for (const d of scene.domains){
          if (!d.site_at) continue;            /* 자리를 모르는 도메인은 찍지 않는다 */
          const g = add(g0, "g", {class:"zonehit", style:"cursor:pointer"});
          /* 잡을 면을 **먼저** 깐다. 핀은 동그라미와 이름표 사이가 비어 있어서
             그 틈을 누르면 아무것도 잡히지 않는다 — 가운데를 눌렀는데 안 열리는
             일이 실제로 났다. 핀 전체를 덮는 투명 면 하나로 틈을 없앤다. */
          add(g, "rect", {x:d.site_at.x - 7*k, y:d.site_at.y - 5*k,
            width:14*k, height:18*k, fill:"transparent", "pointer-events":"all"});
          /* 핀 — 색이 상태를 말하고 글자가 같은 것을 되풀이한다. */
          add(g, "circle", {cx:d.site_at.x, cy:d.site_at.y, r:3.4*k,
            fill:FILL[d.state] || "#ffffff", stroke:LINE[d.state] || INK2,
            "stroke-width":0.9*k});
          iconMarker(g, d.site_at.x, d.site_at.y, "building", 4.2*k,
                     {color:LINE[d.state] || INK2});
          nameTag(g, d.site_at.x, d.site_at.y + 4.6*k, label(d.label), k, false);
          mapText(g, {x:d.site_at.x, y:d.site_at.y + 11.4*k,
            fill:LINE[d.state] || INK2, "font-size":2.3*k, "font-weight":600,
            "text-anchor":"middle"}, T("map.state." + d.state), k);
          g.addEventListener("mousemove", (e) => handlers.onHover(d, e));
          g.addEventListener("mouseleave", () => handlers.onLeave());
          g.addEventListener("click", () => handlers.onClick(d.domain_id));
        }
        host.appendChild(node);
        return;
      }
      for (const d of scene.domains){
        const g = planRect(node, d.rect, k,
          {hit:true, state:d.state, dashed:d.example, strong:d.reachable});
        add(g, "text", {x:d.rect.x + 2.6*k, y:d.rect.y + 5*k, fill:INK,
          "font-size":3.4*k, "font-weight":600}, label(d.label));
        /* 상태는 왼쪽 띠가 색으로, 이 줄이 글자로 말한다. 둘 중 하나만 두면
           색맹이거나 인쇄된 화면에서 뜻이 사라진다. */
        add(g, "text", {x:d.rect.x + 2.6*k, y:d.rect.y + 9.4*k,
          fill:LINE[d.state] || INK2, "font-size":2.6*k, "font-weight":600},
          T("map.state." + d.state));
        add(g, "text", {x:d.rect.x + 2.6*k, y:d.rect.y + 13*k, fill:INK2,
          "font-size":2.6*k},
          `${T("dom.zones")} ${d.zone_count} · ${T("dom.levels")} ${d.level_count}`);
        add(g, "text", {x:d.rect.x + 2.6*k, y:d.rect.y + 16.6*k, fill:INK2,
          "font-size":2.6*k},
          `${T("zone.discovered")} ${d.discovered_count}/${d.declared_count}`);
        /* 예시 표시는 카드 **아래쪽**에 둔다. 제목 줄 오른쪽에 두면 이름이 긴
           도메인에서 제목 위에 겹쳐 둘 다 못 읽는다 — 실제로 그렇게 났다. */
        if (d.example)
          add(g, "text", {x:d.rect.x + 2.6*k, y:d.rect.y + d.rect.h - 2*k, fill:INK3,
            "font-size":2.4*k}, T("dom.example"));
        g.addEventListener("mousemove", (e) => handlers.onHover(d, e));
        g.addEventListener("mouseleave", () => handlers.onLeave());
        g.addEventListener("click", () => handlers.onClick(d.domain_id));
      }
      host.appendChild(node);
    },

    /** 도메인 하나 — 그 안의 구역. `levelId` 가 있으면 그 층만 그린다. */
    drawDomain(host, domain, handlers, levelId){
      host.textContent = "";
      const levels = domain.levels || [];
      const shown = levelId
        ? domain.zones.filter(z => z.level_id === levelId)
        : domain.zones;
      if (!shown.length){ host.innerHTML = `<div class="empty">${esc(T("app.none"))}</div>`; return; }

      const level = levels.find(l => l.level_id === levelId);
      const yOff = level ? (level.y_offset || 0) : 0;
      const height = levelId
        ? Math.max(...shown.map(z => z.rect.y + z.rect.h)) - yOff
        : domain.space.height;
      const space = {width: domain.space.width, height: Math.max(height, 1)};
      const k = scaleOf(space);
      const node = stage(space, 4*k);
      const g0 = add(node, "g", {transform:`translate(0,${-yOff})`});

      /* AP 커버리지를 먼저 깔아 구역 크기의 근거를 눈에 보이게 한다. */
      const rf = domain.rf || {};
      for (const z of shown){
        const wifi = z.wifi || {};
        const model = rf[wifi.rf];
        if (!wifi.at || !model || !model.radius_m) continue;
        add(g0, "circle", {cx:wifi.at.x, cy:wifi.at.y, r:model.radius_m.handover,
          fill:"#1565c00f", stroke:"#1565c066", "stroke-width":0.25*k,
          "stroke-dasharray":`${1.2*k} ${1.2*k}`});
      }
      for (const z of shown){
        const g = planRect(g0, z.rect, k, {hit:true, state:z.state,
          dashed:z.verified === false, strong:z.reachable});
        mapText(g, {x:z.rect.x + 2*k, y:z.rect.y + 3.6*k, fill:INK,
          "font-size":2.6*k, "font-weight":600}, label(z.label), k);
        mapText(g, {x:z.rect.x + 2*k, y:z.rect.y + 6.4*k,
          fill:LINE[z.state] || INK2, "font-size":2*k, "font-weight":600},
          T("map.state." + z.state), k);
        /* 임무가 정해지면 그 구역에서 **무엇을 하는가**가 방 이름 자리에 온다.
           임무가 없으면 방 이름이다 — 둘을 함께 쌓으면 카드가 넘친다. */
        const work = (handlers.annotations || {})[z.zone_id];
        if (work && work.length){
          work.slice(0, 4).forEach((line, i) =>
            mapText(g, {x:z.rect.x + 2*k, y:z.rect.y + (9 + i * 2.8)*k,
              fill:INK2, "font-size":2*k}, `· ${line}`, k));
          if (work.length > 4)
            add(g, "text", {x:z.rect.x + 2*k, y:z.rect.y + (9 + 4 * 2.8)*k,
              fill:INK3, "font-size":2*k}, `+${work.length - 4}`);
        } else if ((z.rooms || []).length){
          add(g, "text", {x:z.rect.x + 2*k, y:z.rect.y + 9*k, fill:INK3,
            "font-size":2*k}, z.rooms.join(" "));
        }
        for (const i of (z.infrastructure || []))
          if (i.at) iconMarker(g, i.at.x, i.at.y, deviceKind({role:i.kind}), 3.4*k,
                               {color: INK3});
        for (const r of (z.robots || []))
          if (r.at) iconMarker(g, r.at.x, r.at.y, deviceKind(r), 5.4*k,
            {color: r.presence === "discovered" ? INK : MUTE});
        g.addEventListener("mousemove", (e) => handlers.onHover(z, e));
        g.addEventListener("mouseleave", () => handlers.onLeave());
        g.addEventListener("click", () => handlers.onClick(z.zone_id));
      }

      /* 임무가 지날 구역 순서를 **미리** 긋는다. 지나갈 차례를 번호로 적고,
         실제 주행 경로가 아니라는 사실은 범례가 말한다 — 경로 계획은 우리
         소유가 아니다(AI-C-19). 순서에 있지만 이 층에 없는 구역은 건너뛴다. */
      if ((handlers.route || []).length > 1){
        /* 들르는 자리는 칸의 **아래쪽**이다. 가운데에 찍으면 번호가 그 칸의
           이름·상태·할 일 글자 위에 떨어져 둘 다 못 읽는다. */
        const centres = handlers.route
          .map(zoneId => shown.find(z => z.zone_id === zoneId))
          .filter(Boolean)
          .map(z => ({x: z.rect.x + z.rect.w / 2,
                      y: z.rect.y + z.rect.h * 0.82}));
        routeLine(g0, centres, k, {color: handlers.routeColor});
      }
      host.appendChild(node);
    },

    /** 구역 상세 — 로봇과 그 자리. 고정 장치는 끌어서 자리를 고칠 수 있다. */
    drawZone(host, zone, handlers){
      host.textContent = "";
      const space = {width: zone.rect.w, height: zone.rect.h};
      const k = scaleOf(space);
      const node = stage(space, 5*k);
      const g0 = add(node, "g", {transform:`translate(${-zone.rect.x},${-zone.rect.y})`});
      /* 도면처럼 — 상태 색으로 **칠하지 않는다**. Narchon 의 지도는 흰 바탕에
         가는 회색 선 한 겹이고, 상태는 지도 밖(칩·목록)이 말한다. 바닥을 상태
         색으로 칠하면 그 위의 검은 아이콘과 점선 경로가 둘 다 묻힌다.
         바깥 벽만 조금 굵게 둬서 "여기까지가 이 구역" 을 남긴다. */
      planRect(g0, zone.rect, k, {state:zone.state, strong:true});

      /* 1 격자가 몇 m 인지 알 수 있게 눈금과 축척을 같이 둔다. */
      const step = space.width > 200 ? 50 : 10;
      for (let gx = Math.ceil(zone.rect.x/step)*step; gx < zone.rect.x+zone.rect.w; gx += step)
        add(g0, "line", {x1:gx, y1:zone.rect.y, x2:gx, y2:zone.rect.y+zone.rect.h,
          stroke:"#f1f3f6", "stroke-width":0.13*k});
      for (let gy = Math.ceil(zone.rect.y/step)*step; gy < zone.rect.y+zone.rect.h; gy += step)
        add(g0, "line", {x1:zone.rect.x, y1:gy, x2:zone.rect.x+zone.rect.w, y2:gy,
          stroke:"#f1f3f6", "stroke-width":0.13*k});
      add(g0, "text", {x:zone.rect.x + 0.8*k, y:zone.rect.y + zone.rect.h - 0.8*k,
        fill:MUTE, "font-size":1.9*k}, `${step} ${zone.space.unit}`);

      /* 덮개 원은 **지금 그 라우터가 있는 자리**를 중심으로 그린다. 선언된
         자리에 고정하면, 사람이 라우터를 옮긴 뒤에도 덮개가 옛 자리에 남아
         핸드오버가 어디서 일어날지를 틀리게 보여 준다. */
      const ap = zone.access_point;
      const radii = (zone.rf || {}).radius_m;
      if (ap && ap.at && radii){
        for (const [name, r] of [["handover", radii.handover], ["excellent", radii.excellent]])
          add(g0, "circle", {cx:ap.at.x, cy:ap.at.y, r:r, fill:"none",
            stroke:name === "excellent" ? "#2f9e4466" : "#1565c055",
            "stroke-width":0.2*k, "stroke-dasharray":`${1.2*k} ${1.2*k}`});
      }

      const movable = new Set(zone.movable_devices || []);
      /* 라우터를 인프라와 **같은 고리**에서 돌린다. 따로 적으면 표시·호버·끌기를
         두 벌 유지해야 하고, 한쪽만 고쳐지는 일이 생긴다. */
      const placed = [...(zone.infrastructure || []), ...(ap ? [ap] : [])];
      for (const i of placed){
        if (!i.at) continue;
        /* 인프라는 로봇보다 **작고 옅게**. 같은 크기·같은 검정으로 찍으면
           "움직이는 것" 과 "붙박이" 가 지도에서 구별되지 않는다. */
        const m = iconMarker(g0, i.at.x, i.at.y, deviceKind({role:i.kind}), 4.4*k,
          {color: i.at_origin === "operator_edit" ? "#c07a16" : INK3});
        m.classList.add("zonehit");
        /* 이름은 **드문 것에만** 붙인다. 문이 26개인 층에서 전부 이름을 달면
           글자끼리 겹쳐 하나도 못 읽는다 — 문은 자리와 커서로 알아보고, 이름은
           옆 목록이 말한다. 계단·엘리베이터처럼 몇 개 없는 것은 이름이 붙는다. */
        if (i.kind !== "door")
          add(g0, "text", {x:i.at.x + 3*k, y:i.at.y - 1.6*k, fill:INK3,
            "font-size":1.7*k}, i.id);
        if (i.pose && typeof i.pose.yaw_deg === "number"){
          const rad = (i.pose.yaw_deg - 90) * Math.PI / 180;
          add(g0, "line", {x1:i.at.x, y1:i.at.y,
            x2:i.at.x + Math.cos(rad)*4*k, y2:i.at.y + Math.sin(rad)*4*k,
            stroke:MUTE, "stroke-width":0.3*k, "stroke-dasharray":`${0.8*k} ${0.7*k}`});
        }
        m.addEventListener("mousemove", (e) => handlers.onDeviceHover(i, e));
        m.addEventListener("mouseleave", () => handlers.onLeave());
        if (movable.has(i.id) && handlers.onDeviceMoved){
          m.style.cursor = "grab";
          m.addEventListener("pointerdown", (event) => {
            event.preventDefault();
            hidePop();
            m.setPointerCapture(event.pointerId);
            const move = (ev) => {
              const at = toSpace(node, ev);
              m.setAttribute("transform",
                `translate(${at.x - i.at.x},${at.y - i.at.y})`);
            };
            const up = (ev) => {
              m.releasePointerCapture(event.pointerId);
              m.removeEventListener("pointermove", move);
              m.removeEventListener("pointerup", up);
              handlers.onDeviceMoved(i, toSpace(node, ev));
            };
            m.addEventListener("pointermove", move);
            m.addEventListener("pointerup", up);
          });
        }
      }

      /* 장소 지물 — 문·계단·엘리베이터. 장치보다 **작고 옅게** 그린다. 같은
         크기·같은 검정으로 찍으면 "거기 장치가 있다" 로 읽힌다. 고를 수 있는
         것이 아니므로 집히지도 않는다(`pointer-events:none`). */
      for (const place of (zone.landmarks || [])){
        if (!place.at) continue;
        const g = iconMarker(g0, place.at.x, place.at.y,
          deviceKind({role: place.kind}), 3.6*k, {color: MUTE});
        g.setAttribute("pointer-events", "none");
      }

      /* 계획된 순서를 **로봇보다 먼저** 그린다. 나중에 그리면 선이 아이콘
         위를 지나 로봇을 가린다. */
      if (handlers.route && handlers.route.length > 1)
        routeLine(g0, handlers.route, k, {color: handlers.routeColor});

      /* 탐지된 객체 — 장치와 **다른 모양**이다. 장치는 선언된 물건이고 객체는
         탐지로 생긴 것이라, 같은 그림으로 찍으면 "선언했는데 안 보이는 장치" 와
         "선언에 없는데 보이는 것" 이 섞인다. 크기를 아는 객체는 그 지름대로
         원을 그리고, 모르면 작은 점 하나다(미측정은 0 이 아니다). */
      for (const o of (handlers.objects || [])){
        if (!o.at) continue;
        const extent = Number(o.extent_m);
        const r = Number.isFinite(extent) && extent > 0 ? extent / 2 : 0.9 * k;
        const g = add(g0, "g", {class:"zonehit"});
        add(g, "circle", {cx:o.at.x, cy:o.at.y, r,
          fill:"#2d8eff22", stroke:ACCENT, "stroke-width":0.3 * k,
          "stroke-dasharray":o.human_corrected ? "none" : `${1 * k} ${0.8 * k}`});
        add(g, "circle", {cx:o.at.x, cy:o.at.y, r:0.5 * k, fill:ACCENT});
        mapText(g, {x:o.at.x + r + 0.8 * k, y:o.at.y + 0.7 * k, fill:INK2,
          "font-size":1.9 * k},
          o.semantic_class || T("obj.unknownClass"), k);
        g.addEventListener("mousemove", (event) => {
          if (handlers.onObjectHover) handlers.onObjectHover(o, event);
        });
        g.addEventListener("mouseleave", () => handlers.onLeave());
      }

      const unplaced = [];
      for (const r of (zone.robots || [])){
        if (!r.at){ unplaced.push(r); continue; }
        const seen = r.presence === "discovered";
        const selected = handlers.selected === r.node_id;
        const lastSeen = r.at_origin === "last_seen";
        if (selected)
          add(g0, "circle", {cx:r.at.x, cy:r.at.y, r:4.6*k, fill:"none",
            stroke:"#e2544c", "stroke-width":0.5*k});
        /* 닿지 않는 로봇은 **마지막으로 알린 자리**에 점선 고리로 남는다. 지도에서
           지우면 "어디서 잃어버렸는가" 를 아무도 모르게 되고, 선언된 자리로
           되돌리면 지금 거기 있는 것처럼 보인다 — 둘 다 틀렸다. */
        if (lastSeen)
          add(g0, "circle", {cx:r.at.x, cy:r.at.y, r:4.2*k, fill:"none",
            stroke:MUTE, "stroke-width":0.35*k,
            "stroke-dasharray":`${1.2*k} ${1*k}`});
        /* 공지가 오지 않은 로봇은 **색이 빠진다**. 검게 찍으면 선언만 된 로봇이
           지금 거기 있는 로봇처럼 읽힌다. */
        const m = iconMarker(g0, r.at.x, r.at.y, deviceKind(r), 7.2*k,
                             {color: seen ? INK : MUTE});
        m.classList.add("zonehit");
        nameTag(g0, r.at.x, r.at.y + 4.2*k,
          lastSeen ? `${r.node_id} · ${T("robot.lastKnown")}` : r.node_id,
          k, selected);
        m.addEventListener("mousemove", (e) => handlers.onRobotHover(r, e));
        m.addEventListener("mouseleave", () => handlers.onLeave());
        m.addEventListener("click", () => handlers.onRobotClick(r.node_id));
      }
      host.appendChild(node);
      if (unplaced.length && handlers.onUnplaced) handlers.onUnplaced(unplaced);
    },

    /** 서브태스크 그래프. 노드는 단계, 간선은 자료 흐름이다. */
    drawGraph(host, graph){
      host.textContent = "";
      const n = graph.nodes.length;
      if (!n){ host.innerHTML = `<div class="empty">${esc(T("app.none"))}</div>`; return; }
      const COL = 46, ROW = 30, PAD = 12;
      const width = PAD*2 + Math.max(1, n) * COL;
      const node = document.createElementNS(NS, "svg");
      node.setAttribute("class","stage");
      node.setAttribute("viewBox", `0 0 ${width} ${PAD*2 + ROW*2}`);
      const pos = {};
      graph.nodes.forEach((s, i) => {
        pos[s.subtask_id] = {x: PAD + COL*i + COL/2, y: PAD + ROW*0.6};
      });
      const defs = add(node, "defs", {});
      const mk = add(defs, "marker", {id:"arw", viewBox:"0 0 8 8", refX:7, refY:4,
        markerWidth:5, markerHeight:5, orient:"auto"});
      add(mk, "path", {d:"M0,0 L8,4 L0,8 z", fill:MUTE});

      /* 같은 쌍에 여러 자료가 흐르면 곡률을 달리해 겹치지 않게 한다. */
      const seen = {};
      for (const e of graph.edges){
        const a = pos[e.from], b = pos[e.to];
        if (!a || !b) continue;
        const key = e.from + ">" + e.to;
        const lift = (seen[key] = (seen[key] || 0) + 1);
        const span = Math.abs(b.x - a.x);
        const dy = -(6 + lift*5) * (span > COL ? 1.4 : 1);
        add(node, "path", {d:`M${a.x+5},${a.y} C${a.x+12},${a.y+dy} ${b.x-12},${b.y+dy} ${b.x-5},${b.y}`,
          fill:"none", stroke:MUTE, "stroke-width":0.6, "marker-end":"url(#arw)"});
        add(node, "text", {x:(a.x+b.x)/2, y:a.y + dy - 1, fill:INK3, "font-size":2.6,
          "text-anchor":"middle"}, e.item);
      }
      graph.nodes.forEach((s) => {
        const p = pos[s.subtask_id];
        const g = add(node, "g", {});
        add(g, "rect", {x:p.x - 19, y:p.y - 5, width:38, height:10, rx:1.2,
          fill:{ACTIVE:"#e9f7ec",DEGRADED:"#fdf3e2",DISABLED:"#fdecec"}[s.state] || "#f4f5f7",
          stroke:{ACTIVE:"#2f9e44",DEGRADED:"#e8a33d",DISABLED:"#e03131"}[s.state] || "#c6ccd3",
          "stroke-width":0.6});
        add(g, "text", {x:p.x, y:p.y - 0.6, fill:INK, "font-size":3,
          "text-anchor":"middle"}, s.action);
        add(g, "text", {x:p.x, y:p.y + 3.4, fill:INK2, "font-size":2.4,
          "text-anchor":"middle"},
          (s.runs_on || []).map(r => T("sub.runsOn." + r)).join(" + ") || "-");
      });
      host.appendChild(node);
    },
  };
})();

/** 화면 좌표를 그 SVG 의 좌표계로 되돌린다 — 끌어다 놓기가 실제 미터 값이 되게. */
function toSpace(svg, event){
  const pt = svg.createSVGPoint();
  pt.x = event.clientX; pt.y = event.clientY;
  const p = pt.matrixTransform(svg.getScreenCTM().inverse());
  return {x: Math.round(p.x * 10) / 10, y: Math.round(p.y * 10) / 10};
}

const Map3D = SvgMapRenderer;   /* 교체 지점: 여기 한 줄만 다른 렌더러로 바꾼다. */

/* ===========================================================================
   팝업
   =========================================================================== */
function showPop(html, event){
  const p = el("pop");
  p.innerHTML = html;
  p.style.display = "block";
  const r = p.getBoundingClientRect();
  let x = event.clientX + 16, y = event.clientY + 14;
  if (x + r.width > window.innerWidth - 8) x = event.clientX - r.width - 12;
  if (y + r.height > window.innerHeight - 8) y = event.clientY - r.height - 12;
  p.style.left = Math.max(8, x) + "px";
  p.style.top = Math.max(8, y) + "px";
}
const hidePop = () => { el("pop").style.display = "none"; };

/* ===========================================================================
   Flow — 연결된 팝업

   드릴을 탭으로 하지 않는다. 도메인을 누르면 구역 팝업이 뜨고, 거기서 장치를
   누르면 장치 팝업이 그 옆에 뜨며, 둘은 선으로 이어진다. 탭으로 갈아타면 어디서
   왔는지가 사라지지만, 선으로 이어 두면 경로가 화면에 남는다.

   왜 이 모양인가 — 다중 로봇 관제 연구가 반복해서 말하는 것은 자동화가 작업
   부하를 줄이는 대신 **상황인식을 깎는다**는 것이다(Trouvain & Wolf). 그 깎임을
   막은 설계들은 공통적으로 지각 → 이해 → 예측의 세 층을 화면에 남겼다. 팝업을
   닫지 않고 쌓아 두는 것이 그 세 층을 한 화면에 두는 방법이다 — 무엇을 보고
   (지각) 무엇이 가능하며(이해) 적용하면 무엇이 달라지는지(예측)가 나란히 선다.

   가시화 파트의 노드 그래프 화면과 같은 생각이다(third_party/vz-web-dashboard 의
   `canvas__edges`): 카드가 놓이고 그 사이를 선이 잇는다. 다른 점은 우리 카드가
   끌어 옮겨진다는 것이고, 그래서 선을 자리마다 다시 그린다.
   =========================================================================== */
const Flow = (() => {
  /* id → {node, parent, el} */
  const open = new Map();
  let seq = 0;

  const host = () => el("flow");
  const edges = () => el("flowEdges");

  /* 부모 옆에 놓는다. 부모가 없으면 화면 가운데 위쪽에서 시작한다. */
  function placeNear(parentId, width){
    const area = host().getBoundingClientRect();
    const parent = parentId && open.get(parentId);
    if (!parent) return {x: Math.max(16, area.width / 2 - width / 2), y: 72};
    const r = parent.el.getBoundingClientRect();
    let x = r.right - area.left + 34;
    let y = r.top - area.top + 18;
    /* 오른쪽이 모자라면 왼쪽으로 보낸다. 화면 밖에 뜬 팝업은 없는 것과 같다. */
    if (x + width > area.width - 16) x = Math.max(16, r.left - area.left - width - 34);
    /* 같은 부모에서 여럿이 열리면 겹치지 않게 내린다. */
    const siblings = [...open.values()].filter(p => p.parent === parentId).length;
    y += siblings * 26;
    return {x, y: Math.min(y, Math.max(16, area.height - 160))};
  }

  function drag(card, header){
    let from = null;
    header.addEventListener("pointerdown", (event) => {
      if (event.target.closest("button")) return;
      const r = card.getBoundingClientRect();
      const area = host().getBoundingClientRect();
      from = {dx: event.clientX - r.left, dy: event.clientY - r.top, area};
      header.setPointerCapture(event.pointerId);
    });
    header.addEventListener("pointermove", (event) => {
      if (!from) return;
      card.style.left = (event.clientX - from.area.left - from.dx) + "px";
      card.style.top = (event.clientY - from.area.top - from.dy) + "px";
      redraw();
    });
    const stop = () => { from = null; };
    header.addEventListener("pointerup", stop);
    header.addEventListener("pointercancel", stop);
  }

  /* 선은 부모의 오른쪽 가장자리에서 자식의 왼쪽 가장자리로 흐른다. */
  function redraw(){
    const svg = edges();
    const area = host().getBoundingClientRect();
    svg.setAttribute("viewBox", `0 0 ${area.width} ${area.height}`);
    svg.textContent = "";
    for (const item of open.values()){
      const parent = item.parent && open.get(item.parent);
      if (!parent) continue;
      const a = parent.el.getBoundingClientRect();
      const b = item.el.getBoundingClientRect();
      const ax = (a.right < b.left ? a.right : a.left) - area.left;
      const ay = a.top - area.top + 22;
      const bx = (a.right < b.left ? b.left : b.right) - area.left;
      const by = b.top - area.top + 22;
      const mid = (ax + bx) / 2;
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", `M ${ax} ${ay} C ${mid} ${ay} ${mid} ${by} ${bx} ${by}`);
      if (item.live) path.setAttribute("class", "live");
      svg.appendChild(path);
    }
  }

  /* 닫으면 **자식까지 함께** 닫는다. 부모가 사라진 자식은 어디서 왔는지 말할 수
     없고, 그 상태로 남으면 화면에 떠 있는 근거 없는 카드가 된다. */
  function close(id){
    for (const [key, item] of [...open.entries()])
      if (item.parent === id) close(key);
    const item = open.get(id);
    if (!item) return;
    item.el.remove();
    open.delete(id);
    if (typeof item.onClose === "function") item.onClose();
      redraw();
  }

  function closeAll(){
    for (const id of [...open.keys()]) close(id);
  }

  /* 같은 id 로 다시 열면 새로 띄우지 않고 내용만 갈아 끼운다 — 같은 것이 두 장
     떠 있으면 어느 쪽이 지금인지 알 수 없다. */
  function show(spec){
    const id = spec.id || `flow-${++seq}`;
    const existing = open.get(id);
    if (existing){
      fill(existing.el, spec, id);
      existing.live = !!spec.live;
      redraw();
      return id;
    }
    const card = document.createElement("div");
    card.className = "pop3 " + (spec.grade || "");
    card.style.width = (spec.width || 360) + "px";
    const at = spec.at || placeNear(spec.parent, spec.width || 360);
    card.style.left = at.x + "px";
    card.style.top = at.y + "px";
    fill(card, spec, id);
    host().appendChild(card);
    open.set(id, {el: card, parent: spec.parent || null, live: !!spec.live,
                  onClose: spec.onClose});
    drag(card, card.querySelector("header"));
    redraw();
    return id;
  }

  function fill(card, spec, id){
    const trail = spec.trail ? `<span class="trail">${esc(spec.trail)}</span>` : "";
    card.className = "pop3 " + (spec.grade || "");
    card.innerHTML = `
      <header><h4>${esc(spec.title || "")}</h4>${trail}
        <button data-close="1" aria-label="close">&times;</button></header>
      <div class="body"></div>
      ${spec.actions ? `<div class="acts"></div>` : ""}`;
    card.querySelector("[data-close]").addEventListener("click", () => close(id));
    const body = card.querySelector(".body");
    if (spec.host){
      /* 이미 있는 DOM 을 통째로 옮겨 담는다 — 기존 그리기 코드를 그대로 쓴다. */
      const node = el(spec.host);
      if (node) body.appendChild(node);
    } else {
      body.innerHTML = spec.body || "";
    }
    if (spec.actions){
      const acts = card.querySelector(".acts");
      for (const action of spec.actions){
        const button = document.createElement("button");
        button.className = action.danger ? "primary danger"
                         : action.primary ? "primary" : "ghost";
        button.textContent = action.label;
        if (action.disabled) button.disabled = true;
        button.addEventListener("click", () => action.run(id));
        acts.appendChild(button);
      }
    }
    if (typeof spec.mount === "function") spec.mount(body, id);
  }

  window.addEventListener("resize", redraw);
  return {show, close, closeAll, redraw, isOpen: (id) => open.has(id),
          count: () => open.size};
})();

/* ===========================================================================
   탭
   =========================================================================== */
const TABS = [
  /* 탭은 **하는 일**로 가른다. 전에는 드릴의 한 칸마다 탭이 하나씩 있어서(도메인
     / 구역 맵 / 구역 상세 / 로봇 / 서브태스크 …) 탭을 갈아타는 것이 곧 길을 잃는
     것이었다 — 어디서 왔는지가 사라진다. 드릴은 이제 연결된 팝업(Flow)이 맡고,
     탭은 "지금 무엇을 하러 왔는가" 여섯 가지만 남는다.

     `needs` 는 그 탭에 **들어갈 수 있는** 능력들이다. 하나도 없으면 탭 자체를
     그리지 않는다 — 누를 수 있는데 안이 전부 잠긴 탭은, 권한이 없다는 사실을
     누르고 나서야 알려 준다. **화면에서 숨기는 것은 접근 통제가 아니다** —
     실제 차단은 서버가 경로마다 능력으로 한다. 숨김은 보기 편하게 하는 것이다. */
  {id:"domains", key:"nav.domains"},
  {id:"mission", key:"nav.mission",
   needs:["may_issue_command", "may_see_internals"]},
  {id:"link", key:"nav.link"},
  /* 장치 관리 = 들이기·보정·학습·모델 교체 + 정답 만들기. 로봇을 **움직이는**
     일은 여기가 아니라 모니터링 화면의 아랫줄이다 — 한 로봇의 상태와 그 로봇을
     움직이는 판은 한 화면이어야 한다. 여기 남은 것은 로봇 한 대를 두고 하는
     일이 아니라 함대에 장치와 기능을 들이는 일이다. */
  {id:"control", key:"nav.control",
   needs:["may_onboard_device", "may_calibrate", "may_request_training",
          "may_deploy_model", "may_label_ground_truth"]},
  /* 계정 관리 탭은 **권한을 나누는** 화면이다. 지금은 나누지 않으므로 세우지
     않는다. 서버의 계정 경로는 그대로 있고 이 줄을 되살리면 다시 선다. */
];
const visibleTabs = () => TABS.filter(t => !t.needs || t.needs.some(may));

/* 드릴 칸은 탭이 **아니다**. 도메인 → 구역 맵 → 구역 → 장치는 한 탭 안에서
   깊어지는 한 길이고, 칸마다 탭을 두면 탭을 갈아타는 것이 곧 길을 잃는 것이다.
   그래서 이 칸들은 레일에 서지 않고, 어느 탭 **안에** 있는지만 적는다. 레일의
   선택 표시는 주인 탭에 그대로 남고 경로는 빵부스러기가 말한다. */
const DRILL = {map:"domains", zone:"domains", robot:"domains",
               sub:"mission", ev:"mission", trace:"mission", dev:"mission"};
let active = "domains";   /* 레일에서 선택된 탭 */
let shown = "domains";    /* 지금 보이는 칸 (드릴 칸일 수 있다) */
function renderTabs(){
  const host = el("tabs");
  host.textContent = "";
  for (const t of visibleTabs()){
    const b = document.createElement("button");
    /* vz 의 탭은 이름 아래에 그 탭이 무엇인지 한 줄을 더 둔다. 처음 보는 사람이
       누르기 전에 알 수 있어야 하고, 누른 뒤에 알게 하면 한 번 헛걸음한다. */
    /* 접었을 때는 짧은 이름만 남는다. 아이콘으로 바꾸지 않는 이유는 이 화면의
       규칙 그대로다 — 뜻을 그림에 맡기면 눌러 봐야 안다. */
    b.innerHTML = `<span class="full">${esc(T(t.key))}</span>`
      + `<span class="short">${esc(T(t.key + ".short") || T(t.key))}</span>`
      ;
    b.title = T(t.key);
    b.setAttribute("aria-selected", String(t.id === active));
    b.addEventListener("click", () => selectTab(t.id));
    host.appendChild(b);
  }
}
function selectTab(id){
  const active0 = active;
  let owner = DRILL[id] || id;
  /* 로그아웃·역할 변경으로 보이지 않게 된 탭에 머물러 있으면 빈 화면이 남는다. */
  if (!visibleTabs().some(t => t.id === owner)){
    id = visibleTabs()[0].id;
    owner = id;
  }
  active = owner;
  shown = id;
  for (const panel of document.querySelectorAll("main > .panel"))
    panel.classList.toggle("on", panel.id === "p-" + id);
  renderTabs();
  paintCrumbs();
  /* 탭을 열었다는 것이 반영 요청이다. 열지 않은 탭은 아무 질의도 하지 않는다 —
     모든 화면을 상시 갱신하면 보고 있지 않은 구역의 추론까지 계속 돈다. */
  if (id === "ev") paintEvidence().catch(reportBoot);
  if (id === "dev") paintDev().catch(reportBoot);
  if (id === "mission") paintMission().catch(reportBoot);
  if (id === "accounts") paintAccounts().catch(reportBoot);
  if (id === "link") paintLink().catch(reportBoot);
  if (id === "control") paintOps().catch(reportBoot);
  /* 탭을 바꾸면 팝업을 접는다 — 다른 일을 하러 간 화면에 앞 일의 팝업이 떠
     있으면 그 선이 무엇을 가리키는지 알 수 없다. */
  if (owner !== active0) Flow.closeAll();
}

/* ── 장치 그림 — **선언한 것**을 그린다 ─────────────────────────────────
   아이콘은 제품 이름이 아니라 그 장치가 **스스로 선언한 태그**에서 고른다

   선언에 없는 장치는 추측하지 않고 물음표를 그린다 — 모르는 것은 모른다고

   그림은 글자를 **대신하지 않는다**. 이름이 늘 옆에 붙는다(색·그림만으로 뜻을

const deviceIcon = (kind, size) =>
  `<svg class="devicon" viewBox="0 0 24 24" width="${size || 22}" height="${size || 22}"
        fill="none" stroke="currentColor" stroke-width="1.7"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
    >${DEVICE_ICONS[kind] || DEVICE_ICONS.unknown}</svg>`;

/* 장치 종류 — **선언에서** 읽는다. 태그가 먼저이고 역할이 그 다음이다. 태그는
   그 장치가 자기 입으로 말한 것이고, 역할은 배치가 적어 둔 분류라서 더 거칠다. */
function deviceKind(row){
  const tags = ((row.resources || {}).tags) || [];
  if (tags.includes("locomotion.legged")) return "legged";
  if (tags.includes("locomotion.wheeled")) return "wheeled";
  if (tags.includes("locomotion.tracked")) return "wheeled";
  if (tags.includes("platform.uav")) return "uav";
  if (row.role === "uav") return "uav";
  if (row.role === "ugv") return "wheeled";
  if (row.role === "fixed_camera") return "camera";
  if (row.role === "fixed_manipulator") return "arm";
  if (row.role === "edge" || row.role === "server") return "rack";
  if (row.role === "access_point") return "ap";
  /* 장소 종류 — 가시화 파트의 `place.kind` 어휘를 그대로 받는다(문·계단·
     엘리베이터·지물). 그 어휘가 늘면 여기 한 줄이 늘고 코드 분기는 늘지 않는다. */
  if (row.role === "door") return "door";
  if (row.role === "stair") return "stair";
  if (row.role === "elevator") return "elevator";
  if (row.role === "landmark") return "landmark";
  return "unknown";
}

/* ── 도메인 상세 — 옆 칸 ────────────────────────────────────────────────
   전에는 이 칸이 **배치가 가진 도메인 목록**이었다. 목록은 지도가 이미 말하고
   있었고, 정작 "이 도메인이 어떤 곳인가"는 어디에도 없었다. 이제 이 칸은 **고른
   도메인 하나**를 말한다 — 구역이 몇이고, 어떤 로봇이 몇 대 탐지됐고, 지금
   상태가 어떤가.

   수는 전부 **두 개씩** 나온다(탐지 / 선언). 하나로 합치면 "선언했는데 안 보이는
   장치" 가 사라진다 — 그것이 대개 지금 손을 대야 하는 바로 그 장치다. */
async function paintDomainCard(domainId, host){
  const dom = (S.domains || []).find(d => d.domain_id === domainId);
  if (!dom){ host.innerHTML = `<div class="empty">${esc(T("app.none"))}</div>`; return; }
  const site = dom.site || {};
  const rf = Object.values(dom.rf || {})[0];

  host.innerHTML = `
    <div class="domcard">
      <div class="domhead">
        <h3>${esc(label(dom.label))}</h3>
        ${chip(ZONE_GRADE[dom.state], T("map.state." + dom.state))}
        ${dom.example ? chip("", T("dom.example")) : ""}
      </div>
      ${site.address ? `<div class="note">${esc(site.address)}</div>` : ""}
      <div class="domnums">
        <div><b>${esc(dom.zone_count)}</b><span>${esc(T("dom.zones"))}</span></div>
        <div><b>${esc(dom.level_count)}</b><span>${esc(T("dom.levels"))}</span></div>
        <div><b>${esc(dom.discovered_count)}</b><span>${esc(T("zone.discovered"))}</span></div>
      </div>
      ${meter("dom.reachableZones", dom.reachable_zone_count, dom.zone_count, "")}
      <div class="domsec">${esc(T("dom.zoneStates"))}</div>
      <div id="domZoneMix"><div class="note">${esc(T("app.loading"))}</div></div>
      <div class="domsec">${esc(T("dom.robotKinds"))}</div>
      <div id="domKinds"><div class="note">${esc(T("app.loading"))}</div></div>
      <div class="domsec">${esc(T("dom.infra"))}</div>
      <div id="domInfra"><div class="note">${esc(T("app.loading"))}</div></div>
      <div class="domsec">${esc(T("dom.plan"))}</div>
      <div id="domPlan"><div class="note">${esc(T("app.loading"))}</div></div>
      ${rf && rf.radius_m ? `<div class="note" style="margin-top:12px">
        ${esc(T("dom.rf.handover"))} ${esc(rf.radius_m.handover)} m ·
        ${esc(T("dom.profile"))} <code>${esc(dom.domain_profile || "-")}</code></div>` : ""}
      <div class="domacts">
        <button class="primary" data-open="${esc(dom.domain_id)}">${esc(T("dom.open"))}</button>
        ${(S.domains || []).length > 1
          ? `<select id="domPick">${(S.domains || []).map(d =>
              `<option value="${esc(d.domain_id)}" ${d.domain_id === domainId ? "selected" : ""}
                >${esc(label(d.label))}</option>`).join("")}</select>` : ""}
      </div>
    </div>`;

  const go = host.querySelector("button[data-open]");
  if (go) go.addEventListener("click", () => openDomain(domainId));
  const pick = host.querySelector("#domPick");
  if (pick) pick.addEventListener("change", (event) => {
    S.domainPick = event.target.value;
    paintDomainCard(S.domainPick, host).catch(reportBoot);
  });

  /* 구역 상태 구성 — 지도의 색과 **같은 어휘**다. 지도가 색으로 말한 것을 이
     띠가 수로 되풀이한다. */
  const zoneStates = dom.zone_states || null;
  if (zoneStates){
    el("domZoneMix").innerHTML = sbar(["operable", "limited", "idle", "no_robot"]
      .map(state => ({grade: ZONE_GRADE[state], label: T("map.state." + state),
                      n: zoneStates[state] || 0})));
  } else {
    /* 장면이 구역별 상태를 묶어 주지 않으면 도메인을 한 번 펴서 센다. */
    const scene = await api("/api/domain", {id: domainId}).catch(() => null);
    const zones = (scene && scene.zones) || [];
    el("domZoneMix").innerHTML = zones.length
      ? sbar(["operable", "limited", "idle", "no_robot"].map(state =>
          ({grade: ZONE_GRADE[state], label: T("map.state." + state),
            n: zones.filter(z => z.state === state).length})))
      : `<div class="note">${esc(T("app.none"))}</div>`;
  }

  /* 로봇 종류와 수 — 탐지 / 선언. 막대 길이는 **선언 수**이고 채워진 부분이
     **탐지된 수**다. 한 축이고, 부분과 전체다. */
  const rows = await fleetRows().catch(() => []);
  const mine = rows.filter(r => r.domain === domainId);
  const robots = mine.filter(r => r.kind === "robot");
  const groups = {};
  for (const row of robots){
    const kind = deviceKind(row);
    const group = groups[kind] || (groups[kind] = {declared: 0, seen: 0, rows: []});
    group.declared += 1;
    if (row.presence === "discovered") group.seen += 1;
    group.rows.push(row);
  }
  const kinds = Object.entries(groups).sort((a, b) => b[1].declared - a[1].declared);
  const widest = kinds.reduce((most, [, g]) => Math.max(most, g.declared), 0) || 1;
  el("domKinds").innerHTML = kinds.length
    ? `<div class="kindlist">${kinds.map(([kind, g]) => `
        <div class="kindrow" role="button" tabindex="0" data-kind="${esc(kind)}">
          <span class="ico">${deviceIcon(kind)}</span>
          <span class="nm">${esc(T("kind." + kind))}</span>
          <span class="ct"><b>${g.seen}</b> / ${g.declared}</span>
          <span class="br"><i style="width:${(g.declared / widest) * 100}%">
            <u style="width:${(g.seen / g.declared) * 100}%"></u></i></span>
        </div>`).join("")}</div>
       `
    : `<div class="note">${esc(T("dom.noRobots"))}</div>`;
  el("domKinds").querySelectorAll("[data-kind]").forEach(node => {
    const show = () => openFleetList(groups[node.dataset.kind].rows);
    node.addEventListener("click", show);
    node.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " "){ event.preventDefault(); show(); }
    });
  });

  /* 이 도메인 아래에 깔 도면이 선언돼 있는가. 없는 것도 정상이지만 그 사실이
     화면에 없으면 "왜 안 보이지" 에 답할 자리가 없다.

     도면은 대개 **층에** 걸린다(한 건물에 층마다 다른 도면이다). 도메인만 물으면
     층 도면이 있는 현장에서도 "없음" 이 나오므로 첫 층을 함께 묻는다. */
  const firstLevel = (dom.level_ids || [])[0] || null;
  MapBackground.declaration(domainId, firstLevel).then(image => {
    const box = el("domPlan");
    if (!box) return;
    box.innerHTML = image
      ? `<div class="fnrow">${chip("good", T("dom.planThere"))}
           <code>${esc(image.layer_id)}</code></div>
         <div class="note">${esc(image.source.name || "")}</div>`
      : `<div class="fnrow">${chip("", T("dom.planNone"))}</div>`;
  }).catch(() => null);

  /* 인프라는 로봇이 아니다. 같은 막대에 섞으면 "로봇 14대" 가 되어 버린다. */
  const infra = mine.filter(r => r.kind === "infrastructure");
  const infraGroups = {};
  for (const row of infra){
    const kind = deviceKind(row);
    infraGroups[kind] = (infraGroups[kind] || 0) + 1;
  }
  const infraRows = Object.entries(infraGroups).sort((a, b) => b[1] - a[1]);
  el("domInfra").innerHTML = infraRows.length
    ? `<div class="infralist">${infraRows.map(([kind, n]) =>
        `<span class="infra">${deviceIcon(kind, 18)}
          ${esc(T("kind." + kind))} <b>${n}</b></span>`).join("")}</div>`
    : `<div class="note">${esc(T("app.none"))}</div>`;
}
