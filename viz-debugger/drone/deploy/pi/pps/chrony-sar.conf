# /etc/chrony/conf.d/sar-pps.conf — Pi 시계를 GPS 에 µs 수준으로 (install.sh --with-pps 가 넣는다)
# FC 의 GPS 시각(MAVLink SYSTEM_TIME, sar-chrony.service)으로 「몇 초인지」, GPS 모듈 PPS 핀으로 「초가 바뀌는 순간」.
refclock SOCK /run/chrony.fc.sock refid FC noselect poll 2 offset 0.0
refclock PPS /dev/pps0 refid PPS lock FC prefer poll 2
# PPS 선이 아직 없으면: 위 PPS 줄을 지우고 FC 줄의 noselect 를 지운다(수 ms 수준)
makestep 0.5 -1
