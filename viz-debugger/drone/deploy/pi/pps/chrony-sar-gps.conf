# /etc/chrony/conf.d/sar-pps.conf — 방법 A: 시각용 GPS 를 Pi 에 직접 (UART NMEA + PPS)
# gpsd 가 NMEA 를 공유 메모리(SHM 0)로 chrony 에 넘긴다:  sudo apt install gpsd && /etc/default/gpsd 에 DEVICES="/dev/ttyAMA0"
refclock SHM 0 refid GPS noselect poll 2 offset 0.1
refclock PPS /dev/pps0 refid PPS lock GPS prefer poll 2
makestep 0.5 -1
