# drone-node.service 덮어쓰기 — 실행 명령만 sar_pass.agent 로 바꾼다 (HW 파일은 그대로)
# 설치: install.sh --with-agent  ·  되돌리기: sudo systemctl revert drone-node
[Service]
EnvironmentFile=/etc/sar-drone.env
ExecStart=
ExecStart=/bin/sh -c 'exec "$SAR_VENV/bin/python3" -u -m sar_pass.agent --node drone.drone_node:DroneNode'
ReadWritePaths=-/home/physical
