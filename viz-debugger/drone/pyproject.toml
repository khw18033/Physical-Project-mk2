[project]
name = "sar-pass"
version = "0.1.0"
description = "SAR 직선 패스 실행기 — CAP_ON 캡처 트리거, MAVSDK(PX4), GUI 상태 보고"
requires-python = ">=3.10"
dependencies = ["mavsdk-grpc>=3.0", "paho-mqtt>=2.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
