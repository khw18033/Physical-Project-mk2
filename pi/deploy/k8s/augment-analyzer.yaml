# 증강 기능 워크로드 (HW-C-03)
# ================================
# 상황 발생 시 엣지 K3s 가 말단에 배포하고 종료 시 제거하는 기능 컨테이너.
# 여기 들어가는 것은 "없어도 안전 루프가 깨지지 않는" 기능뿐이다 —
# AI 추론, 영상 분석, 심화 분석. 계측·임계판정·하트비트는 systemd 층이 담당한다.
#
# 배포:  kubectl apply -f augment-analyzer.yaml
# 제거:  kubectl delete -f augment-analyzer.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: augment-analyzer
  labels: { app: augment-analyzer, tier: augmentation }
spec:
  replicas: 1
  selector:
    matchLabels: { app: augment-analyzer }
  template:
    metadata:
      labels: { app: augment-analyzer, tier: augmentation }
    spec:
      # 말단에서 돌아야 의미가 있다. 엣지에 스케줄되면 현장 데이터에 닿지 못한다.
      nodeSelector:
        kubernetes.io/hostname: pi7
      terminationGracePeriodSeconds: 5
      containers:
        - name: analyzer
          # 이벤트 시점에 pull 하면 30~60초가 걸린다(SRS 9.2). 배포 전에 pre-pull 하고
          # IfNotPresent 로 두어 이벤트 때는 스케줄링만 일어나게 한다.
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "[증강] analyzer 기동 — node=$NODE_NAME"
              i=0
              while true; do
                i=$((i+1))
                echo "[증강] 분석 주기 $i"
                touch /tmp/alive
                sleep 5
              done
          env:
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
          # 폭주 컨테이너가 안전 루프(sensor/robot node)를 굶기지 못하게 상한을 건다.
          # SDD 7.3 — 상주 서비스에는 OOMScoreAdjust=-500 을 따로 걸어 두었다.
          resources:
            requests: { cpu: "50m",  memory: "32Mi" }
            limits:   { cpu: "500m", memory: "128Mi" }
          # 컨테이너 생존은 K3s 가 본다. 노드 생존은 HW-S-05 하트비트가 본다.
          # 둘은 다른 층이다(IF-K3S-3).
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "test -f /tmp/alive"]
            initialDelaySeconds: 5
            periodSeconds: 10
