[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-framework"
version = "0.1.0"
description = "AI/edge execution framework core - capability, provider and profile boundaries"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.20", "numpy>=1.26", "opencv-python>=4.9"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
# 현재 배포 프로파일이 선택한 전송 구현일 뿐, 프레임워크 필수 의존성이 아니다
# (AI-C-06, AI-C-12). 미설치 시 관련 provider만 비활성화된다 (AI-C-11).
mqtt = ["paho-mqtt>=2.1"]
kafka = ["kafka-python-ng>=2.2"]
otel = ["opentelemetry-sdk>=1.20", "opentelemetry-exporter-otlp-proto-grpc>=1.20"]
# K3s provider는 추가 파이썬 의존성 없이 kubectl CLI만 사용한다 (AI-B-10, 원칙 #12).

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_framework*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
