[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-framework"
version = "0.1.0"
description = "AI/edge execution framework core - capability, provider and profile boundaries"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_framework*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
